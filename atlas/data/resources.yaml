# 学习资源映射（skill id → 公开资源）
# ---------------------------------------------------------------------------
# 与 skills/*.yaml 解耦：改资源不动词典，改词典不动资源。
# 所有 URL 均以 curl 逐个验证过状态码；个别站点（OpenCV docs / Linux Foundation
# wiki）对自动请求返回 403，但浏览器访问正常，已在 label 中注明。
#
# kind 取值：course 课程/教材 · docs 官方文档 · repo 开源仓库 ·
#            paper 论文 · wiki 词条/速查 · tool 工具/项目
# ---------------------------------------------------------------------------

note: 每个技能对应的公开学习资源。所有 URL 均已逐个验证 HTTP 状态码。
kinds:
  course: 课程 / 教材
  docs: 官方文档
  repo: 开源仓库
  paper: 论文
  wiki: 词条 / 速查
  tool: 工具 / 项目
