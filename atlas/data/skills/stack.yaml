# ---------------------------------------------------------------- 硬件与总线

- id: imu
  name: IMU
  zh: 惯性测量单元
  full_name: Inertial Measurement Unit
  domain: robotics
  level: 进阶
  aliases: [IMU, 惯性测量单元, 惯性单元, 陀螺仪, 加速度计, 组合导航]
  what: 由陀螺仪 + 加速度计（常加磁力计）组成的姿态传感器 —— 机器人「感知自己怎么动」的核心器件。
  why: |
    任何会动的机器人都需要 IMU：双足要保持平衡、机械臂要知道自己姿态、
    无人机要稳定悬停。JD 里出现 IMU，说明这个岗位要跟**真实硬件**打交道，
    而不是只在仿真的理想环境里跑算法。
  how: |
    该学到什么程度（按岗位分）：
    - **算法岗**：理解 IMU 的 6 轴数据如何做姿态解算（互补滤波 / Mahony / Madgwick / 卡尔曼滤波），
      知道零偏、温漂、尺度因子误差怎么标定；
    - **系统岗**：知道 IMU 与轮式里程计、视觉、激光雷达怎么做**多传感器融合**（通常用 EKF 或 ESKF）；
    - **采购/产品岗**：认识主流器件（Bosch BMI088、InvenSense ICM 系列、Xsens 工业级），
      知道消费级和工业级差在哪、价格量级差多少。

    常见坑：
    1. 直接用未经标定的原始数据 —— 积分几步就漂到天上去；
    2. 在仿真里调好的参数换到真机就废 —— 因为仿真没有噪声和延迟；
    3. 忘记 IMU 和相机之间的**时延与外参标定**，融合后反而更差。
  prerequisite: [python, motion-control]
  learn_path:
    - 搞懂欧拉角 / 四元数 / 旋转矩阵的互相转换（这是所有姿态问题的基础）
    - 用现成 IMU 采一遍数据，手写互补滤波看姿态解算效果
    - 学卡尔曼滤波（先 1D，再扩展到 ESKF）
    - 做一次 IMU + 轮速计的融合定位小项目
  jd_phrases: [IMU, 惯性测量单元, 姿态解算, 多传感器融合, 标定]
  tags: [硬件, 传感器]

- id: fieldbus
  name: CAN / EtherCAT
  zh: 工业总线协议
  full_name: Fieldbus (CAN / EtherCAT / CANopen)
  domain: robotics
  level: 进阶
  aliases: [CAN, CANopen, EtherCAT, 总线, 现场总线, Modbus, RS485, 实时以太网]
  what: 机器人和产线上各部件互相通信的「神经系统」—— 控制器、驱动器、传感器通过它传递指令与状态。
  why: |
    这是硬件岗和运控岗的分水岭。会算法但不懂总线，就没法把算法真正接到电机上。
    JD 里出现 CAN 或 EtherCAT，基本意味着岗位要碰**实机联调**，而不是纯软件。
  how: |
    三个层次：
    - **CAN / CANopen**：汽车和中小型机器人的主流。学报文格式、波特率、ID 仲裁、
      PDO/SDO 对象字典。成本低，但带宽有限（1 Mbps 是常见上限）。
    - **EtherCAT**：工业机器人和高端产线的主流。基于以太网的实时总线，
      微秒级同步，几十个从站可以跑在同一条线上。学主站/从站结构、分布式时钟、
      PDO 映射。
    - **上位机调试**：会用 candump / cansend、Wireshark 抓包、厂商上位机
      （如汇川、雷赛、TwinCAT）定位通信故障。

    常见坑：报错第一反应是改代码，其实 90% 的问题在**接线、终端电阻、地线**上。
    CAN 总线两端必须各有一个 120Ω 终端电阻，缺一个就开始偶发丢包。
  prerequisite: []
  learn_path:
    - 弄清 CAN 与 EtherCAT 的本质区别（为什么后者能实时）
    - 用一块 CAN 转 USB 卡 + 一个驱动器，亲手发一条报文让电机转起来
    - 用 Wireshark 抓一次真实总线流量，读懂每一帧
    - 学一个工业主站软件（TwinCAT 或厂商上位机）的配置流程
  jd_phrases: [CAN, EtherCAT, 总线通信, 实时通信, 通信协议]
  tags: [硬件, 通信]

- id: embedded
  name: 嵌入式
  zh: 嵌入式系统 / 固件
  full_name: Embedded Systems & Firmware
  domain: robotics
  level: 高级
  aliases: [嵌入式, 固件, MCU, STM32, 单片机, 实时操作系统, RTOS, FreeRTOS, DSP, 底层驱动]
  what: 跑在机器人「小电脑」上的程序 —— 直接控制电机、读传感器、做硬实时的环路。
  why: |
    运控算法的**最终归宿**是嵌入式。同样的控制律，跑在 Linux 上延迟几毫秒，
    跑在 RTOS 上可以压到几十微秒 —— 而机器人稳定控制恰恰吃这个量级。
  how: |
    分层理解：
    - **应用层**：C/C++ 写控制逻辑，知道中断、定时器、DMA 怎么用；
    - **系统层**：RTOS（FreeRTOS / RT-Thread）的任务调度与优先级设计，
      理解"实时"不是"快"而是"确定性"；
    - **驱动层**：写电机驱动器、IMU、编码器的通信驱动（SPI/I2C/UART/CAN）。

    常见坑：在实时任务里做 malloc 和 printf —— 内存分配和串口输出都可能阻塞，
    直接把控制周期拖崩。实时任务里要预分配内存、用环形缓冲。
  prerequisite: [cpp, fieldbus]
  learn_path:
    - C 语言扎实到能读指针和位运算
    - 拿一块 STM32 开发板，点灯 → 串口 → 定时器中断 → PWM 驱动电机
    - 学 FreeRTOS 的任务、队列、信号量，做一个多任务小系统
    - 把一条 PID 控制环路跑通，并用示波器量真实延迟
  jd_phrases: [嵌入式开发, 固件, MCU, RTOS, 底层驱动]
  tags: [硬件, 编程]

- id: mech-design
  name: 结构设计
  zh: 机械结构 / 机构设计
  full_name: Mechanical & Structural Design
  domain: robotics
  level: 高级
  aliases: [结构设计, 机械设计, 机构设计, 传动设计, 减速器, 谐波减速, 结构工程师, CAD, 有限元]
  what: 把纸上的机器人变成能加工出来的实体 —— 关节怎么布置、刚度够不够、散热行不行。
  why: |
    人形机器人最难的往往不是算法而是**工程实现**：同样的运控算法，
    结构刚度差一点、惯量算错一点，走起来就是晃的。
  how: |
    - **设计**：SolidWorks / Creo 建模，懂公差配合、材料选型（铝合金 / 碳纤维 / 工程塑料）；
    - **传动**：谐波减速器、行星减速器、丝杠、同步带各自的场景与背隙特性；
    - **校核**：有限元分析（ANSYS / Abaqus）算强度刚度，模态分析避开共振；
    - **可制造性**：知道 CNC、压铸、3D 打印各自能做什么形状、成本差多少。

    常见坑：设计时只算静态强度，忽略了**动态惯量和共振** ——
    整机跑起来才发现某个频率下抖得厉害。
  prerequisite: []
  learn_path:
    - 学好理论力学 + 材料力学（这两门是地基，不能跳）
    - 用 CAD 完整设计一个二自由度机械臂并出图
    - 学一次有限元分析，做静力和模态两个算例
    - 做一台能动的实物（哪怕是 3D 打印的小车）
  jd_phrases: [结构设计, 机械设计, 传动, 减速器, 刚度]
  tags: [硬件, 设计]

# ---------------------------------------------------------------- AI 基础设施

- id: ai-infra
  name: AI Infra
  zh: AI 基础设施
  full_name: AI Infrastructure
  domain: ai
  level: 高级
  aliases: [AI Infra, AI基础设施, 训练框架, 推理引擎, 算力调度, 集群, 模型服务, 大规模训练]
  what: 让大规模模型能训得起来、跑得起来、serving 成本压得下来的那套工程体系。
  why: |
    这是当前最缺人、也最能拉开差距的方向。算法红利在消退，
    但**把模型跑快、跑便宜**的工程红利才刚开始。
    JD 里出现 AI Infra，通常意味着薪资与稀缺度都在算法岗之上。
  how: |
    四大块：
    - **训练侧**：数据并行 / 张量并行 / 流水线并行的取舍，ZeRO、FSDP、
      混合精度、梯度累积，以及通信开销怎么成为瓶颈；
    - **推理侧**：连续批处理（continuous batching）、PagedAttention、
      投机解码、量化（INT8/FP8/AWQ/GPTQ）、算子融合；
    - **调度**：GPU 资源池化（K8s + 设备插件）、抢占与排队、多租户隔离；
    - **可观测**：显存占用、MFU（模型算力利用率）、首 token 延迟 vs 吞吐的取舍。

    常见坑：只盯吞吐不看延迟，或者反过来 —— 这两个指标在生产里是**互相拉扯**的，
    必须按业务场景定 SLO 再调。
  prerequisite: [python, pytorch, cuda, linux]
  learn_path:
    - 先把单卡训练和推理跑顺，理解显存都花在哪了
    - 学分布式：从 DDP 开始，再到 FSDP / ZeRO
    - 读 vLLM 论文和源码（PagedAttention 是必读）
    - 亲手把一个模型的首 token 延迟压下去，记录每一步的效果
  jd_phrases: [AI Infra, 训练框架, 推理引擎, 算力调度, 大规模训练]
  tags: [基础设施, 高薪方向]

- id: rdma
  name: RDMA
  zh: RDMA / 高速网络
  full_name: Remote Direct Memory Access (InfiniBand / RoCE)
  domain: ai
  level: 专家
  aliases: [RDMA, RoCE, InfiniBand, IB网络, 高速网络, 无损网络, NCCL]
  what: 让一台机器的显存能直接读写另一台机器的显存，绕开 CPU 和操作系统内核 —— 分布式训练的血管。
  why: |
    千卡以上训练时，**通信往往比计算更慢**。不会 RDMA 调优，
    加卡不一定变快，甚至更慢。这是 AI Infra 岗位里最硬的技能之一。
  how: |
    - **原理**：零拷贝、内核旁路（kernel bypass）、单边操作（READ/WRITE）；
    - **两种路线**：InfiniBand（专用网络，贵、性能最好）vs RoCE（跑在以太网上，便宜、要调 PFC/ECN 做无损）；
    - **集合通信**：NCCL 的 AllReduce / AllGather / ReduceScatter，Ring vs Tree 算法，
      以及"为什么带宽翻倍但速度没翻倍"（答：comm/compute overlap 没做好）；
    - **排障**：`ibstat`、`perfquery`、NCCL_DEBUG 日志，区分是网络问题还是算法问题。

    常见坑：只测了单机带宽就以为万事大吉 —— 真实瓶颈常在**拓扑**上
    （跨 spine 交换机和同 leaf 下，性能差一倍以上）。
  prerequisite: [ai-infra, linux]
  learn_path:
    - 理解 AllReduce，能手推 Ring AllReduce 的通信量
    - 读 NCCL 官方文档，跑一次带宽测试（all_reduce_perf）
    - 学 RoCE 的无损配置：PFC、ECN、DCQCN 各自解决什么问题
    - 分析一次真实的 NCCL 慢日志，找出瓶颈在哪一层
  jd_phrases: [RDMA, RoCE, InfiniBand, NCCL, 集合通信]
  tags: [基础设施, 稀缺]

- id: inference-framework
  name: SGLang / vLLM
  zh: 推理服务框架
  full_name: LLM Serving Framework (SGLang / vLLM / TensorRT-LLM)
  domain: ai
  level: 高级
  aliases: [SGLang, vLLM, TensorRT-LLM, TGI, 推理框架, 模型部署, 高并发推理]
  what: 把训练好的大模型变成能扛住线上流量的推理服务的那层框架。
  why: |
    模型再强，服务端跑不动就是零。这类框架把 PagedAttention、
    连续批处理、前缀缓存都封装好了，但**怎么配、怎么调**仍然很吃经验。
  how: |
    - **vLLM**：社区最主流，PagedAttention 的原创实现，生态最全；
    - **SGLang**：主打 RadixAttention（前缀共享），在 Agent / 多轮对话场景优势明显；
    - **TensorRT-LLM**：NVIDIA 官方，性能上限高但生态封闭、适配成本高。

    该掌握：怎么根据显存和 SLO 算最大并发、KV Cache 怎么占显存、
    前缀缓存什么时候有效、什么时候该上量化。

    常见坑：直接开最大并发 —— 长请求会把显存吃光，
    短请求全被卡住。要按请求长度做**分桶调度**。
  prerequisite: [llm, pytorch, cuda]
  learn_path:
    - 用 vLLM 把一个开源模型跑起来，压测出吞吐-延迟曲线
    - 对比开启/关闭前缀缓存的效果，理解收益来自哪里
    - 学 KV Cache 的显存计算（这是所有调优的基础公式）
    - 试一次量化部署，比较精度损失和速度收益
  jd_phrases: [vLLM, SGLang, 推理框架, 模型部署, 高并发]
  tags: [基础设施, 落地]

- id: agent-framework
  name: Agent 框架
  zh: Agent 编排框架
  full_name: Agent Orchestration (LangGraph / LangChain)
  domain: ai
  level: 进阶
  aliases: [LangGraph, LangChain, LangSmith, LlamaIndex, AutoGen, CrewAI, 编排框架, 工作流编排]
  what: 把「大模型 + 工具 + 记忆 + 多步流程」串成一个能自己跑下去的应用的那套脚手架。
  why: |
    JD 里出现 Agent 的岗位，通常会同时要求会某个编排框架 ——
    因为从"能对话"到"能干活"，中间隔的就是编排。
  how: |
    - **LangChain**：生态最大、抽象最多，原型开发快，但抽象层厚、
      调试痛苦，复杂流程容易失控；
    - **LangGraph**：把流程显式建成图（节点 = 步骤，边 = 转移），
      支持循环、分支、人工介入、状态持久化 —— 生产环境更推荐；
    - **关键能力**：工具调用（function calling）的 schema 设计、
      多步任务的错误恢复、上下文管理与裁剪、以及**如何评测 Agent 效果**。

    常见坑：一上来就上多 Agent 协作 —— 复杂度指数上升但效果常常不如
    一个设计良好的单 Agent + 清晰的工具集。
  prerequisite: [llm, python, prompt-engineering]
  learn_path:
    - 先手写一个不带框架的 ReAct 循环，理解底层在做什么
    - 用 LangGraph 把同一个任务重写成图，体会状态管理的价值
    - 设计一套工具集，处理工具调用失败与重试
    - 建立评测集：同一任务跑 20 次，看成功率而不是看单次效果
  jd_phrases: [LangChain, LangGraph, Agent开发, 工作流编排, 工具调用]
  tags: [应用, 框架]

- id: comfyui
  name: ComfyUI
  zh: ComfyUI 工作流
  full_name: ComfyUI / Diffusion Workflow
  domain: ai
  level: 进阶
  aliases: [ComfyUI, WebUI, Stable Diffusion, SDXL, 工作流搭建, 节点式工作流]
  what: 用节点图的方式搭生成式图像/视频流水线 —— 每一环（模型、采样器、控制网）都是一个可替换的节点。
  why: |
    AIGC 岗位的高频要求。它代表的不只是会用一个软件，
    而是**理解扩散模型的每个组件在干什么**（不然搭不出可控的流水线）。
  how: |
    该掌握：模型加载与 LoRA 叠加、采样器与步数的取舍、ControlNet 做构图控制、
    图生图与局部重绘（inpainting）、以及把工作流导出成 API 供后端调用。

    进阶：理解 CFG scale 的作用、种子复现、显存优化（分块解码、模型卸载）。

    常见坑：把所有节点都拉到最高画质 —— 生成一张要几分钟，
    而实际业务里 80% 的图用低步数就够了，只有终稿才值得跑满。
  prerequisite: [python]
  learn_path:
    - 跑通一个官方示例工作流，搞清每个节点输入输出
    - 逐组件的做消融：去掉 ControlNet 看构图怎么变，调 CFG 看色彩怎么变
    - 用 LoRA 做一次风格定制
    - 把工作流封装成 API，接到自己的程序里
  jd_phrases: [ComfyUI, Stable Diffusion, 工作流, AIGC]
  tags: [应用, AIGC]

- id: benchmark
  name: 模型评测
  zh: 模型评测 / Benchmark
  full_name: Model Evaluation & Benchmarking
  domain: ai
  level: 进阶
  aliases: [Benchmark, 评测, 模型评估, 评估集, 榜单, 消融实验, A/B测试, 标注一致性]
  what: 用可复现的方式回答"这个模型/这个改动到底有没有变好"。
  why: |
    没有评测就没有迭代。这恰恰是多数团队最薄弱、也最需要人的环节 ——
    很多人会训练，但很少有人能设计出**真正有区分度**的评测集。
  how: |
    - **基准测试**：MMLU / GSM8K / HumanEval 这类公开榜单能横向比，
      但**不能替代自己的业务评测集**（榜单会被过拟合）；
    - **自建评测集**：从真实业务里采样，标注标准答案，
      关键是覆盖**难例和边界情况**，而不是堆数量；
    - **评估方法**：人工评分（贵但准）、模型评分（便宜但有偏）、
      规则匹配（廉价但窄），通常三者组合；
    - **统计意识**：样本量太小的时候，分数差异可能是噪声 —— 要算置信区间。

    常见坑：评测集和训练数据重叠，分数虚高却线上翻车。
  prerequisite: [data-analysis, python]
  learn_path:
    - 跑一次公开榜单，理解每个指标衡量什么
    - 从业务日志里抽 200 条，做一个自己的评测集
    - 设计评分标准，测一次标注一致性（多人标同一批看分歧）
    - 做 A/B 对比：两个版本各跑一遍，判断差异是否显著
  jd_phrases: [评测, Benchmark, 模型评估, 消融实验, 效果评估]
  tags: [方法, 质量]

# ---------------------------------------------------------------- 编程与工程

- id: go
  name: Go
  zh: Go 语言
  full_name: Go / Golang
  domain: data
  level: 进阶
  aliases: [Golang, Go语言, Go 语言, gin, go-zero]
  what: 为并发和云原生而生的编译型语言 —— 部署简单（单二进制）、并发模型清晰。
  why: |
    后端基础设施、Agent 服务、云原生组件的常用语言。
    JD 里出现 Go，通常意味着岗位要做**服务端或基础设施**，而不是算法。
  how: |
    - **语法**：极简，一天能上手；但接口设计和错误处理方式与 Python 差别很大；
    - **并发**：goroutine + channel 是核心，理解 CSP 模型、
      学会用 context 做超时与取消；
    - **工程**：模块管理（go mod）、依赖注入、测试与 benchmark、
      pprof 做性能分析。

    常见坑：goroutine 泄漏（起了不回收）、在 channel 上死锁 ——
    这两个是生产事故的高频来源。
  prerequisite: [linux]
  learn_path:
    - 语法速通，重点写接口和错误处理
    - 写一个并发爬虫，理解 goroutine 与 channel
    - 学 context 做超时控制和优雅退出
    - 用 pprof 分析一个慢接口
  jd_phrases: [Go, Golang, 后端开发, 服务端]
  tags: [编程]

