- id: rust
  name: Rust
  zh: Rust
  full_name: Rust
  domain: data
  level: 高级
  aliases: [Rust, cargo]
  what: 用编译期检查保证内存安全的系统级语言 —— 性能接近 C++，但没有悬垂指针和数据竞争。
  why: |
    机器人底层、高性能推理、基础设施的**新宠**。
    JD 里出现 Rust 往往是加分项，但它也常常暗示团队技术审美偏高。
  how: |
    - **核心难点**：所有权（ownership）、借用（borrowing）、生命周期 —— 这三关过了就入门了；
    - **并发**：Send/Sync trait，编译器帮你排除数据竞争，这是它最大的卖点；
    - **生态**：cargo 是所有语言里最好用的包管理器之一；
      异步用 tokio，与 Python 互操作用 pyo3。

    常见坑：跟编译器"搏斗"时本能地到处 clone 和上 Rc/RefCell ——
    能编译但丢掉了 Rust 的性能优势。要先想清楚数据的所有权归属。
  prerequisite: [linux]
  learn_path:
    - 通读官方 The Book，重点吃透所有权三章
    - 用 Rust 重写一个 Python 小工具，感受编译期检查
    - 学 tokio 写一个异步网络服务
    - 用 pyo3 写一个 Python 扩展模块
  jd_phrases: [Rust, 系统编程, 高性能]
  tags: [编程, 加分]

- id: typescript
  name: TypeScript
  zh: TypeScript
  full_name: TypeScript
  domain: data
  level: 进阶
  aliases: [TypeScript, TS, Node.js, NodeJS, React, Next.js, 前端]
  what: 给 JavaScript 加上类型系统的超集 —— 前端和全栈开发的事实标准。
  why: |
    AI 应用的产品化离不开前端。做 AI 产品的公司，
    前端/全栈岗大量存在，而且**离用户最近、话语权不小**。
  how: |
    - **类型系统**：泛型、联合类型、类型守卫、utility types ——
      这些是"会 TS"和"会写 JS"的区别；
    - **工程**：模块解析、构建工具（Vite）、状态管理、SSR（Next.js）；
    - **AI 场景**：流式输出（SSE / WebSocket）、Markdown 与代码高亮渲染、
      文件上传与预览。

    常见坑：到处写 `any` —— 等于用 TS 的语法写 JS，类型检查形同虚设。
  prerequisite: []
  learn_path:
    - 语法 + 类型系统基础，理解为什么需要类型
    - 用 React + TS 写一个可用的界面
    - 学流式响应，做一个打字机效果的 AI 对话页
    - 学 Next.js 做一次服务端渲染部署
  jd_phrases: [TypeScript, 前端, 全栈, React]
  tags: [编程]

- id: ci-cd
  name: CI/CD
  zh: 持续集成 / 持续交付
  full_name: Continuous Integration & Continuous Delivery
  domain: data
  level: 进阶
  aliases: [CI, CD, CI/CD, 持续集成, 持续交付, Jenkins, GitLab CI, GitHub Actions, 自动化测试]
  what: 每次提交自动跑测试、打包、部署 —— 让"能不能上线"从人工判断变成流水线判断。
  why: |
    这是"个人项目"和"工程团队"之间最明显的分界线。
    面试官问你有没有 CI，其实是在问：你的代码别人敢不敢用。
  how: |
    - **最小可用**：每次 push 自动跑单元测试 + lint，失败就拦住合并；
    - **进阶**：多环境（dev/staging/prod）、制品版本管理、
      灰度发布与回滚、密钥管理；
    - **认知**：CI 的价值不是"省事"，而是**把回归问题在合并前就暴露**，
      让主干始终可发布。

    常见坑：CI 只用来跑测试，不做制品管理 ——
    结果"测试通过"和"线上跑的那版"其实不是同一个二进制。
  prerequisite: [git, docker]
  learn_path:
    - 给一个自己的项目加 GitHub Actions，push 即跑测试
    - 加 lint 和类型检查，体验"卡在门口"的价值
    - 加构建产物上传，实现一次自动化发布
    - 学一个更重的工具（GitLab CI 或 Jenkins）的流水线语法
  jd_phrases: [CI/CD, 持续集成, 自动化构建, 流水线]
  tags: [工程实践]

- id: devops
  name: DevOps
  zh: DevOps / 云原生运维
  full_name: DevOps & Cloud Native Operations
  domain: data
  level: 高级
  aliases: [DevOps, 云原生, 容器编排, 服务网格, 监控告警, Prometheus, Grafana, 可观测性]
  what: 让服务能稳定跑在生产环境的那一整套实践 —— 部署、扩缩容、监控、告警、故障定位。
  why: |
    AI 产品的成本大头和大坑都在这里：GPU 资源浪费、服务雪崩、
    训练任务排队排到天荒地老。JD 里出现 DevOps 相关的词，
    说明这个岗位要为**线上结果**负责。
  how: |
    - **容器**：Docker 打包 + Kubernetes 编排（Pod / Deployment / Service / Ingress）；
    - **配置与发布**：Helm、GitOps、滚动更新与蓝绿部署；
    - **可观测**：Metrics（Prometheus）+ Logs（Loki/ELK）+ Traces（Jaeger），
      三者缺一不可 —— 光有监控不看日志，故障时还是瞎；
    - **SLO/SLI**：定义"多快算正常"，用错误预算驱动发布节奏。

    常见坑：告警配得太勤 —— 团队对告警脱敏，真出事时反而没人看。
  prerequisite: [docker, linux, ci-cd]
  learn_path:
    - Docker 打包自己的应用，理解镜像分层
    - 学 K8s 核心对象，把应用部署上去
    - 搭一套 Prometheus + Grafana 监控
    - 做一次故障演练：手动杀掉一个 Pod，看系统怎么自愈
  jd_phrases: [DevOps, 云原生, K8s, 监控告警, 可观测性]
  tags: [工程实践]

- id: middleware
  name: Redis / 中间件
  zh: 缓存与消息中间件
  full_name: Redis / Kafka / Message Queue
  domain: data
  level: 进阶
  aliases: [Redis, Kafka, RabbitMQ, 消息队列, MQ, 缓存, 分布式锁]
  what: 缓存、消息队列、分布式锁这些"粘合剂"组件 —— 单体架构不需要，上了规模就绕不过。
  why: |
    AI 应用一旦真上量就会遇到：同一个问题重复请求要缓存、
    长任务要异步队列、多实例要协调。这些场景全落在这层。
  how: |
    - **Redis**：不只是缓存 —— 还能做分布式锁、限流、排行榜、
      会话共享。要懂数据结构和过期策略，以及**缓存穿透/击穿/雪崩**的应对；
    - **Kafka**：高吞吐事件流，适合日志、埋点、异步任务。
      要懂分区、消费组、offset 与至少一次/恰好一次语义；
    - **选型判断**：什么时候用 Redis 队列就够了（简单、量小）、
      什么时候必须上 Kafka（吞吐大、要重放）。

    常见坑：把 Redis 当数据库用 —— 它默认会丢数据
    （持久化是异步的），关键数据落在它上面迟早出事。
  prerequisite: [linux]
  learn_path:
    - Redis 五种基础数据结构各用一个真实场景练一遍
    - 手写一个分布式锁，再学 Redlock 的争议在哪
    - Kafka 生产者消费者跑通，理解分区的意义
    - 压测一次，找出瓶颈在 Redis 还是在业务代码
  jd_phrases: [Redis, Kafka, 消息队列, 缓存, 中间件]
  tags: [工程实践]

- id: ai-coding
  name: AI 编程工具
  zh: AI 辅助编程
  full_name: AI-Assisted Development (Cursor / Claude Code)
  domain: data
  level: 入门
  aliases: [Cursor, Claude Code, GitHub Copilot, Copilot, AI编程, 智能编程助手, 代码补全]
  what: 把大模型接进开发流程的编程助手 —— 从补全单行代码到按需求改整个仓库。
  why: |
    JD 里主动写这个，说明团队**在意开发效率、也接受新工具** ——
    这本身就是个关于团队文化的信号。它已经从"加分项"变成很多岗位的默认前提。
  how: |
    - **三个层次**：补全（Tab 补代码）→ 对话（解释 / 改一段）→ 代理（给需求自动改多文件）；
    - **用得好 vs 用不好**：
      - 好的用法：写测试、做重构、读陌生代码库、写样板代码；
      - 危险的用法：让它在你不理解的领域直接产出 —— 会写出能编译但逻辑错的代码；
    - **核心技能其实是"提需求"和"审代码"**，而不是敲代码本身。

    常见坑：把它当搜索引擎用，而不是当需要 review 的初级同事 ——
    它生成的代码你仍然要负责。
  prerequisite: []
  learn_path:
    - 装一个工具，先用补全和对话两种模式各做一次真实任务
    - 练"给清晰的上下文"：把相关文件、约束、期望输出说清楚
    - 用它读一个你不熟的开源库，验证理解是否准确
    - 建立自己的 review 习惯：生成的代码必看 diff
  jd_phrases: [Cursor, Claude Code, Copilot, AI编程工具, 提效]
  tags: [工具, 效率]

# ---------------------------------------------------------------- 制造与质量

- id: quality-system
  name: 质量体系
  zh: 质量体系与认证
  full_name: Quality Management System (ISO 9001 / IATF 16949)
  domain: product
  level: 进阶
  # 注意：**不要**把裸「审核」当别名 —— JD 里「代码审核」「需求审核」很常见，
  #       与质量体系认证无关。
  aliases: [ISO9001, ISO 9001, IATF16949, IATF 16949, 质量体系, 质量管理, 体系认证, 内审, 客户审核]
  what: 一套证明"你的产品能稳定地做出来"的管理流程与认证体系。
  why: |
    硬件公司一旦要量产、要进车企供应链，就必须有这些认证。
    JD 里出现它，说明岗位要**对接量产和客户审核**，
    是产业岗（项目管理 / 质量 / 供应链）的核心要求。
  how: |
    - **ISO 9001**：通用质量管理体系，核心是"过程方法 + 持续改进"（PDCA）；
    - **IATF 16949**：汽车行业专用，比 ISO 9001 严得多，
      额外要求 APQP、PPAP、MSA、SPC、FMEA 五大工具；
    - **实际工作**：写体系文件、组织内审、接待客户审核、
      跟踪不符合项的整改闭环。

    常见坑：把体系当"写文档应付检查" —— 那样做出来的东西在真出质量事故时
    一点用都没有，客户审核也一问就露。
  prerequisite: [project-management]
  learn_path:
    - 搞懂 ISO 9001 的七项质量管理原则
    - 学汽车行业五大工具（APQP/PPAP/MSA/SPC/FMEA）各自解决什么
    - 读一份真实的体系文件，理解它和实际流程怎么对应
    - 参与一次内审，从检查表开始
  jd_phrases: [ISO9001, IATF16949, 质量体系, 体系认证]
  tags: [制造, 质量]

- id: fmea
  name: FMEA
  zh: 失效模式与影响分析
  full_name: Failure Mode and Effects Analysis
  domain: product
  level: 进阶
  # 注意：**不要**把裸「可靠性」当别名 —— 它出现在大量 JD 里描述系统属性，
  #       与 FMEA 这种具体方法无关（实测会虚增 10 个百分点）。
  aliases: [FMEA, PFMEA, DFMEA, 失效分析, 失效模式, 风险分析, RPN]
  what: 系统性地问"这里可能怎么坏、坏了多严重、多容易发生"，然后把资源压在高风险项上。
  why: |
    硬件产品的可靠性靠它保证。JD 里出现 FMEA，说明岗位要为
    **批量生产出的良率负责**，而不是只做原型。
  how: |
    - **两种**：DFMEA 管设计（这个结构会不会断），
      PFMEA 管过程（这道工序会不会做错）；
    - **打分**：严重度（S）× 发生度（O）× 探测度（D）= RPN，
      按 RPN 排序决定先改哪个；
    - **触发条件**：新设计、新工艺、客户投诉、质量事故后都要更新。

    常见坑：把它做成一次性文档 —— FMEA 是**活的**，
    每次出问题都应该回过头去改它，否则就是形式主义。
  prerequisite: [quality-system, mech-design]
  learn_path:
    - 理解 S/O/D 三个维度分别怎么打分
    - 拿一个真实产品（哪怕是电饭煲）做一次完整 FMEA
    - 学 RPN 阈值怎么定，什么分数必须立刻整改
    - 结合一次真实故障，倒推 FMEA 应该在哪一步拦住它
  jd_phrases: [FMEA, PFMEA, DFMEA, 失效分析, 可靠性]
  tags: [制造, 质量]
