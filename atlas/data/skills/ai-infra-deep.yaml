# ============================================================================
#  技能词典 · AI Infra 深水区
#  ---------------------------------------------------------------------------
#  为什么单独一批：
#
#  模型层的知识（Transformer / 微调 / RAG）已经被讲烂了，
#  但**推理与训练的工程实现**才是真正拉开工价的地方 ——
#  这一层「能区分"只懂模型"和"懂生产部署"的候选人」。
#
#  共同特点：
#    · JD 里通常只写成「熟悉推理优化」「有大规模训练经验」一行字；
#    · 面试会从「你做过什么」一路追问到原理，答不到第三层就露；
#    · 真正的门槛不在概念，而在**你知不知道每个选择的代价**。
# ============================================================================

label: AI Infra · 推理与训练深水区

skills:

- id: kv-cache
  name: KV Cache
  zh: 键值缓存及其演进
  full_name: KV Cache & Its Evolution (MHA → GQA → MLA)
  domain: ai
  level: 高级
  aliases: [KV Cache, KVCache, KV缓存, 键值缓存, GQA, MQA, MLA, 多头潜在注意力, 潜空间压缩, 跨层注意力, 显存优化]
  what: 自回归生成时缓存已算过的 Key/Value，避免每个新 token 都重算历史 —— 但它会随着上下文长度**线性膨胀**，成为显存头号开销。
  why: |
    **这是 2023-2026 年推理成本下降的技术主线**，也是长上下文能不能商用的决定因素。
    面试问 KV Cache，考的是你有没有真正算过显存账 ——
    不会算这个数，所有调优都是瞎猜。
  how: |
    - **先把账算清楚（必会）**：
      KV Cache 字节数 ≈ 2 × 层数 × KV头数 × 头维度 × 序列长度 × batch × 精度字节。
      这就是为什么 128k 上下文能吃光一整张卡。
    - **演进路线（面试高频）**：
      1. **MHA**（原始）：每个 attention head 各有一份 KV —— 最贵；
      2. **MQA**：所有 head 共享一份 KV —— 最省但掉点；
      3. **GQA**：分组共享（折中方案，已是主流模型的默认）；
      4. **MLA**（DeepSeek）：把 KV 压缩到低秩潜空间，
         **KV cache 缩减一个数量级**且几乎不掉性能 —— 这是目前最优雅的解法；
      5. 更前沿：跨层共享 KV、局部+全局注意力交错（Gemini 式方案）。
    - **三个必须同时看的指标**（这点极容易漏）：
      说一个模型「支持长上下文」，要同时给出
      **长上下文准确率 + 解码延迟 + 每 token 缓存字节数** ——
      只看最大长度是营销口径。
  prerequisite: [transformer, llm, cuda]
  learn_path:
    - 动手算一遍你常用模型的 KV Cache 占用（这是基本功）
    - 对比 MHA / GQA / MLA 三种结构的缓存大小与显存占用
    - 在 vLLM 里实测不同上下文长度下的显存曲线
    - 读 DeepSeek-V2 的 MLA 部分，理解低秩压缩怎么做到不掉点
  jd_phrases: [KV Cache, GQA, MLA, 显存优化, 长上下文, 推理优化, 高性能推理]
  tags: [推理, 核心]

- id: paged-attention
  name: PagedAttention
  zh: 分页注意力 / KV 显存分页
  full_name: PagedAttention
  domain: ai
  level: 高级
  aliases: [PagedAttention, 分页注意力, 显存分页, block管理, 显存碎片, vLLM核心]
  what: 借操作系统「虚拟内存分页」的思路管理 KV Cache —— 不再给每个请求预分配一整块连续显存，而是切成固定大小的 block 按需分配。
  why: |
    这是 **vLLM 的核心原理**，也是推理服务的基准线。
    它解决的是一个非常具体的浪费：传统做法按最大长度预分配，
      **实际显存利用率可能只有 40%**；
    分页之后碎片率降到 5% 以下，吞吐直接翻几倍。
    面试问它，考的是「你会不会算账、知不知道优化省在哪」。
  how: |
    - **问题长什么样**：传统方案给每个请求预留 max_len 大小的连续 KV 区。
      一个只用了 200 token 的请求，如果按 4096 预留 —— 95% 的显存白占。
      而且请求长短不一，还会产生**外部碎片**（块太小用不上）。
    - **解法**：把 KV 切成固定大小的 block（通常 16 或 32 token），
      用一张**页表**把逻辑位置映射到物理块，
      块之间不必连续。因此显存可以按需增长、随用随取。
    - **顺带得到的两个能力**：
      1. **前缀共享** —— 多个请求有相同系统提示词时，
         直接指向同一批物理块，不用各算一份；
      2. **并行采样** —— 一个 prompt 生成多个结果时共享前缀块。
    - **源码视角**：`block_manager` 负责块的分配/回收/映射，
      支持 block 级的前缀缓存。

    常见坑：以为它只是「省显存」。它更大的价值在于
    **让连续批处理成为可能** —— 没有分页，动态进出批次会立刻 OOM。
  prerequisite: [kv-cache, cuda, docker]
  learn_path:
    - 算一遍「预分配 vs 分页」的显存浪费对比（用真实请求长度分布）
    - 读 vLLM 的 block_manager 源码，理解页表映射
    - 实测开/关前缀缓存的吞吐差异
    - 观察 block size 取 8 / 16 / 32 对性能的影响
  jd_phrases: [PagedAttention, vLLM, 显存管理, 显存碎片, 吞吐优化]
  tags: [推理, 核心, 面试高频]

- id: continuous-batching
  name: 连续批处理
  zh: 连续批处理
  full_name: Continuous Batching
  domain: ai
  level: 高级
  aliases: [连续批处理, ContinuousBatching, 动态批处理, 批调度, iteration级调度, in-flight batching]
  what: 每个解码步都重新组批 —— 完成的请求立刻退出、排队的请求立刻补进来，而不是等一整批全部跑完。
  why: |
    **这一步的收益常被低估**。传统静态批次会让先完成的请求空等：
    一个 10 token 的请求如果和 500 token 的请求同批，
    它算完后 GPU 就在为它空转。
    连续批处理把「批」从请求粒度变成 **iteration 粒度**，吞吐提升非常可观。
  how: |
    - **调度器在每个 step 做什么**（这是核心逻辑）：
      1. 检查哪些请求已完成 → 释放它们的显存（尤其是 KV Cache）；
      2. 从队列里取新请求补进来 → 最大化 GPU 利用率；
      3. 动态调整 batch size，避免 OOM。
    - **为什么必须配合分页**：请求动态进出意味着 KV 长度参差不齐，
      不做分页管理就只能预留最大长度，等于白干。
      **连续批处理 + PagedAttention 是一对，不能拆开谈。**
    - **Ragged batch 问题**：不同长度混在一起会形成参差不齐的批。
      Attention 需要记录每个请求的边界，
      其他算子可以先拼接再统一处理。
    - **和延迟的取舍**：批次越大吞吐越高（一次权重读取服务更多序列），
      但延迟会变差。**交互式对话、离线批处理、RL rollout
      不应用同一组参数**。

    常见坑：只盯吞吐做压测。真实业务里首 token 延迟和 p99 尾延迟
    才是用户能感知的，而加大批次往往同时在恶化它们。
  prerequisite: [paged-attention, kv-cache]
  learn_path:
    - 理解静态批次的浪费发生在哪（画一个时间轴就清楚了）
    - 读 vLLM 调度器的 iteration 循环逻辑
    - 压测不同 batch size 下的吞吐 / TTFT / p99 延迟曲线
    - 为两个不同业务场景各选一组参数，说明理由
  jd_phrases: [连续批处理, 批调度, 吞吐优化, 动态批处理]
  tags: [推理, 核心]

- id: pd-disaggregation
  name: PD 分离
  zh: 预填充与解码分离部署
  full_name: Prefill-Decode Disaggregation
  domain: ai
  level: 专家
  aliases: [PD分离, PrefillDecode, 预填充解码分离, 阶段分离, 资源错配, KV传输]
  what: 把推理的两个阶段拆到**物理上不同的机器**上跑 —— 预填充用算力强的卡，解码用显存带宽大的卡，中间靠高速网络传 KV Cache。
  why: |
    这是一个很关键的认知：**预填充和解码是两种完全不同的负载**。
    - 预填充：知道整个 prompt，可以在序列维度并行 —— **算力受限**；
    - 解码：一次一个 token，不能并行 —— **显存带宽受限**。

    放在同一批卡上，两者会**互相干扰**：预填充的长任务会拖慢所有人的解码。
    分开部署能彻底消除这种干扰，让 token 生成速度变得稳定可预测。
  how: |
    - **架构**：
      - Prefill Worker 节点：高算力 GPU（H200/B200 这类），
        快速并行矩阵乘、快速生成 KV Cache；
      - Decode Worker 节点：高显存带宽节点，
        专做连续批处理和低延迟 token 流式输出；
      - 中间：预填充算完 KV 后，通过 **RDMA / PCIe** 把缓存状态传给解码节点。
    - **代价（必须一起说）**：多了一次 KV Cache 的网络传输，
      所以对网络带宽和延迟要求极高 —— **没有 RDMA 就别谈 PD 分离**。
      这也是为什么 RDMA 在 AI Infra 里是硬技能。
    - **什么时候值得**：请求长度差异大、并发高、
      且对尾延迟敏感的场景。否则单机连续批处理就够了。

    常见坑：盲目上 PD 分离 —— 小规模部署下，
    KV 传输的开销可能比收益还大。
  prerequisite: [continuous-batching, rdma, kv-cache]
  learn_path:
    - 先能解释「为什么预填充是算力受限、解码是带宽受限」
    - 算一次 KV Cache 传输量，判断网络能不能承受
    - 读一篇 PD 分离的工程实践文章，看它的资源配比怎么定
    - 对比同规模下单机方案与分离方案的尾延迟
  jd_phrases: [PD分离, 预填充, 解码, 分离部署, 资源调度]
  tags: [推理, 前沿, 稀缺]

- id: speculative-decoding
  name: 投机解码
  zh: 投机解码
  full_name: Speculative Decoding
  domain: ai
  level: 专家
  aliases: [投机解码, SpeculativeDecoding, 草稿模型, draft模型, 并行验证, Medusa, EAGLE, 推测解码]
  what: 用小模型快速「猜」出后面几个 token，再让大模型**一次前向并行验证** —— 猜对的直接采纳。
  why: |
    它有个别的加速手段没有的性质：**数学上保证输出分布不变**。
    蒸馏和剪枝都会改变模型行为，投机解码不会 ——
    这是它优于其他加速方案的关键，也是面试最常追问的点。
    典型收益 2-4 倍解码提速。
  how: |
    - **为什么能加速（关键洞察）**：
      它**并不缩短大模型单次前向的时间**。
      它做的是把「多个显存受限的单步」**合并成一次前向**——
      解码是带宽受限的，读一次权重只服务一个 token 太浪费；
      一次验证 5 个候选，等于同样的权重读取服务了更多 token。
    - **为什么分布不变**：验证时对每个候选 token 做接受/拒绝采样，
      拒绝时从**残差分布**里重新采。这个设计保证最终分布与目标模型完全一致。
    - **收益取决于什么**：草稿模型质量（越准接受率越高）、
      草稿成本、批次大小、目标硬件。
      **在输出可预测的任务上效果好，开放生成任务收益会下降。**
    - **改进方向**：Medusa（多解码头一次出多个候选）、
      EAGLE（在特征层做草稿）、Tree Attention（并行验证树形候选）。

    常见坑：以为它能降低延迟上限。它降低的是**单位 token 的平均成本**，
    不改变单次前向的耗时。高并发下收益也会被批次摊薄。
  prerequisite: [continuous-batching, kv-cache]
  learn_path:
    - 讲清楚「为什么不改变输出分布」（这是面试必答）
    - 理解「合并多个带宽受限步骤」这个加速本质
    - 实测一次：不同草稿模型下的接受率与净收益
    - 对比 Medusa / EAGLE 与朴素草稿模型的差别
  jd_phrases: [投机解码, 推测解码, 解码加速, Medusa, 草稿模型]
  tags: [推理, 面试高频]

- id: quantization
  name: 模型量化
  zh: 模型量化
  full_name: Model Quantization (PTQ / QAT / Mixed Precision)
  domain: ai
  level: 高级
  aliases: [量化, 模型压缩, PTQ, QAT, 后训练量化, 量化感知训练, GPTQ, AWQ, SmoothQuant, FP8, INT4, INT8, 校准]
  what: 把权重和激活从 16 位降到 8 位或 4 位 —— 显存占用和访存压力同步下降，硬件还有低精度算力加成。
  why: |
    最直接的降本路径，也是端侧部署的前提。
    但它的难点不在「会不会用工具」，而在**判断哪些层不能压**。
    面试问量化，问的是你有没有为精度损失做过归因。
  how: |
    - **两条技术路线（必分清楚）**：
      - **PTQ（后训练量化）**：门槛低、便宜，
        用一批校准数据统计激活分布，不需要重训；
      - **QAT（量化感知训练）**：效果好但成本高，
        在前向里模拟量化，用**直通估计器（STE）**
        绕过「量化操作不可导」的问题，让权重自己适应量化误差。
    - **方法谱系**：
      - GPTQ：用二阶信息逐层补偿累积误差；
      - AWQ：**激活感知**，对权重大的通道保留高精度；
      - SmoothQuant：通道级平滑，把激活的离群值转移给权重，
        让两者都好量化；
      - FP8：H100/H200 原生支持，精度损失小；
      - INT4：极致压缩，主要用于端侧。
    - **关键工程点**：**逐层敏感性分析** ——
      有些层（通常是首尾层和归一化附近）对量化极其敏感，
      这些层保留高精度，其余压到 4 位，是精度与成本的最佳折中。

    常见坑：看平均精度损失就下结论。
    整体掉 1% 可能意味着**某个关键能力掉了 20%** ——
    必须按能力维度分别评测，而不是只看总分。
  prerequisite: [llm, pytorch, benchmark]
  learn_path:
    - 分清 PTQ 与 QAT 的适用场景与成本
    - 用 GPTQ 或 AWQ 量化一个 7B 模型，做逐层敏感性分析
    - 按能力维度（推理 / 代码 / 长文）分别评测量化前后
    - 试一次混合精度：只把敏感层留在 FP16
  jd_phrases: [量化, GPTQ, AWQ, FP8, 模型压缩, 低精度]
  tags: [推理, 核心]

- id: parallelism
  name: 并行策略
  zh: 分布式训练并行策略
  full_name: Distributed Training Parallelism
  domain: ai
  level: 专家
  aliases: [并行策略, 数据并行, 张量并行, 流水线并行, 专家并行, TP, PP, DP, EP, ZeRO, FSDP, 3D并行, 通信重叠]
  what: 一张卡装不下模型时，怎么把模型和计算切到多卡上 —— 以及每种切法要付多少通信代价。
  why: |
    这是 AI Infra 的**主战场**，也是判断一个人是不是真做过大训练的分水岭。
    有一个值得记住的判断：具身智能的 GPT 时刻
    **一定是在千卡、万卡级别以上集群上训练出来的** ——
    而具身智能目前至少在数据规模上落后语言模型五年。
    不懂并行，就进不了这个级别的项目。
  how: |
    - **四种切法各自切什么、代价在哪**（这是核心框架）：
      | 切法 | 切什么 | 通信特点 |
      |---|---|---|
      | **DP** 数据并行 | 数据 | 每步 AllReduce 梯度，通信量随参数量线性增长 |
      | **TP** 张量并行 | 单层的权重矩阵 | 通信最频繁（每层都要），**必须走 NVLink** |
      | **PP** 流水线并行 | 按层切分 | 通信量小，但**有气泡**（bubble） |
      | **EP** 专家并行 | MoE 的专家 | 路由不均会导致负载倾斜 |
    - **ZeRO 三阶段**（省显存的核心手段）：
      逐步分片优化器状态 → 梯度 → 参数，
      显存缩减分别约为 **4x / 8x / 与卡数成线性**。
      这就是为什么现在能用普通卡训大模型。
    - **真正的难点是组合**：3D 并行（DP×TP×PP）的实际配置
      要在「显存够不够」和「通信扛不扛得住」之间找平衡。
    - **通信重叠（overlap）**：把通信藏到计算后面 ——
      「为什么带宽翻倍但速度没翻倍」，答案通常就在这没做好。
    - **MoE 的额外麻烦**：专家并行要处理**路由不均衡**，
      热门专家过载、冷门专家空转，需要加辅助负载均衡损失。
      这也催生了专门的通信库（如 DeepEP）。

    常见坑：只测单机带宽就以为万事大吉。真实瓶颈常在**拓扑**——
    跨 spine 交换机和同 leaf 下，性能能差一倍以上。
  prerequisite: [ai-infra, cuda, rdma, deep-learning]
  learn_path:
    - 先把 AllReduce 和 Ring AllReduce 手推一遍（通信量的公式是钥匙）
    - 从单卡 → DDP → ZeRO 三阶段，逐级实测显存变化
    - 用 Megatron 或 DeepSpeed 跑一次 TP+PP 的组合配置
    - 分析一次「加卡不变快」的案例，定位是通信、气泡还是负载不均
  jd_phrases: [分布式训练, 并行策略, ZeRO, 张量并行, 流水线并行, 大规模训练]
  tags: [训练, 核心, 高薪]

- id: collective-comm
  name: 集合通信
  zh: 集合通信原语
  full_name: Collective Communication Primitives
  domain: ai
  level: 高级
  aliases: [集合通信, AllReduce, AllGather, ReduceScatter, Broadcast, RingAllReduce, NCCL, 通信原语, 通信量]
  what: 多卡之间交换数据的基本操作 —— 看懂任何一篇并行策略论文的前提，是先掌握这套词汇。
  why: |
    这是 AI Infra 的**入门词汇表**，不懂就没法读论文、没法定位性能问题。
    而且通信量是可以手算的 —— 会算，才能在动手之前判断方案可不可行。
  how: |
    - **四个核心原语**：
      | 原语 | 做什么 | 典型用途 |
      |---|---|---|
      | **AllReduce** | 所有卡求和后广播给所有卡 | DP 的梯度同步 |
      | **AllGather** | 把所有卡的数据拼起来分给所有卡 | ZeRO 收集参数 |
      | **ReduceScatter** | 归约后按卡切片分发 | ZeRO 的梯度分片 |
      | **Broadcast** | 一个卡发给所有卡 | 参数初始化 |
    - **Ring AllReduce 的关键公式**（面试常考）：
      每卡传输开销 = **2 × (N−1) × X / N** 字节（X 是数据总量，N 是卡数）。
      这就是「**为什么环形算法能摊薄通信量**」的钥匙 ——
      当 N 很大时，每卡传输量趋近于 2X，与卡数无关。
    - **它能被拆成两步**：ReduceScatter + AllGather。
      理解这个等价关系，ZeRO 的分片逻辑就顺了。
    - **NCCL**：NVIDIA 的集合通信库，实际生产都靠它。
      要会用 `NCCL_DEBUG=INFO` 看日志、会跑 `all_reduce_perf` 测带宽。

    常见坑：把 AllReduce 当成一个原子操作 ——
    它内部是分阶段的，**慢的那一步往往是 ReduceScatter 或 AllGather 里的一环**，
    不拆开看就定位不到瓶颈。
  prerequisite: [parallelism, linux]
  learn_path:
    - 手推 Ring AllReduce 的通信量公式（这是最该先做的）
    - 用 torch.distributed 亲手跑一遍四个原语
    - 跑 NCCL 的带宽测试，对比单机 NVLink 和跨机 RDMA
    - 分析一次 NCCL 慢日志，判断是网络问题还是算法问题
  jd_phrases: [AllReduce, 集合通信, NCCL, 通信原语, 梯度同步]
  tags: [训练, 基础]

- id: prefix-caching
  name: 前缀缓存
  zh: 前缀缓存 / RadixAttention
  full_name: Prefix Caching & RadixAttention
  domain: ai
  level: 高级
  aliases: [前缀缓存, RadixAttention, 前缀复用, 系统提示缓存, 缓存命中, 缓存淘汰, 滚动哈希]
  what: 让多个请求**共享同一段前缀的 KV Cache**，只算一次 —— 系统提示词、API schema、固定文档都能复用。
  why: |
    这是**服务层而非模型层**的优化 ——
    恰恰是「只懂模型」和「懂生产部署」的分界线。
    在 Agent 场景下收益极其夸张：所有请求都带同一段长系统提示，
    不缓存等于每次都白算一遍。
  how: |
    - **技术构成**（三件套）：
      1. **滚动哈希** —— 给 token 序列算可增量更新的指纹，
         用来识别「这段前缀算过了」；
      2. **树形结构（Radix Tree）** —— 前缀天然是树形共享的，
         用基数树组织可以精确匹配最长公共前缀；
      3. **LRU 淘汰** —— 显存有限，冷门前缀要被换出去。
    - **什么时候收益最大**：
      - 长系统提示 + 大量并发（Agent、客服机器人）；
      - few-shot 示例固定；
      - 多轮对话（历史越长收益越大）；
      - RAG 场景中同样的检索文档反复使用。
    - **什么时候没收益**：每个请求前缀都不同（比如个性化 prompt 放最前面）。
      **顺序很重要** —— 把固定内容放前面、变量放后面，命中率天差地别。

    常见坑：把变量内容（用户 ID、时间戳）放在系统提示最前面 ——
    这会让每一个请求的前缀都不同，缓存命中率直接归零。
  prerequisite: [paged-attention, kv-cache, inference-framework]
  learn_path:
    - 理解「前缀共享」为什么能省掉整段 prefill 计算
    - 实测一次：开/关前缀缓存的 TTFT 差异
    - 刻意做一次反例实验（变量放最前），观察命中率塌陷
    - 读 SGLang 的 RadixAttention 设计文档
  jd_phrases: [前缀缓存, RadixAttention, 缓存复用, 缓存命中率]
  tags: [推理, 服务层]

- id: serving-metrics
  name: 推理指标
  zh: 推理服务的指标体系
  full_name: LLM Serving Metrics (TTFT / ITL / Throughput)
  domain: ai
  level: 进阶
  aliases: [TTFT, 首token延迟, 首包延迟, ITL, TPOT, 吞吐量, tokens每秒, p99延迟, 尾延迟, SLO, 质量回归]
  what: 衡量推理服务的三个互相拉扯的核心指标 —— 不搞清楚它们的取舍，所有调优都是瞎调。
  why: |
    这是一个非常实用的分水岭：**只看 tokens/s 会掩盖用户的真实等待**。
    面试里如果能主动拆开这三个指标讲，会明显区别于背概念的候选人。
  how: |
    - **三个指标各代表什么产品目标**：
      | 指标 | 含义 | 主导阶段 |
      |---|---|---|
      | **TTFT** 首 token 延迟 | 提交到收到第一个 token 的等待 | **Prefill 主导** |
      | **ITL** 词间延迟 | 后续 token 的节奏流畅度 | **Decode 主导** |
      | **吞吐** | 整体每秒 token 数 | 与批次大小强相关 |
    - **核心矛盾**：**加大批次能提升吞吐，但会恶化延迟和 KV 显存**。
      所以交互式对话、离线批处理、RL 采样
      **不该用同一组参数** —— 三者对三个指标的权重完全不同。
    - **必须看尾延迟**：p50 好看没用，用户记住的是 p99。
    - **完整压测该记录什么**（这是一个很能体现专业度的清单）：
      扫 prompt 长度 × 输出长度 × 并发数 × 精度四个维度，
      记录 **TTFT / ITL p50 与 p99 / 吞吐 / 峰值显存 / 质量回归**，
      并且把**排队、prefill、decode、通信**四个阶段的时间分开计。
      只报一个 tokens/s 等于什么都没说。

    常见坑：用单一「平均延迟」汇报性能。
    平均延迟会掩盖长尾，而长尾正是用户投诉的来源。
  prerequisite: [continuous-batching, benchmark]
  learn_path:
    - 能说清 TTFT 和 ITL 分别由哪个阶段主导
    - 做一次四维扫描压测，画出延迟-吞吐曲线
    - 找出你系统的「效率前沿」（再加大批次就开始亏）
    - 为交互式和离线两种场景各定一组 SLO 参数
  jd_phrases: [TTFT, 首token延迟, 吞吐, p99, 性能压测, SLO]
  tags: [服务, 实用]

- id: long-context
  name: 长上下文
  zh: 长上下文技术
  full_name: Long-Context Techniques
  domain: ai
  level: 专家
  aliases: [长上下文, 上下文窗口, 位置编码外推, RoPE外推, YaRN, 注意力稀疏化, 滑窗注意力, 线性注意力, 状态空间模型, 上下文扩展]
  what: 让模型能处理远超训练长度的输入 —— 难点不在「塞得下」，而在「塞进去之后还记得住」。
  why: |
    这是当前模型能力竞争最激烈的方向之一，也是**最容易被营销误导**的方向。
    面试问长上下文，考的是你知不知道「支持 1M 上下文」这句话背后
    哪些是真实能力、哪些是工程口径。
  how: |
    - **两条技术路线**：
      1. **压缩 KV**：GQA/MQA（减头）、MLA（压到潜空间）、
         跨层共享、滑窗注意力（截断历史）、
         局部+全局交错（少数层保留全注意力）；
      2. **改注意力结构**：稀疏注意力（BigBird / Longformer）、
         低秩近似、扩张式注意力（LongNet）、
         **线性注意力与状态空间模型**（把历史压成固定状态，
         代价是精确检索能力下降）。
    - **位置编码外推**：模型训练时只见过 4k 长度，
      直接喂 128k 会因为位置编码没外推过而崩掉。
      需要 RoPE scaling / YaRN 这类方法把频率调好。
    - **评测必须三个维度一起看**（这是最能体现判断力的地方）：
      **长上下文准确率 + 解码延迟 + 每 token 缓存字节数**。
      只报最大长度是营销，不是能力。
    - **经典的失效模式**：中间遗忘（lost in the middle）——
      把关键信息放在长文档中间，模型召回率明显低于首尾。

    常见坑：拿「大海捞针」（needle in a haystack）测试通过
    就宣称长上下文能力强。那测的是检索，不是推理 ——
    真实任务是需要在长文档里**综合多处信息做推理**。
  prerequisite: [kv-cache, transformer, benchmark]
  learn_path:
    - 理解「塞得下」和「记得住」是两件事
    - 学 RoPE 外推的基本原理（为什么不能直接拉长）
    - 自己测一次中间遗忘：关键信息放不同位置，看召回率变化
    - 对比一个真实长文档任务在不同注意力方案下的表现
  jd_phrases: [长上下文, 上下文窗口, 位置编码, 稀疏注意力, 注意力优化]
  tags: [模型, 前沿]

- id: mixed-precision
  name: 混合精度训练
  zh: 混合精度与训练稳定性
  full_name: Mixed Precision & Training Stability
  domain: ai
  level: 高级
  aliases: [混合精度, bfloat16, bf16, fp16, loss scaling, 梯度裁剪, 梯度消失, 数值溢出, 训练不稳定, 损失尖峰]
  what: 用低精度做计算、高精度做累加，同时保证训练不发散 —— 省显存省时间，但每一步都可能踩数值的坑。
  why: |
    这是**只有真跑过大规模训练才知道的那类知识**。
    论文里不会写，但训练崩过一次就永远记住了。
    「为什么我的 loss 突然变成 NaN」这个问题，
    能答出三个以上原因的人，基本可以确认真训过。
  how: |
    - **bf16 vs fp16（一个高频细节）**：
      bf16 的动态范围与 fp32 相同（8 位指数），
      所以**严格来说 bf16 不需要 loss scaling**；
      loss scaling 主要是解决 fp16 的问题（5 位指数，容易下溢）。
      能主动指出这一点，说明你是真懂而不是背的。
    - **常见的数值坑**：
      1. 梯度下溢／上溢 → loss scaling；
      2. 注意力分数在长序列上溢出 → 改用 online softmax / FlashAttention；
      3. LayerNorm 的方差在低精度下失真 → 保留 fp32 计算；
      4. 优化器状态累积误差 → 必须用 fp32 存优化器状态。
    - **损失尖峰（loss spike）的常见诱因**：
      坏数据（异常样本）、学习率过大、梯度裁剪阈值设置不当、
      数据顺序问题。处理手段是回滚到上一个 checkpoint 并跳过错样本。
    - **梯度裁剪**：按**全局范数**裁剪而不是逐元素，
      阈值通常 1.0，是防发散最便宜的手段。

    常见坑：为了省显存把优化器状态也压成 bf16 ——
    Adam 的二阶矩在低精度下噪声极大，训练会慢慢崩掉，
    而且崩得毫无征兆。
  prerequisite: [deep-learning, parallelism, pytorch]
  learn_path:
    - 分清 bf16 和 fp16 的动态范围差异（以及为什么前者不用 loss scaling）
    - 制造一次 loss 尖峰，记录排查过程
    - 理解 FlashAttention 的 online softmax 解决了什么数值问题
    - 只把优化器状态留在 fp32，测显存与稳定性的变化
  jd_phrases: [混合精度, 训练稳定性, 梯度裁剪, 数值精度, loss scaling]
  tags: [训练, 实战]

- id: moe
  name: MoE 混合专家
  zh: 混合专家架构
  full_name: Mixture of Experts
  domain: ai
  level: 专家
  aliases: [MoE, 混合专家, Mixture of Experts, 专家路由, 稀疏激活, 负载均衡, 专家并行, TopK路由, 门控网络]
  what: 把一个大 FFN 拆成很多「专家」，每个 token 只激活其中少数几个 —— 参数量很大但计算量很小。
  why: |
    这是当前大模型**在参数规模上继续堆叠的主要手段**，也是
    端侧部署的希望之一（总参数大但激活少）。
    但它的工程复杂度远高于稠密模型 —— 这是面试拉分点。
  how: |
    - **核心收益**：总参数量可以做到稠密模型的几倍，
      但每个 token 的计算量只取决于激活的专家数（通常 Top-2）。
      所以「模型很大但很便宜」。
    - **四个工程难题**（能说出三个就算过关）：
      1. **路由不均衡** —— 热门专家过载、冷门专家饿死，
         需要加辅助负载均衡损失（aux loss）或做容量因子限制；
      2. **专家并行通信** —— 专家分散在不同卡上，
         token 要按路由结果做 All-to-All 通信，这是专门的通信库
         （如 DeepEP）要解决的问题；
      3. **训练不稳定** —— 路由是离散选择，梯度不好传，
         需要噪声注入、STE 等技巧；
      4. **推理与训练不一致** —— 训练时专家会重排，
         推理时如果按稠密方式部署就白费了，必须专门做稀疏推理。
    - **和端侧的关系**：稀疏激活意味着「能装下大模型但推理便宜」，
      这对算力受限的机器人本体很有吸引力。

    常见坑：只看总参数量比较模型 ——
    MoE 的 671B 与稠密的 70B 在**单 token 计算量**上可能相当，
    直接比参数量是外行比法。
  prerequisite: [transformer, parallelism, distributed-training]
  learn_path:
    - 理解「总参数 vs 激活参数」的区别（这是最基本的口径）
    - 学一遍负载均衡损失为什么必要，去掉会怎样
    - 搞清楚专家并行的 All-to-All 通信模式
    - 读 DeepSeek-V3 的技术报告，看它的 MoE 工程细节
  jd_phrases: [MoE, 混合专家, 稀疏激活, 专家路由, 负载均衡]
  tags: [模型, 前沿]

- id: mcp
  name: MCP
  zh: 模型上下文协议
  full_name: Model Context Protocol
  domain: ai
  level: 进阶
  aliases: [MCP, ModelContextProtocol, 模型上下文协议, 工具协议, 工具接入标准, 上下文协议]
  what: 一套让大模型统一接入外部工具与数据的开放协议 —— 相当于给模型装外设的「USB 接口」。
  why: |
    它是 2025-2026 年 AI 应用层最显著的变化：
    把「每个模型各自定义工具格式」变成「一套协议大家都认」。
    JD 里出现 MCP，说明公司在做**真正的 Agent 产品**而不是套壳聊天。
  how: |
    - **解决什么问题**：过去接一个工具要针对每个模型写一套适配；
      MCP 把「模型 ↔ 工具」解耦成标准协议，
      工具方实现一次，所有支持 MCP 的客户端都能用。
    - **架构**：客户端（模型侧）↔ 服务端（工具/数据侧），
      暴露三类能力 —— **资源（Resources）**、
      **工具（Tools）**、**提示模板（Prompts）**。
    - **工程要点**：权限边界（能读什么、能写什么）、
      工具描述的质量（直接影响模型会不会正确调用）、
      错误处理与超时、以及**安全**（外部工具是不可信输入源）。
    - **和 Agent 框架的关系**：MCP 管「怎么接工具」，
      LangGraph 这类框架管「怎么编排流程」，两者互补。

    常见坑：工具描述写得含糊 —— 模型选错工具十有八九是描述问题，
    不是模型能力问题。
  prerequisite: [llm, agent-framework]
  learn_path:
    - 搞清 MCP 的客户端/服务端模型和三类能力
    - 写一个自己的 MCP 服务端（哪怕只暴露一个工具）
    - 调试一次「模型选错工具」，从描述找原因
    - 为工具设计权限边界与错误处理
  jd_phrases: [MCP, 工具调用, 协议, Agent集成]
  tags: [应用, 前沿]

- id: llm-app-platform
  name: LLM 应用平台
  zh: 大模型应用开发平台
  full_name: LLM Application Platforms
  domain: ai
  level: 进阶
  aliases: [Dify, Coze, 扣子, LangFlow, FastGPT, RAGFlow, 应用平台, 低代码LLM, 工作流平台]
  what: 把「提示词 + 知识库 + 工作流 + 部署」打包成一站式平台 —— 不写代码也能搭出可用的 AI 应用。
  why: |
    这类平台在**企业落地场景里出现频率极高**（尤其 ToB）。
    JD 里点名它，通常意味着要快速交付客户 PoC、
    或者要接手已有的工作流资产。
    对转行者来说它有个特殊价值：**能用它做出可展示的作品，而不用先成为算法工程师**。
  how: |
    - **典型能力**：可视化工作流编排、知识库（RAG 一条龙）、
      变量与条件分支、多模型切换、API 暴露、日志与标注。
    - **该掌握到什么程度**：不是会用界面，而是理解
      **它在什么时候会成为天花板** ——
      复杂状态管理、自定义算子、性能调优都会撞墙，
      这时必须能降级到代码（LangGraph 等）。
    - **选型判断**：Dify 偏综合与自部署、
      Coze 偏快速与生态、RAGFlow 偏文档解析质量。
      面试里能对比说出取舍，比只会用一个更有说服力。

    常见坑：只会拖拽，答不出「这个工作流实际发了多少次 LLM 调用、
    单次成本多少、p99 延迟多少」—— 面试一问就露。
  prerequisite: [rag, prompt-engineering]
  learn_path:
    - 用其中一个平台完整做一个应用（含知识库 + 工作流）
    - 数清它背后的实际 LLM 调用次数与成本
    - 找出一个它做不到、必须写代码的场景
    - 用代码重写同一个应用，对比两种方式的取舍
  jd_phrases: [Dify, Coze, 应用平台, 工作流, 低代码, 快速交付]
  tags: [应用, 落地]
