skills:

- id: dd
  name: 尽调
  zh: 尽职调查
  full_name: Due Diligence
  domain: investment
  level: 进阶
  aliases: [尽调, 尽职调查, DD, Due Diligence, 商业尽调, 财务尽调, 法务尽调]
  what: 投钱之前把目标公司查个底朝天 —— 业务是不是真的、账是不是真的、有没有雷。
  why: |
    投资岗最核心的日常动作，占工作量的 60% 以上。
    JD 里写「主导尽调」「独立完成尽调」，说明要的是能扛项目的人，不是打杂的。
  how: |
    三大块，通常分头进行：
    - 业务尽调（BDD）：市场空间、竞争格局、客户真实性、技术壁垒。
      关键手段是**访谈**：客户、供应商、前员工、行业专家；
    - 财务尽调（FDD）：收入确认真实吗？有没有关联交易？现金流对得上吗？
      重点是「收入质量」而不是「收入规模」；
    - 法律尽调（LDD）：股权结构、知识产权、诉讼、合规资质。

    输出物是尽调报告 + 投资建议书，要能回答一个问题：
    「如果这笔钱亏了，最可能是亏在哪。」

    常见坑：只看公司给的资料，不做第三方交叉验证。
    真正的雷往往藏在「公司没主动提」的地方 —— 所以要问「你最近丢过哪些大客户」，
    而不是「你的客户稳不稳」。
  prerequisite: [financial-analysis, industry-research]
  learn_path:
    - 学财务三张表，能看懂审计报告附注
    - 找一份真实的尽调报告（公开的招股书也类似）逐节研究结构
    - 练习提问：把「你想了解什么」转成「对方能回答的具体问题」
    - 做一次模拟尽调：选一家上市公司，用公开信息写一份投资建议
  jd_phrases: [尽调, 尽职调查, DD, 项目执行, 投资流程]
  tags: [核心, 必备]

- id: irr
  name: IRR
  zh: 内部收益率
  full_name: Internal Rate of Return
  domain: investment
  level: 进阶
  aliases: [IRR, 内部收益率, Internal Rate of Return, 收益率, 年化收益]
  what: 让一笔投资的净现值为零的那个折现率 —— 通俗说就是「这笔钱的年化收益率」。
  why: |
    投资行业最常被问到的指标。不管是基金业绩、项目回报还是内部考核，
    都绕不开它。面试里问 IRR 怎么算，几乎是必考题。
  how: |
    本质是解方程：让所有现金流（投出去的负、收回来的正）折现后加起来等于零的 r。

    理解三个关键点：
    1) IRR 是**年化**的 —— 3 年翻倍 ≈ 26%，5 年翻倍 ≈ 15%，时间越长年化越低；
    2) 它假设中间现金流能以 IRR 再投资 —— 这个假设往往不现实，
       所以早期项目 IRR 容易虚高；
    3) 无法直接比较不同期限的项目 —— 要用 IRR 配上年限看。

    实务上还会看净现值（NPV），因为 NPV 直接告诉你赚了多少钱。

    常见坑：把 IRR 当成「回报倍数」。
    3 倍回报听起来很爽，但如果花了 10 年，IRR 只有 11.6% —— 还不如买理财。
  prerequisite: [financial-analysis]
  learn_path:
    - 手算一次：投入 100 万，3 年后收回 200 万，IRR 是多少
    - 用 Excel 的 IRR/XIRR 函数验证，理解 XIRR 处理不规则现金流
    - 做敏感性分析：退出时间推迟一年，IRR 掉多少
  jd_phrases: [IRR, 收益率, 投资回报, 财务测算, 收益测算]
  tags: [核心, 必备]

- id: fund-metrics
  name: 基金业绩指标
  zh: DPI / TVPI / MOIC
  full_name: Fund Performance Metrics
  domain: investment
  level: 进阶
  aliases: [DPI, TVPI, MOIC, 回报倍数, 已分配收益, 基金业绩, 业绩归因]
  what: 衡量一只基金赚了多少的三个核心指标 —— 已经拿回多少钱、账面上值多少钱。
  why: |
    面试基金岗位一定会问。能说清 DPI 和 TVPI 的区别，
    就说明你理解「未退出的账面收益」和「真金白银」的差别。
  how: |
    三个指标要一起看：
    - **MOIC**（Multiple on Invested Capital）：总回报倍数 = 总价值 / 投入本金。
      最直观，但不考虑时间。
    - **DPI**（Distributions to Paid-In）：已分配 / 已投入。
      **只有 DPI 才是真赚到的钱** —— 现金已经分到 LP 手里了。
    - **TVPI**（Total Value to Paid-In）：总价值（已分配 + 未实现）/ 已投入。
      包含账面浮盈。

    三者关系：TVPI = DPI + RVPI（未实现部分）。
    实务中「账面很漂亮但 DPI 为 0」是常见现象 ——
    基金没退出，收益全是纸面的。LP 现在最看重的就是 DPI。

    常见坑：用 TVPI 吹业绩。行业里公认「DPI 才是硬通货」。
  prerequisite: [irr]
  learn_path:
    - 记清三个指标各自的分子分母
    - 理解「为什么 LP 越来越看重 DPI」
    - 练习：给一组现金流，算出 MOIC、IRR、DPI
  jd_phrases: [DPI, TVPI, MOIC, 回报倍数, 业绩指标]
  tags: [核心, 必备]

- id: term-sheet
  name: TS
  zh: 投资条款清单
  full_name: Term Sheet
  domain: investment
  level: 进阶
  aliases: [TS, Term Sheet, 投资条款清单, 条款清单, 投资协议, 优先清算权, 反稀释]
  what: 投资意向的「合同骨架」—— 估值多少、占多少股、有什么特殊权利，都写在这。
  why: |
    投资执行的核心交付物。看不懂 TS 就没法上谈判桌。
    涉及的核心条款是投资岗的必备常识，面试高频。
  how: |
    必须掌握的几条：
    - **估值与股权**：投前估值（Pre-money）vs 投后估值（Post-money）。
      投后 = 投前 + 本轮投资额。占股比 = 投资额 / 投后估值。
    - **优先清算权（Liquidation Preference）**：
      公司被卖掉时，投资人先拿回本金（1x）还是翻倍（2x）。
      1x 非参与型对创始人友好，参与型（participating）对投资人有利。
    - **反稀释（Anti-dilution）**：后续融资估值降低时怎么补偿。
      完全棘轮（full ratchet）对创始人极狠，加权平均（weighted average）较温和。
    - **领售权（Drag-along）**：多数股东决定卖公司时，可以强制小股东一起卖。
    - **回购权（Redemption）**：约定条件下要求公司/创始人回购股份。

    常见坑：只盯着估值，忽略条款。
    一个高估值配 2x 参与型清算，实际拿到的可能不如低估值配 1x。
  prerequisite: [valuation]
  learn_path:
    - 逐条搞懂上述五个核心条款的机制和影响
    - 找几份公开的 TS 模板（美国 NVCA 模板是行业标准）
    - 做情景计算：公司以不同价格被收购时，各条款下各方拿多少
  jd_phrases: [TS, Term Sheet, 条款清单, 投资协议, 交易结构]
  tags: [核心, 必备]

- id: fund-lifecycle
  name: 募投管退
  zh: 募投管退
  full_name: Fund Lifecycle
  domain: investment
  level: 进阶
  aliases: [募投管退, 募投管退全流程, 基金全流程, 投资全流程, 投后管理, 投后]
  what: 一只基金的完整生命周期 —— 募资、投资、管理、退出，四个环节。
  why: |
    这个词几乎出现在所有中高级投资岗的 JD 里。
    「有完整的募投管退经验」意味着你主导过从找项目到退出的全流程，
    这是从投资经理升到 VP/总监的硬门槛。
  how: |
    四个环节各自在做什么：
    - **募**（Fundraising）：向 LP 募资。需要业绩记录（track record）、
      投资策略、以及人脉。国资 LP 和市场化 LP 的诉求完全不同。
    - **投**（Investment）：找项目（sourcing）→ 立项 → 尽调 → 投决 → 交割。
      核心是判断力和项目源。
    - **管**（Post-investment）：投后管理。不只是「盯财报」，
      而是帮公司招人、对接客户、引荐下一轮投资人。
    - **退**（Exit）：IPO、并购、股权转让、回购。
      **退出才是真正赚钱的时刻**，但周期长、不可控。

    常见坑：新人往往只参与「投」，误以为这就是投资工作的全部。
    实际上「退」才是决定回报的关键，而它需要 5-10 年的等待。
  prerequisite: [dd, term-sheet]
  learn_path:
    - 建立全流程地图，理解每个环节的交付物是什么
    - 重点补「退」的部分：了解 IPO 流程、并购交易结构、S 基金
    - 思考一个问题：为什么很多基金「投得好但退不出」
  jd_phrases: [募投管退, 全流程, 投后管理, 项目退出, 基金管理]
  tags: [核心, 必备]

- id: valuation
  name: 估值
  zh: 估值
  full_name: Valuation
  domain: investment
  level: 进阶
  aliases: [估值, Valuation, 估值分析, 估值建模, 可比公司, DCF, PS倍数, PE倍数]
  what: 一家公司值多少钱 —— 既是一门技术，也是一门艺术。
  why: |
    投资岗的基本功。一级市场的估值和二级市场逻辑不同，
    早期项目尤其依赖「讲故事 + 对标」，但底层方法必须扎实。
  how: |
    三种方法，一级市场各有适用场景：
    - **可比公司法**（Comps）：找类似上市公司，算 PS/PE 倍数，套到目标公司。
      早期项目没收入，常用 P/S 或 P/研发投入。
    - **DCF**：预测未来现金流折现。理论完美，但早期项目预测基本靠猜，
      所以一级市场用得少，更多用于成熟期。
    - **风险调整后收益法**：早期投资常用 —— 预估退出时的估值 × 成功概率，
      再按目标 IRR 折现回现在。

    关键理解：**估值是谈判结果，不是计算结果**。
    模型的作用是提供谈判依据，不是给出唯一答案。

    常见坑：把估值当科学，输出精确到小数点的数字。
    实际上早期项目估值区间可能差 3 倍，重要的是说清假设。
  prerequisite: [financial-analysis]
  learn_path:
    - 掌握可比公司法和 DCF 的完整流程
    - 学一级市场专用的「风险调整收益法」
    - 动手：给一家早期机器人公司做一次估值，写清所有假设
    - 理解估值 ≠ 价值：账面估值和真实变现能力是两回事
  jd_phrases: [估值, 估值分析, 财务模型, 投资测算, 估值建模]
  tags: [核心, 必备]

- id: exit
  name: 退出
  zh: 退出方式
  full_name: Exit Strategy
  domain: investment
  level: 进阶
  aliases: [退出, Exit, IPO, 并购退出, 股权转让, 回购, 清算, S基金]
  what: 投资人怎么把钱拿回来 —— IPO、被并购、老股转让、公司回购。
  why: |
    决定回报的最终环节。JD 里写「有完整退出案例」是含金量最高的要求之一，
    因为它证明你不是只会投，而是真的帮 LP 赚到了钱。
  how: |
    四种退出路径，各有优劣：
    - **IPO**：回报最高但周期最长（5-10 年），且受政策和市场窗口影响极大。
      2023 年后 A 股收紧，很多项目转向港股；
    - **并购**：快、确定，但估值通常低于 IPO，且需要找到买家；
    - **老股转让**：在后续轮次中直接卖给新投资人。灵活但受限于流动性；
    - **回购/清算**：兜底手段，通常意味着投资失败。

    当前市场现实：**IPO 通道收窄，S 基金和并购成为主要退出方式**。
    这是 2026 年一级市场的关键词。

    常见坑：投的时候不看退出路径 ——
    「这笔投资将来谁会买」应该在投前就想清楚。
  prerequisite: [fund-lifecycle]
  learn_path:
    - 理解四种退出路径的适用条件和周期
    - 研究 S 基金（二手份额）的交易逻辑
    - 关注 A 股/港股 IPO 政策变化对退出预期的影响
  jd_phrases: [退出, IPO, 并购, 股权转让, 项目退出, 退出管理]
  tags: [核心, 进阶]

- id: cvc
  name: CVC
  zh: 企业风险投资
  full_name: Corporate Venture Capital
  domain: investment
  level: 进阶
  aliases: [CVC, 企业风险投资, Corporate VC, 战投, 战略投资, 产业投资]
  what: 大公司自己的投资部门 —— 用公司的钱投上下游，主要目的不是财务回报而是战略协同。
  why: |
    与财务 VC 是两条不同的职业路径。
    CVC 更看重「能不能帮母公司拿到技术/供应链/客户」，
    对纯财务背景的人相对友好（不需要扛 IRR 压力）。
  how: |
    和 VC 的三个关键区别：
    - **考核标准**：VC 看回报倍数，CVC 看战略价值（技术获取、
      供应链安全、业务协同），财务回报是次要的；
    - **决策流程**：受母公司审批体系约束，往往比 VC 慢；
    - **能给的东西**：除了钱，还有订单、渠道、产线资源 ——
      这是 CVC 抢项目时的独特优势。

    典型 CVC：美团龙珠、小米战投、联想创投、北汽产投、上汽金控。

    常见坑：以为 CVC 就是「甲方爸爸的 VC」。
    实际上 CVC 内部也有很专业的团队，且因为不背回报压力，
    反而能做更长周期的布局。
  prerequisite: [fund-lifecycle]
  learn_path:
    - 理解战投部和财务 VC 的考核差异
    - 研究几家代表性 CVC 的投资逻辑（他们投什么、为什么投）
    - 思考：CVC 的优势在什么阶段最明显
  jd_phrases: [CVC, 战投, 战略投资, 产业投资, 战略协同]
  tags: [路径, 核心]

- id: gov-fund
  name: 国资/引导基金
  zh: 国资与引导基金
  full_name: Government Guidance Fund
  domain: investment
  level: 进阶
  aliases: [引导基金, 国资基金, 政府引导基金, 母基金, FOF, 返投, 国资平台, 产业基金]
  what: 政府出钱设立的基金 —— 主要目的不是赚钱，而是把产业引到本地来。
  why: |
    国内一级市场的半壁江山。2024 年后国资 LP 占比超过 70%，
    不理解引导基金的逻辑，就看不懂当前国内的募资和投资生态。
  how: |
    核心概念是**返投**：政府出 1 亿，要求你在本地投出 1.5-2 亿
    （返投比例通常 1.5–2 倍）。这直接决定基金能投哪些项目 ——
    哪怕外地有好项目，返投压力也会把你拉回本地。

    其他特点：
    - 有明确的方向限制（比如「必须投硬科技」「必须有机器人产业链」）；
    - 决策链条长，有国资合规要求；
    - 但好处是钱稳、期限长、不急着退出。

    国资平台岗位的价值：能接触大量本地产业资源，
    但对纯金融背景的人，上升通道受资源和资历影响较大。

    常见坑：以为国资基金「不专业」。
    头部引导基金（如中关村、亦庄国投）的投资团队专业性很高。
  prerequisite: [fund-lifecycle]
  learn_path:
    - 搞懂返投机制：怎么算、怎么核、对基金策略的影响
    - 了解母基金（FOF）和直投基金的区别
    - 研究北京的几个代表性平台（中关村科学城、亦庄国投、首钢基金）
  jd_phrases: [引导基金, 国资, 母基金, FOF, 返投, 产业基金, 政府基金]
  tags: [路径, 政策]

- id: cap-table
  name: 股权结构
  zh: 股权结构表
  full_name: Cap Table
  domain: investment
  level: 进阶
  aliases: [Cap Table, 股权结构, 股权结构表, 股权稀释, 期权池, ESOP, 持股比例]
  what: 一张表说清谁持有公司多少股份 —— 包括创始人、投资人、员工期权池。
  why: |
    投资交易的基础工具。算不清股权结构，
    就不知道「投进去能拿多少、后续会被稀释成多少」。
  how: |
    关键理解：**每一轮融资都会稀释所有人**（除非有反稀释条款）。

    计算逻辑：
    - 新投资人占股 = 本轮投资额 / 投后估值
    - 投后估值 = 投前估值 + 本轮投资额
    - 老股东占比 × （投前估值 / 投后估值）= 稀释后的占比

    期权池（ESOP）要特别注意：
    通常要求**投前**设立（这样稀释的是创始人），
    而不是投后设立（那样投资人也被稀释）。
    这是谈判中的常见博弈点。

    常见坑：用「投前估值」算占股比 ——
    正确算法是除以「投后估值」。这是新人最常犯的错误。
  prerequisite: [valuation, term-sheet]
  learn_path:
    - 动手搭一个多轮融资的股权稀释模型（Excel 就够）
    - 搞清期权池在投前/投后设立的区别
    - 练习：算清 A 轮投资人到 C 轮还剩多少股份
  jd_phrases: [股权结构, Cap Table, 股权稀释, 期权池, 持股比例]
  tags: [工具, 必备]
