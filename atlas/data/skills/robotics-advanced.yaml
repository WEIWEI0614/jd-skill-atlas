# ============================================================================
#  技能词典 · 机器人进阶（JD 不显眼，但是真门槛）
#  ---------------------------------------------------------------------------
#  这一批词的共同特点：
#    · 几乎不会出现在 JD 的「任职要求」标题行里，只会零散藏在职责描述中；
#    · 但**面试一定会问**，而且一问就能分出「看过论文」和「真的做过」；
#    · 它们是机器人和 AI 之间真正的分水岭 —— 算法岗转机器人最难的就是这层。
#
#  收录来源：2026 WRC/WAIC 产业共识 + 真实 JD 缺口扫描 + 面试常见考点。
# ============================================================================

label: 机器人进阶 · 控制与工程深水区

skills:

- id: zmp
  name: ZMP
  zh: 零力矩点
  full_name: Zero Moment Point
  domain: robotics
  level: 高级
  aliases: [ZMP, 零力矩点, 支撑多边形, 稳定判据, 质心投影]
  what: 地面上「水平合力矩为零」的那个点 —— 只要它落在双脚构成的支撑多边形内，机器人就不会翻倒。
  why: |
    这是双足机器人**最经典的平衡判据**，1968 年由 Vukobratovic 提出，
    直到今天仍是大多数商用服务型人形机器人平地行走的基础。
    面试问它，考的其实是「你懂不懂机器人为什么会倒」。
  how: |
    - **直觉**：人走路时靠本能判断重心有没有压出脚底范围；
      机器人没有本能，所以必须把这个边界**显式算出来**。
    - **怎么用**：规划层先生成期望的 ZMP 轨迹（通常由 LIPM 给出），
      执行层调整关节姿态，让实际 ZMP 始终落在支撑多边形内。
    - **它的边界在哪（关键考点）**：ZMP 是**准静态**判据，
      适合平地、低速、接触明确的任务。遇到快速转身、跑跳、
      非共面接触（上下台阶、脚踩不同高度）、或者滑动摩擦，
      ZMP 就会失效 —— 这时必须转向 WBC 或强化学习策略。
    - **配套概念**：预览控制（preview control）—— 用未来一段的 ZMP 参考序列
      提前调整质心，而不是等误差出现再纠正。

    常见坑：把 ZMP 当成「万能稳定判据」。面试里说「我们的机器人用 ZMP 保证稳定」，
    如果做的是跑跳或复杂地形，会被追问到答不上来。
  prerequisite: [dynamics, algorithms-mechanics]
  learn_path:
    - 先理解质心、支撑多边形、翻倒边这三个几何概念
    - 用 Python 画一个倒立摆，手工构造它在支撑多边形内的轨迹
    - 读 Vukobratovic 的原始定义，弄清「水平合力矩为零」到底指什么
    - 找一个 ZMP 失效的场景（快速迈步），观察它为什么会给出错误判断
  jd_phrases: [ZMP, 零力矩点, 平衡控制, 稳定判据, 支撑多边形]
  tags: [双足, 经典]

- id: lipm
  name: LIPM / 捕获点
  zh: 线性倒立摆与捕获点
  full_name: Linear Inverted Pendulum Model & Capture Point
  domain: robotics
  level: 高级
  aliases: [LIPM, 倒立摆模型, 捕获点, Capture Point, 质心轨迹规划, 迈步策略, DCM]
  what: 把人形机器人简化为「一个质心 + 无质量弹簧腿」，从而把高阶非线性动力学降成线性方程 —— 这是能实时算出步态的关键简化。
  why: |
    没有这个简化，人形机器人的动力学方程复杂到无法在线求解。
    LIPM 让「先规划质心轨迹、再让关节去跟」成为可能，
    是几乎所有人形机器人步态生成器的底子。
    **捕获点（Capture Point）**是它的衍生概念：算出「被推之后踩哪里才能停下来」，
    这是抗扰恢复的基础。
  how: |
    - **LIPM 的核心假设**：质心高度恒定、只做水平运动、腿无质量。
      这三条让方程变成线性的二阶系统，可以直接解析求解。
    - **为什么敢这么简化**：走路时质心高度变化确实不大（几厘米量级），
      误差可以在执行层由 WBC 补掉。
    - **捕获点怎么用**：机器人被侧向推一下，质心速度突然变了。
      捕获点告诉你「按当前速度，脚必须落在哪里才能刹住」。
      如果捕获点已经跑出当前支撑脚，就必须**迈步**（stepping）而不是只靠踝关节。
    - **升级版**：3D-LIPM（加侧向）、弹簧负载倒立摆 SLIP（弹性腿，用于跑跳）。

    常见坑：简化模型的误差不补 → 仿真里走得好，真机上一碰就晃。
    LIPM 给的是**参考轨迹**，不是最终控制量。
  prerequisite: [zmp, dynamics]
  learn_path:
    - 推导一遍 LIPM 的线性化方程（这一步做完就懂了）
    - 用 Python 仿真一个双足模型，让它在 LIPM 轨迹上走起来
    - 加入水平扰动，实现捕获点计算 + 主动迈步恢复
    - 扩展到 3D-LIPM，观察侧向稳定性怎么变
  jd_phrases: [LIPM, 倒立摆, 捕获点, 质心轨迹, 步态规划]
  tags: [双足, 经典]

- id: wbc
  name: WBC
  zh: 全身控制
  full_name: Whole-Body Control
  domain: robotics
  level: 专家
  aliases: [WBC, 全身控制, 全身动力学控制, 任务优先级, 零空间, 分层优化, QP控制, HQP]
  what: 把机器人当成**一个完整的身体**而不是一堆分开的关节 —— 每个控制周期解一个二次规划(QP)，同时满足平衡、力矩上限、避碰、摩擦约束等多个目标。
  why: |
    这是**现代全尺寸人形机器人的核心算法**，也是「动作从僵硬到丝滑」的技术分水岭。
    特斯拉 Optimus、宇树 H1、Figure 这些都靠它。
    面试里如果问「28 个关节怎么协调」，答不出 WBC 基本就到这了。
  how: |
    - **为什么必须有优先级**：任务之间会冲突。比如「手要到位」和
      「关节力矩不能超上限」同时成立时，后者永远优先（硬件会烧）。
      所以用**任务层级（hierarchy）**：硬约束最高，安全其次，任务精度再次，
      姿态美观最低。
    - **两种实现**：加权 QP（把冲突项加权求和，软优先级）和
      HQP 分层 QP（严格按优先级逐层求解，后一层只能在前一层的零空间里动）。
    - **典型任务栈**（从高到低）：
      关节限位与力矩上限 → 接触点不滑动 → 质心/动量控制 → 手部/足部位姿跟踪 → 姿态正则化
    - **和 MPC 的关系**：MPC 管 0.5-2 秒的中长期规划（脚步序列、质心轨迹），
      WBC 管 1kHz 级别的瞬时力矩分配。**"MPC + WBC" 是当前基于模型方案的标准搭配**。
    - **和 RL 的关系**：强化学习策略正在低层运动控制上替代经典控制器
      （宇树 H1、电动 Atlas 都已用 RL 策略做底层），
      但 WBC 仍是理解这个问题的**概念框架**，面试绕不开。

    常见坑：以为控制频率越高越好 —— 波士顿动力的控制周期只有 1kHz，
    比某些实验室的 5kHz 还低。**真正决定效果的是状态估计的准确性和约束建模的正确性。**
  prerequisite: [motion-control, optimization, contact-dynamics]
  learn_path:
    - 先读懂「任务空间 + 零空间」的概念（可以类比冗余机械臂）
    - 用 Python + OSQP/qpOOS 手解一个简化的 WBC（3 个任务、2 个约束）
    - 在 MuJoCo / Isaac Sim 里跑一个开源 WBC 控制器，观察优先级切换
    - 读一篇 HQP 的经典论文，理解「严格优先级」和「加权」的差别
  jd_phrases: [WBC, 全身控制, 任务优先级, 全身动力学, QP求解]
  tags: [双足, 核心, 面试高频]

- id: contact-dynamics
  name: 接触动力学
  zh: 接触动力学与摩擦锥
  full_name: Contact Dynamics & Friction Cone
  domain: robotics
  level: 专家
  aliases: [接触动力学, 摩擦锥, 接触模型, 互补约束, 库仑摩擦, 接触力, 柔性接触, 碰撞检测]
  what: 研究「两个物体碰上之后力怎么传」的力学 —— 机器人所有「操作」的本质都是接触。
  why: |
    这是**仿真和真机差距最大的地方**，也是具身智能产业公认的第一瓶颈。
    产业共识原话：「不少模型在语言、图像任务表现优异，
    但面对真实世界的**接触、滑移、形变**等物理现象，处理能力不足」。
    面试问接触，考的是你有没有真机经验。
  how: |
    - **为什么难**：接触是**不连续**的 —— 没碰上力为零，碰上瞬间力突变。
      传统动力学假设连续，遇到接触就不成立，需要引入互补条件
      （要么分离且力为零，要么接触且力为正，不能既分离又有力）。
    - **库仑摩擦锥**：接触点能传递的切向力有上限 μN（摩擦系数 × 法向力）。
      规划器如果不把这个约束写进去，算出来的动作在真机上会打滑。
    - **四种主流接触模型**：刚体+互补（精确但求解慢）、
      罚函数（把接触当弹簧，快但不准）、
      **柔顺接触 / 软体接触**（当前研究热点，能处理形变）、
      可微分接触（能端到端训梯度）。
    - **工程上的表现**：插孔（peg-in-hole）、拧螺丝、擦桌子、
      折叠柔性衣物 —— 这些任务的难点全在接触建模。

    常见坑：在仿真里用理想刚体接触调好的策略，上真机就废 ——
    因为真机有柔性、有间隙、有摩擦不确定性。**域随机化必须覆盖接触参数**。
  prerequisite: [dynamics, algorithms-mechanics]
  learn_path:
    - 理解为什么接触是「不连续」的，以及互补条件怎么表达
    - 学摩擦锥，能做简单的受力分析（物体在斜面上会不会滑）
    - 在 MuJoCo 里改接触参数（摩擦、刚度、阻尼），观察行为变化
    - 做一次 peg-in-hole 实验，记录失败案例并归类原因
  jd_phrases: [接触, 摩擦, 形变, 滑移, 力控, 精密装配]
  tags: [物理, 瓶颈, 面试高频]

- id: actuator-control
  name: 电机三环控制
  zh: 电机控制与 FOC
  full_name: Motor Control (FOC / Current-Speed-Position Loops)
  domain: robotics
  level: 高级
  aliases: [FOC, 矢量控制, 电流环, 速度环, 位置环, 三环控制, 力矩控制, 编码器反馈, 伺服驱动]
  what: 从「我想要 10 N·m 力矩」到「电机真的输出 10 N·m」之间的那套控制回路 —— 通常由电流环、速度环、位置环三层嵌套构成。
  why: |
    这是**算法和真实硬件之间的最后一公里**。
    人形机器人关节数量已提升到 20 轴以上，每个关节一套三环控制，
    整机系统复杂度大幅上升。
    面试问这个，是判断你有没有拆过机器、调过电机。
  how: |
    - **三环的嵌套关系（内到外）**：
      - 电流环（最快，通常 10-20kHz）：用 FOC 把三相电流解耦成
        「产生力矩的分量」和「产生磁场的分量」，直接控制力矩；
      - 速度环（1kHz 级）：输入目标速度，输出目标电流；
      - 位置环（100Hz-1kHz）：输入目标位置，输出目标速度。
      每层的带宽必须低于内层，否则会振荡。
    - **为什么需要 FOC**：无刷电机的力矩与「正交电流」成正比，
      不做坐标变换就没法直接控制力矩 —— 这就是 FOC 存在的意义。
    - **工程要素**：编码器分辨率与标定、电流采样与噪声、
      死区补偿、温度对电阻的影响、力矩常数标定。

    常见坑：仿真里用「理想力矩源」，忽略电机**力矩上限和带宽** ——
    真机上「算法要求 200 N·m 但电机只有 40 N·m」，动作直接做不出来。
    这是 Sim2Real 差距里最常被低估的一条。
  prerequisite: [electronics, control-theory, embedded]
  learn_path:
    - 搞懂无刷电机为什么需要 FOC（三相 → dq 坐标变换）
    - 拿一套现成的驱动器 + 电机，跑通力矩模式并实测力矩线性度
    - 手工调一次三环 PID，记录每层带宽不够时会出现什么现象
    - 把力矩上限写进你的控制算法，看性能损失多少
  jd_phrases: [电机控制, FOC, 伺服, 电流环, 力矩控制, 关节模组]
  tags: [硬件, 执行器]

- id: calibration
  name: 标定
  zh: 标定（手眼 / 多传感器）
  full_name: Calibration (Hand-Eye / Multi-Sensor Spatiotemporal)
  domain: robotics
  level: 高级
  aliases: [标定, 手眼标定, 内参, 外参, 时延标定, 时间同步, 相机标定, 联合标定, 传感器对齐]
  what: 求解「传感器之间、传感器与机器人之间」的几何与时间关系 —— 所有多传感器融合的前置条件。
  why: |
    机器人领域有一条铁律：**垃圾进，垃圾出**。
    算法再强也救不了标定不准的传感器数据。
    产业界的真实痛点：**触觉手套数据与视觉数据差 15 毫秒就无法复用** ——
    这说明标定不只是空间问题，时间同步同样致命。
  how: |
    - **空间标定分四层**：
      1. 相机内参（焦距、畸变）—— 棋盘格法，最基础；
      2. 相机外参（相机在机器人上的位置姿态）；
      3. **手眼标定**（相机与末端的相对关系，eye-in-hand / eye-to-hand 两套解法）；
      4. **多传感器联合标定**（相机-激光雷达-IMU 的统一坐标系）。
    - **时间标定（最容易被忽略）**：
      感知 30Hz、IMU 500Hz、力传感器 1kHz、编码器 1kHz ——
      不时间对齐，融合结果比单传感器还差。
      需要硬件触发同步 + 软件时间戳插值。
    - **验证方法**：标定完必须量化误差。闭环验证（移动末端回到同一位置）比看残差更可靠。

    常见坑：只标一次就不动了。机器人搬动、碰撞、温漂都会让外参失效。
    工程上要有「标定是否漂了」的在线检测。
  prerequisite: [sensor-principles, linear-algebra]
  learn_path:
    - 用棋盘格做一次相机内参标定，理解畸变系数
    - 实现 eye-in-hand 手眼标定（AX=XB 问题）
    - 做一次多传感器时间对齐，观察未对齐时的融合劣化
    - 设计一个标定漂移的在线检测方法
  jd_phrases: [标定, 手眼标定, 内外参, 时间同步, 多传感器融合]
  tags: [工程, 必备]

- id: state-estimation
  name: 状态估计
  zh: 状态估计与多传感器融合
  full_name: State Estimation & Sensor Fusion
  domain: robotics
  level: 高级
  aliases: [状态估计, 多传感器融合, 扩展卡尔曼, EKF, ESKF, 无迹卡尔曼, UKF, 因子图, 优化估计, 里程计]
  what: 从一堆各有噪声、各有延迟、各有失效模式的传感器里，估计出「机器人现在到底在哪、什么姿态、多快」。
  why: |
    有一条产业共识值得记住：**「许多人认为提高控制频率就能改善性能，
    实际上真正关键的是状态估计的准确性和控制算法的鲁棒性。」**
    换句话说，控制不好先别怪控制器，先看状态估计。
  how: |
    - **方法谱系**：
      - 互补滤波 —— 最轻，适合姿态估计（IMU + 磁力计）；
      - **EKF / ESKF** —— 工程主流，误差状态卡尔曼滤波数值更稳；
      - **UKF** —— 强非线性场景；
      - **因子图优化** —— 离线或低频场景精度最高（VIO、SLAM 后端）。
    - **传感器各有脾气**：
      - IMU：高频但漂移，积分几步就飞；
      - 编码器/轮式里程计：低频累积误差、会打滑；
      - 视觉：绝对但怕遮挡、怕光照、慢；
      - 激光：精确但贵、稀疏。
      融合的价值就在于**用各自的强项补对方的弱项**。
    - **VIO（视觉惯性里程计）** 是其中最典型的组合：相机 + IMU，
      尺度可观测、抗快速运动。

    常见坑：把传感器数据直接喂给融合而不做**时延补偿** ——
    相机 30Hz 意味着数据可能已经晚了 33ms，高速运动下这个延迟就是灾难。
  prerequisite: [signal-processing, probability, kinematics]
  learn_path:
    - 从 1D 卡尔曼滤波推起，理解「预测 + 更新」两步
    - 做一次 IMU + 轮速计的 ESKF 融合定位
    - 亲手实现一次时延补偿，量化它对精度的影响
    - 跑一个开源 VIO（如 VINS-Mono），读它的因子图结构
  jd_phrases: [状态估计, 传感器融合, 卡尔曼滤波, EKF, VIO, 位姿估计]
  tags: [感知, 核心]

- id: retargeting
  name: 动作重定向
  zh: 动作重定向
  full_name: Motion Retargeting
  domain: robotics
  level: 高级
  aliases: [重定向, Retargeting, GMR, 人体动作映射, 动作迁移, 主从映射, 人体姿态到机器人]
  what: 把「人的动作」翻译成「机器人关节能执行的动作」—— 因为人机之间自由度数量、肢体比例、关节限位全都不一样。
  why: |
    这是**具身数据采集链条上最关键的转换环节**。
    当前主流采集方式（VR 遥操作、动捕、UMI 穿戴）采到的都是**人体动作**，
    必须经过重定向才能变成训练数据。
    产业上已有成熟工具（如 General Motion Retargeting），但调参仍然很吃经验。
  how: |
    - **核心矛盾**：人有 200+ 自由度，七自由度人形机器人只有 20-40 个。
      直接映射会产生「人手够得到、机器人够不到」的问题。
    - **常见做法**：
      1. 提取人体关键点（动捕 / VR 追踪 / 视觉姿态估计）；
      2. 解一个优化问题：让机器人末端尽量贴合人体末端，
         同时满足关节限位、不自碰撞、质心在支撑区内；
      3. 保证时序连续性（动作不能抖）。
    - **两条路线**：几何重定向（基于 IK，稳定但生硬）
      vs 学习方法（用神经网络学映射，自然但泛化性存疑）。
    - **配套的还有「重放（replay）」**：重定向后的动作需要
      在仿真里回放检查是否超出工作空间、双臂是否碰撞、
      夹爪状态是否合理 —— 实测通过率约 98%。
    - **数据分层采集体系（产业共识）**：
      底层互联网视频 → 中层第一视角操作 → **第三层 UMI 穿戴采集** →
      顶层真机遥操作。四层互补，**数据质量永远优于数据体量**。

    常见坑：只关注末端位置对齐，忽略**动力学可行性** ——
    重定向出来的动作看起来对，但机器人执行时力矩超限。
  prerequisite: [kinematics, optimization]
  learn_path:
    - 理解人机自由度数量差异为什么是根本矛盾
    - 用 IK 手工实现一个简化的重定向（只对末端位置）
    - 加上关节限位和质心约束，看动作怎么被「挤」变形
    - 了解 UMI / 动捕 / VR 三种采集方式各自的信号特点
  jd_phrases: [重定向, Retargeting, 动作映射, 遥操作, 数据采集]
  tags: [数据, 前沿]

- id: data-flywheel
  name: 数据飞轮
  zh: 数据飞轮与数据治理
  full_name: Data Flywheel & Data Governance
  domain: robotics
  level: 专家
  aliases: [数据飞轮, 数据闭环, 数据治理, 数据金字塔, 数据标注, 失败检测, 影子模式, 主动学习, 数据标准]
  what: 让机器人「自己干活 → 自己判断好坏 → 自己更新策略」的闭环，目标是**不再需要人介入**。
  why: |
    产业共识很直白：**具身智能的竞争，很大程度上是「数据效率」的竞争**。
    更狠的一句话：「**如果靠大量采数据才能让机器人工作，那一定是亏钱的**——
    第一性原理决定了我们必须追求最高效的数据方式。」
    人才极度稀缺，因为这条链同时需要数据工程 + 模型训练 + 现场部署三种能力。
  how: |
    - **一个完整闭环的五个环节**（每环都有坑）：
      1. **数据同步**：多传感器时间戳对齐（硬件触发 + 软件插值）；
      2. **失败检测**：怎么自动判断这次任务成功了？多模态融合
         （视觉 + 力觉 + 音频）比单模态可靠；
      3. **数据筛选**：海量数据里挑出「有效样本」——
         用不确定性估计 + 主动学习，而不是全靠人工；
      4. **安全回退**：新策略可能失控 —— 用**影子模式**
         （新策略与老策略并行跑，只记录不执行）先观察；
      5. **版本与标准**：数据格式、坐标系、动作空间、任务定义要统一，
         否则数据跨本体不可复用一个字都用不上。
    - **数据分层（金字塔）**：互联网视频（量大质差）→
      第一视角操作 → UMI 穿戴采集 → 真机遥操作（量小质高）。
    - **关键转折点判断**：有观点认为，随着真实数据增长，
      **Scaling Law 正在显现** —— 基模型越强，对真机数据的依赖反而越小。

    常见坑：只堆数据量不做治理。**数据标准比数据量重要** ——
    差 15ms 时间戳就对不上的数据，多采集一万条也没用。
  prerequisite: [retargeting, teleoperation, benchmark]
  learn_path:
    - 搞清楚「数据金字塔」四层各自适合什么任务
    - 实现一次多传感器时间对齐（这是最基本也最容易做错的一步）
    - 设计一个失败检测方案（先规则，再尝试多模态）
    - 了解影子模式的工程实现（副本流量、灰度、回滚）
  jd_phrases: [数据飞轮, 数据闭环, 数据治理, 数据标注, 主动学习]
  tags: [数据, 前沿, 稀缺]

- id: loco-manipulation
  name: 移动操作
  zh: 移动操作 / 全身协调
  full_name: Loco-Manipulation
  domain: robotics
  level: 专家
  aliases: [移动操作, 全身协调, 操作与行走, 动捕协同, 手眼足协调, 长程任务, 技能组合]
  what: 边走动边操作 —— 因为搬东西会改变质心、推门会产生反作用力，所以腿和手**不能分开规划**。
  why: |
    这是**人形机器人从「会跳舞」到「能干活」的门槛**。
    最形象的判断来自一位产业专家：
    「五年后我们和人形机器人去超市，让它推购物车、取十公斤大米、在牛奶区碰面。
    我们不能假设它之前来过这个超市，也不能假设它专门训练过推车。」
    **难点不在各单项技能，而在各项技能的自主组合。**
  how: |
    - **为什么必须联合规划**：抱一个 10kg 的箱子，整机质心前移 ——
      如果腿的控制还按「空手走路」来，直接就前倾了。
      推门时门把手传递到全身的反作用力同理。
    - **技术形态**：把操作任务和行走任务统一写进一个 WBC 层级里，
      或者用端到端策略直接学习「状态 → 全身关节目标」的映射。
    - **视觉语言导航（VLN）**：听懂「去厨房拿个杯子」，
      需要语言理解 + 地图构建 + 导航 + 操作四层串联。
    - **长期任务规划**：把「整理房间」分解成子任务、判断每步是否完成、
      处理失败重试 —— 这一层目前仍主要靠上层大模型。

    常见坑：把「走」和「抓」当成两个独立模块开发，
    到集成时才发现耦合方式不对，只能重构。
  prerequisite: [wbc, motion-planning, embodied-ai]
  learn_path:
    - 先单独跑通「走」和「抓」，再设计它们的接口
    - 分析一个真实任务（比如搬箱子），列出所有耦合项
    - 在仿真里做一次「边移动边抓取」的联合实验
    - 读一篇 VLN 的论文，理解导航与操作的衔接点
  jd_phrases: [移动操作, 全身协调, 操作, 导航, 长程任务]
  tags: [具身, 前沿]

- id: realtime-scheduling
  name: 实时性
  zh: 实时性与时序分析
  full_name: Real-Time Systems & Timing Analysis
  domain: robotics
  level: 高级
  aliases: [实时性, 实时系统, 硬实时, 时序分析, 抖动, 确定性, 实时内核, PREEMPT_RT, 时间预算]
  what: 保证控制回路「**每次都在截止时间前完成**」—— 注意不是「快」，而是「**确定性**」。
  why: |
    「实时」这个词最常被误解。一个平均 0.1ms 但偶尔卡 10ms 的控制回路，
    比一个稳定 1ms 的更危险 —— 后者可预测，前者会在某一刻把机器人送进地面。
    机器人岗位问这个，是在确认你有没有**真机部署**经验。
  how: |
    - **硬实时 vs 软实时**：错过截止时间会导致灾难的（电机控制）是硬实时；
      偶尔超时只影响体验的（日志上报）是软实时。两者设计完全不同。
    - **实时性的敌人**（按危害排序）：
      1. **内存分配** —— malloc 可能触发 GC 或页交换，耗时不可预测；
      2. **页面错误与缺页** —— 首次访问某块内存会触发磁盘 IO；
      3. **非确定性调度** —— 普通 Linux 的 CFS 调度器不保证优先级；
      4. **缓存未命中** —— 数据布局差会让耗时有 10 倍波动。
    - **工程手段**：
      实时内核（PREEMPT_RT）或 RTOS、预分配内存、
      锁无关数据结构、把控制回路和数据记录**分到不同线程/核心**。
    - **实测方法**：用示波器量真实控制周期，看**抖动分布**而不是平均值。

    常见坑：在实时任务里 `printf` 或写日志 ——
    串口输出和文件 IO 都可能阻塞几十毫秒，直接把控制周期拖崩。
  prerequisite: [embedded, linux, control-theory]
  learn_path:
    - 搞清「快」和「确定」的区别，能举例说明
    - 在一个控制回路上实测周期抖动分布（不只是平均值）
    - 制造一次抖动：在回路里加 malloc / printf，观察现象
    - 用预分配 + 双缓冲把抖动压下去
  jd_phrases: [实时性, 实时控制, 抖动, 确定性, 实时系统]
  tags: [工程, 必备]

- id: onboard-compute
  name: 端侧算力
  zh: 端侧算力约束
  full_name: On-Device Compute Constraints
  domain: robotics
  level: 高级
  aliases: [端侧算力, 端侧推理, 边缘计算, 功耗约束, TensorRT, ONNX, 模型压缩, 推理延迟, 算力平台, Jetson]
  what: 在机器人体内那块几十瓦的板子上，把大模型跑起来 —— 同时满足**延迟、精度、功耗**三个互相拉扯的目标。
  why: |
    这是具身智能产业公认的**工程落地瓶颈**：
    「复杂大模型推理开销大，机器人本体算力有限，
    如何平衡模型能力、推理延迟、功耗，是工程落地的现实难题。」
    注意这里有个很清醒的判断：**VLA 模型大部分在 70 亿参数规模上下**，
    跟云端千亿模型完全不是一个量级 —— 端侧限制是根本原因。
  how: |
    - **三角权衡**：想要更强能力 → 更大模型 → 更高延迟和功耗 → 机器人反应变慢。
      真实系统必须在某个点上截断。
    - **感知频率差异（设计的分层依据）**：
      触觉反馈 1ms、视觉最快 15ms、VLA 决策百毫秒级。
      **所以安全相关的反应必须下沉到 1ms 层，不能指望大模型**。
    - **优化手段**：量化（INT8/FP8）、算子融合、图优化、
      用 TensorRT / ONNX Runtime 做部署、
      把大模型放在低频回路、小模型放高频回路。
    - **算力平台选型**：Jetson Orin 系列、地平线征程、
      国产 SoC —— 各自生态和工具链差异很大。

    常见坑：把云端调好的模型直接搬到端侧，没有针对硬件做算子优化，
    结果延迟是预期的 5 倍。**"能跑"和"能实时跑"是两件事**。
  prerequisite: [inference-optimization, embedded, control-theory]
  learn_path:
    - 算清你目标平台的算力预算（TOPS、内存带宽、功耗）
    - 把一个模型量化到 INT8，测精度损失与速度收益
    - 用 TensorRT 或 ONNX 做一次图优化，对比延迟
    - 设计一个分层推理架构（高频小模型 + 低频大模型）
  jd_phrases: [端侧推理, 边缘计算, 推理延迟, 算力约束, 部署]
  tags: [工程, 瓶颈]

- id: force-tactile-fusion
  name: 力触觉融合
  zh: 力触觉感知与多频率融合
  full_name: Force & Tactile Sensing Fusion
  domain: robotics
  level: 专家
  aliases: [触觉, 触觉传感, 力触觉, 滑觉, 接触力分布, 六维力, 多频率融合, 触觉反馈, 电子皮肤]
  what: 用触觉和力觉补齐视觉给不了的信息 —— 是否真的抓住了、有没有在打滑、接触力多大、物体多软。
  why: |
    产业共识把它列为**人机交互的核心瓶颈**：
    「人与机器人物理接触场景对感知响应速度要求极高，
    核心瓶颈集中在力触觉感知融合。搀扶、陪护等场景容错空间极低，
    机器人力度失控极易造成人体损伤。」
    触觉反馈 1ms、视觉最快 15ms —— **多频率感知信息融合仍是行业长期课题**。
  how: |
    - **触觉能给什么视觉给不了的**（这是面试常问的）：
      1. **滑移检测** —— 物体开始滑的那一刻，视觉看不出来，触觉能；
      2. **接触力分布** —— 抓得稳不稳、有没有偏载；
      3. **抓取是否真的闭合** —— 视觉看到"手在了"，但可能什么都没抓到；
      4. **材质与形变** —— 软硬、粗糙度。
    - **器件谱系**：六维力/力矩传感器（关节端，测总力）
      → 指端触觉阵列（测分布）→ 电子皮肤（大面积覆盖）。
    - **融合的难点在于频率对不上**：触觉 1kHz、视觉 30Hz，
      直接融合会有一方被拖慢。
      实践做法是**保持各自的回路**：触觉闭一个 1ms 的反射环，
      视觉走 30ms 的语义环，高层再统一。
    - **安全冗余**：有专家明确强调，
      **「仅靠大模型而没有额外的安全冗余机制，远远不够」**。

    常见坑：把触觉当成「更精确的力传感器」用，
    忽略它的真正价值是**高频的接触事件检测**。
  prerequisite: [tactile-sensing, sensor-principles, signal-processing]
  learn_path:
    - 列出五个「视觉做不到但触觉能做」的场景（面试能直接答）
    - 拿一个力/触觉传感器采数据，观察滑移发生时的信号特征
    - 设计一个双回路架构（高频反射 + 低频语义）
    - 做一次抓取实验，记录多少失败是「视觉以为成功」造成的
  jd_phrases: [触觉, 力触觉, 滑觉, 接触力, 六维力, 感知融合]
  tags: [感知, 安全, 前沿]

- id: dual-system-arch
  name: 分层架构
  zh: 分层架构（大脑 / 小脑）
  full_name: Hierarchical Dual-System Architecture
  domain: robotics
  level: 专家
  aliases: [分层架构, 大脑小脑, 快慢系统, System1System2, 双系统, 高层规划, 底层反射, 分层控制, 混合架构]
  what: 上层用大模型做「理解与推演」，下层用轻量控制器做「实时反射」—— 因为一个模型不可能同时做到「聪明」和「快」。
  why: |
    这是**目前产业界最主流的架构共识**，多位专家的判断高度一致：
    分层架构**贴合人脑运行逻辑，会长期沿用**，
    各层级内部的算法和模型会持续迭代，但分层这件事本身不会变。
    面试问「你怎么设计机器人系统架构」，这就是标准答案的骨架。
  how: |
    - **为什么必须分层（一句话说清）**：
      VLA 模型百毫秒级决策速度，**无法满足应急需求** ——
      绊一下、碰一下，需要底层肢体瞬时反应。
      所以「聪明」和「快」必须在不同层实现。
    - **典型三层**：
      1. **认知层（低频，几百 ms 级）**：语言理解、任务分解、
         长程规划 —— 用 VLM/LLM 或 VLA；
      2. **技能层（中频，10-100ms）**：动作生成、
         轨迹规划、抓取策略；
      3. **反射层（高频，1-10ms）**：平衡、力控、碰撞避免、急停 ——
         硬实时，绝不能依赖大模型。
    - **层间通道很关键**：有做法是专门做「打通大小脑信息交互通道」的
      中间模型，同步融合语言与视觉信息拆解子任务。
    - **VLA 与世界模型的关系**：两者将**长期协同存在** ——
      VLA 对确定性高的任务学得快，世界模型擅长推演预测；
      随着数据量提升，路线会逐步收敛。

    常见坑：把安全逻辑放在大模型层。
    「大模型判断要不要急停」是不可接受的架构 —— 它慢且不确定。
  prerequisite: [vla, wbc, realtime-scheduling]
  learn_path:
    - 画出你理想机器人的三层架构，标注每层的频率和职责
    - 找出哪一层是硬实时、哪一层可以"慢而聪明"
    - 设计层间接口（输入输出、频率、失败回退）
    - 分析一个真实事故场景，看分层能不能拦住它
  jd_phrases: [分层架构, 大脑小脑, 快慢系统, 系统架构, 高低频]
  tags: [架构, 共识, 面试高频]

- id: robot-lifecycle
  name: 整机可靠性
  zh: 整机可靠性与寿命
  full_name: Robot Reliability & Lifecycle Engineering
  domain: robotics
  level: 高级
  aliases: [可靠性, 寿命测试, MTBF, 耐久, 老化测试, 故障率, 冗余设计, 长期运行, 工业标准]
  what: 让机器人能连续跑几万小时不坏 —— 而不是在展台上表演十分钟。
  why: |
    这是产业公认的**第二大瓶颈**：
    「模型之外，硬件工程是产业第二大瓶颈，零部件可靠性、
    长期寿命难以满足工业标准。」
    并且有一个很扎心的对比：**工业领域通用设备寿命标准为 5 万至 10 万小时**，
    现有机械臂可达到十万小时耐久，但**人形整机能否稳定运行五万小时仍有待验证**。
    还有一个更直接的数据：**绝大多数零部件未通过汽车行业 IATF 16949 可靠性标准**。
  how: |
    - **为什么人形整机比机械臂难**：关节数量从 6 个涨到 20+，
      可靠性是**串联系统** —— 每个关节都可靠 99.9%，
      20 个关节串起来只剩 98%（0.999^20 ≈ 0.98）。
      这是数学上的必然，不是工艺问题。
    - **该掌握的方法**：
      1. **寿命测试**：加速寿命试验（提高负载/频率/温度），
         用加速因子外推真实寿命；
      2. **失效模式分析**（FMEA）—— 找出哪些零件先坏；
      3. **冗余设计**：关键传感器双路、电池热插拔、故障降级运行；
      4. **维护性设计**：易损件能不能快速更换（现场可维护性）。
    - **面向标准做事**：汽车行业的 IATF 16949、ISO 9001、
      以及针对具体场景的安全标准 —— 客户审核问的就是这些。

    常见坑：只看平均无故障时间（MTBF），不看**故障分布的形状** ——
    早期失效（浴盆曲线左端）才是量产爬坡期最致命的。
  prerequisite: [fmea, quality-system, mech-design]
  learn_path:
    - 理解「串联系统可靠性」的数学，算一次 20 个关节的整机可靠性
