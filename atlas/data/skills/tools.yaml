#  技能词典 · 工具与工程环境
#  ---------------------------------------------------------------------------
#  这些不是「概念」而是「工具」，但它们同样高频出现在 JD 里，
#  而且很多转行的人不清楚每个工具的定位和该学到什么程度。
#  格式说明见 robotics.yaml 顶部。
