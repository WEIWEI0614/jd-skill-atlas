# ============================================================================
#  技能词典 · 基础理论（地基）
#  ---------------------------------------------------------------------------
#  为什么单独一个文件？
#
#  在这个词典里，很多应用型技能的前置依赖指向「线性代数」「动力学」
#  「深度学习」这类**地基知识**，但它们此前没有被定义成技能条目 ——
#  等于说：系统知道"上层的楼"需要这些地基，却从没告诉你要打地基。
#
#  这一批词条补的就是这个洞。它们的共同特点是：
#    · 不写在 JD 的显眼位置，但**面试一定会考**；
#    · 不像工具那样能"一周速成"，需要持续投入；
#    · 然而一旦缺失，上层工具学得再多也走不远。
#
#  别名写法注意：像「算法」这种到处出现的词**绝不能当别名**
#  （会命中几乎所有 JD）。只放有区分度的说法。
# ============================================================================

label: 基础理论 · 地基

skills:

- id: linear-algebra
  name: 线性代数
  zh: 线性代数
  full_name: Linear Algebra
  domain: foundations
  level: 入门
  aliases: [线性代数, 矩阵运算, 向量空间, 特征值, 奇异值分解, SVD, PCA]
  what: 研究向量、矩阵与线性变换的数学 —— 是"数据长什么样"的语言。
  why: |
    它是深度学习、机器人、图形学的共同地基。
    **一句话判断它重不重要**：任何涉及"高维数据"的岗位，面试都会问。
    - 深度学习里的张量运算、注意力机制，本质是矩阵乘法；
    - 机器人里的坐标变换、姿态表示，本质是旋转矩阵；
    - 数据分析里的降维（PCA/SVD），本质是特征值分解。

    它不会直接写在 JD 上，但**它决定你能不能看懂上层公式**。
  how: |
    需要掌握到什么程度：
    - **必会**：矩阵乘法、转置、逆、行列式；特征值与特征向量的几何意义；
      向量空间、基与维数；
    - **重要**：SVD 的几何解释（旋转-缩放-旋转）以及它在降维/推荐系统里的用法；
      正定矩阵、二次型（出现在最优化里）；
    - **进阶**：矩阵分解在数值稳定性上的考量。

    推荐的学法（关键在"几何直觉"而不是刷题）：
    3Blue1Brown 的《线性代数的本质》是性价比最高的入门材料 ——
    它讲的是"矩阵对你做了什么"，而不是一堆行列式运算。

    常见坑：只当计算课学 —— 会算特征值却说不清它代表什么，
    到了实际场景里根本用不上。
  prerequisite: []
  learn_path:
    - 先看 3Blue1Brown 系列，建立几何直觉（约 2 周）
    - 系统过一遍教材（Gilbert Strang 或国内教材），配套做题
    - 手写 SVD 和 PCA，理解降维在做什么
    - 回头用线性代数重新推导一遍神经网络的前向传播
  jd_phrases: [数学基础, 线性代数, 矩阵运算, 数学功底]
  tags: [数学, 地基]

- id: probability
  name: 概率统计
  zh: 概率论与数理统计
  full_name: Probability & Statistics
  domain: foundations
  level: 入门
  # 注意：**不要**把裸「分布」当别名 —— 它会命中「分布式训练」，造成大面积误判。
  aliases: [概率论, 数理统计, 概率统计, 贝叶斯, 假设检验, 置信区间, 最大似然, 概率分布, 统计推断]
  what: 研究"在不确定下如何推断"的数学 —— 是机器学习、评测、AB 测试的共同基础。
  why: |
    几乎所有"从数据里学"的方法都建立在这上面：
    - 损失函数来自**最大似然估计**；
    - 模型评测、A/B 测试要不要信这个结论，靠**假设检验**；
    - 卡尔曼滤波、贝叶斯优化，本质是概率推断。

    AI 岗位的面试里，"为什么用交叉熵而不用 MSE"这种问题，
    答不上来就暴露了地基的松。
  how: |
    - **必会**：常见分布（正态 / 伯努利 / 泊松 / 指数）及其场景；
      期望、方差、协方差；条件概率与贝叶斯公式；
    - **重要**：最大似然估计 MLE vs 最大后验 MAP；
      大数定律与中心极限定理（解释了为什么样本量重要）；
    - **工程必备**：假设检验与 p 值、置信区间、t 检验、
      以及"样本量不够时结论可能是噪声"这个意识。

    常见坑：拿小样本的分数差异当结论 ——
    模型 A 比 B 高 1 分，可能纯粹是随机波动。做评测必须算显著性。
  prerequisite: []
  learn_path:
    - 概率基础 + 常见分布，重在"什么时候用哪个"
    - 贝叶斯公式的推导，以及从先验到后验的直觉
    - 最大似然估计，然后回头理解交叉熵损失
    - 假设检验与置信区间，用真实数据做一次 A/B 分析
  jd_phrases: [概率统计, 数学基础, 统计推断, 数学功底]
  tags: [数学, 地基]

- id: optimization
  name: 最优化
  zh: 最优化方法
  full_name: Mathematical Optimization
  domain: foundations
  level: 进阶
  aliases: [最优化, 优化理论, 凸优化, 梯度下降, SGD, Adam, 拉格朗日, KKT, 凸集]
  what: 研究"怎么找到最好的解"的数学 —— 模型训练的本质就是解一个优化问题。
  why: |
    训练模型 = 优化损失函数；控制机器人 = 优化轨迹代价；投资组合 = 优化风险收益比。
    **三个方向共用同一套数学**，这是它值得优先投入的原因。
  how: |
    - **必会**：梯度下降及其变体（SGD / Momentum / Adam）的直觉与区别；
      学习率的作用与调度；凸函数与非凸的区别；
    - **重要**：拉格朗日乘子法与 KKT 条件（理解带约束的优化）；
      牛顿法、拟牛顿法（L-BFGS）；
    - **面试高频**：为什么 Adam 通常比 SGD 收敛快？
      为什么 Batch Norm 能加速训练？（两者都跟损失曲面有关）

    常见坑：只知道调学习率，不理解为什么要 warmup、要衰减 ——
    这些超参数设计背后都是优化理论。
  prerequisite: [linear-algebra]
  learn_path:
    - 梯度下降手写实现 + 可视化损失曲面
    - 对比 SGD / Momentum / Adam 在同一问题上的表现
    - 学凸优化基础：凸集、凸函数、对偶
    - 拉格朗日乘子法，并从 SVM 或 MPC 里看到一个真实应用
  jd_phrases: [最优化, 优化算法, 凸优化, 梯度下降]
  tags: [数学, 地基]

- id: programming-basics
  name: 编程基础
  zh: 编程基础 / 数据结构
  full_name: Programming Fundamentals
  domain: foundations
  level: 入门
  aliases: [数据结构, 算法基础, 编程基础, 时间复杂度, 算法与数据结构]
  what: 变量、控制流、函数、以及"用什么样的结构存数据、复杂度是多少"的基本功。
  why: |
    这是**所有技术岗的入场券**。不写在 JD 里是因为默认你已经有 ——
    但面试的笔试环节考的就是它。
  how: |
    - **语言**：至少精通一门（Python 或 C++），能读懂第二门；
    - **数据结构**：数组、链表、哈希表、栈队列、树、堆、图 ——
      重点是**知道什么时候该用哪个**；
    - **复杂度**：会算时间/空间复杂度（大 O），
      并能在写代码时意识到"这里会不会超时"；
    - **基本功**：调试能力、读别人的代码、看报错、写清晰可维护的代码。

    常见坑：刷了一堆题但不会写工程代码 ——
    面试会同时考算法的**和**工程的能力，偏废一边都不行。
  prerequisite: []
  learn_path:
    - 选一门语言写到不查语法
    - 系统学数据结构，每种手写实现一次
    - 刷题（100-200 道中等难度足够），重点在"想清楚再写"
    - 参与一个真实项目，体会工程代码和刷题代码的差别
  jd_phrases: [数据结构, 算法基础, 编程能力, 编码能力]
  tags: [计算机, 地基]

- id: deep-learning
  name: 深度学习
  zh: 深度学习
  full_name: Deep Learning
  domain: foundations
  level: 进阶
  aliases: [深度学习, 神经网络, 卷积网络, CNN, RNN, LSTM, 反向传播, 损失函数, 过拟合, 正则化, BatchNorm]
  what: 用多层神经网络从数据里自动学特征的那套方法 —— 当代 AI 的技术底座。
  why: |
    这是**从"会用工具"到"理解原理"的分水岭**。
    会调 PyTorch 不等于会深度学习；能解释"为什么这个网络有效、
    为什么过拟合了、该加什么正则"，才是。
  how: |
    必须能讲清楚的东西：
    - **前向与反向**：反向传播到底在算什么（链式法则），
      为什么需要计算图；
    - **优化相关**：为什么用交叉熵、BatchNorm 在做什么、
      Dropout 为什么有用、学习率与 batch size 的关系；
    - **过拟合与泛化**：训练集好测试集差意味着什么，
      正则化 / 数据增强 / 早停各自解决哪一块；
    - **架构感**：CNN 为什么适合图像（局部性与平移不变性）、
      RNN 的序列建模与其梯度问题、注意力机制在解决什么。

    常见坑：把网络当黑盒调参 ——
    遇到不收敛只会换超参，说不出"梯度消失"还是"学习率太大"。
  prerequisite: [linear-algebra, probability, optimization]
  learn_path:
    - 手写一个两层神经网络（不用框架），把反向传播推一遍
    - 用 PyTorch 重写同一个网络，对比两者的差别
    - 做一次过拟合实验：小数据集上先让它过拟合，再一步步加正则
    - 读经典架构论文（LeNet → ResNet → Transformer），看设计动机
  jd_phrases: [深度学习, 神经网络, 模型训练, 机器学习基础]
  tags: [AI, 地基]

- id: generative-model
  name: 生成式模型
  zh: 生成式模型
  full_name: Generative Models
  domain: foundations
  level: 进阶
  aliases: [生成模型, 扩散模型, Diffusion, GAN, VAE, 自编码器, 流模型, 扩散]
  what: 学会数据的概率分布、从而能"造出新的数据"的那一类模型。
  why: |
    AIGC 岗位的底层知识。会用 ComfyUI 出图是技能，
    理解扩散模型为什么能生成、怎么控制生成，才是能力。
  how: |
    - **三代演进**：VAE（变分下界，隐空间采样）→ GAN（对抗训练，
      生成对抗判别）→ Diffusion（逐步去噪，稳定但慢）——
      知道每一代解决了上一代的什么问题；
    - **扩散模型核心**：前向加噪与反向去噪的过程、
      噪声预测目标、以及 CFG（分类器无关引导）如何控制"贴合提示词的程度"；
    - **工程关注**：采样步数与质量的关系、蒸馏加速（少步数采样）、
      以及 Latent Diffusion 为什么能把算力降下来。

    常见坑：只当调参师 —— 不理解 CFG、种子、采样器的原理，
    就没法在效果不好时判断该改哪一环。
  prerequisite: [deep-learning, probability]
  learn_path:
    - 从 VAE 入手，理解隐空间与重构
    - 学 GAN 的对抗训练，理解模式崩塌
    - 推一遍 DDPM 的加噪与去噪公式
    - 自己实现一个最小扩散模型（MNIST 上即可）
  jd_phrases: [扩散模型, 生成模型, Diffusion, AIGC原理]
  tags: [AI, 地基]

- id: control-theory
  name: 控制理论
  zh: 控制理论
  full_name: Control Theory
  domain: foundations
  level: 进阶
  aliases: [控制理论, 自动控制, PID, 反馈控制, 状态空间, 鲁棒控制, 稳定性分析, 频域分析]
  what: 研究"怎么让系统按意图稳定运行"的理论 —— 机器人的"肌肉反射"。
  why: |
    机器人运控岗的**核心知识**。仿真里跑得再好，
    真机上抖、飘、发散，问题基本都出在控制这条链上。
  how: |
    - **经典控制**：PID 三项各自的作用与调参直觉（P 响应快但振荡，
      I 消静差但易饱和，D 抑制超调但怕噪声）、频域分析（伯德图、相位裕度）；
    - **现代控制**：状态空间表达、能控性与能观性、
      极点配置、LQR（线性二次调节器）；
    - **进阶**：MPC（模型预测控制，能处理约束）、
      鲁棒控制（模型不准时怎么办）、
      以及阻抗/导纳控制（做力交互的基础）。

    常见坑：把"稳定性"当默认 —— 实际系统常因为**延迟**而失稳，
    仿真里没有的传感器延迟是最大的杀手。
  prerequisite: [linear-algebra, dynamics]
  learn_path:
    - 用 Python 仿真一个倒立摆，手调 PID 让它站起来
    - 学状态空间，用 LQR 重做同一个倒立摆，对比调参难度
    - 理解频域分析：为什么相位裕度不够会振荡
    - 上 MPC，看它怎么处理"角度不能超过多少"这类约束
  jd_phrases: [控制理论, 自动控制, PID, 控制算法, 稳定性]
  tags: [机器人, 地基]

- id: kinematics
  name: 运动学
  zh: 机器人运动学
  full_name: Robot Kinematics
  domain: foundations
  level: 进阶
  aliases: [运动学, 正运动学, 逆运动学, DH参数, 雅可比, 工作空间, 位姿]
  what: 只关心"位置、姿态、速度怎么变"，不关心"为什么这么变"（那是动力学）。
  why: |
    机械臂和运动控制的**第一门专业课**。
    正运动学解决"给定关节角，手在哪"；逆运动学解决反过来。
    所有轨迹规划、抓取、标定都建立在它之上。
  how: |
    - **正运动学**：用 DH 参数或旋量法建模，从关节角算出末端位姿；
    - **逆运动学**：解析法（快但只适用于特定结构）vs
      数值法（通用但依赖初值，可能多解或无解）；
    - **雅可比矩阵**：关节速度与末端速度的关系 ——
      这是理解**奇异位形**（某些姿态下手无法移动）的关键；
    - **实操**：会用 ROS 里的 MoveIt 做正逆解验证。

    常见坑：忽略多解问题 —— 逆运动学通常有多个解，
    不根据当前姿态选最近的，机械臂就会"绕大圈"甚至自碰撞。
  prerequisite: [linear-algebra]
  learn_path:
    - 学齐次变换矩阵与旋转表示（四元数、欧拉角）
    - 用一个 6 轴机械臂手推 DH 参数与正运动学
    - 实现数值逆运动学（雅可比迭代法）
    - 在 MoveIt 里验证你的解，观察奇异位形的表现
  jd_phrases: [运动学, 逆运动学, 位姿, 雅可比, 轨迹]
  tags: [机器人, 地基]

- id: dynamics
  name: 动力学
  zh: 机器人动力学
  full_name: Robot Dynamics
  domain: foundations
  level: 高级
  aliases: [动力学, 牛顿欧拉, 拉格朗日方程, 惯量, 力矩, 动力学建模, 多体动力学]
  what: 研究力与运动的关系 —— 牛顿第二定律在复杂多体系统上的展开。
  why: |
    运动学告诉你有**没有**解，动力学告诉你**需要多大力矩**。
    所有涉及力矩控制、力控、柔顺、以及人形机器人平衡的岗位，都要它。
  how: |
    - **两种建模方法**：牛顿-欧拉（递归、适合计算）与
      拉格朗日（能量视角、适合推导）；
    - **关键量**：质量矩阵、科氏力与离心力项、重力项；
    - **工程意义**：算出的力矩决定了**电机选型** ——
      这是算法岗和硬件岗必须对齐的地方；
    - **进阶**：接触动力学（足式机器人的落地冲击全靠它）。

    常见坑：仿真里用理想电机，忽略力矩上限和带宽 ——
    真机上"算法要求 200Nm 但电机只有 40Nm"，直接动不了。
  prerequisite: [algorithms-mechanics, probability]
  learn_path:
    - 理论力学扎实到能写出单摆的动力学方程
    - 学拉格朗日方法，推导二连杆臂的动力学
    - 用牛顿-欧拉递归实现一次，对比两者结果
    - 用 MuJoCo 或 Isaac Sim 验证，并加上电机力矩限制看差异
  jd_phrases: [动力学, 动力学建模, 力矩, 惯量]
  tags: [机器人, 地基]

- id: algorithms-mechanics
  name: 理论力学
  zh: 理论力学 / 工程力学
  full_name: Theoretical Mechanics
  domain: foundations
  level: 进阶
  # 「运动学」留给 kinematics 那条，这里不放，避免同一条 JD 被两个技能重复计入。
  aliases: [理论力学, 工程力学, 静力学, 材料力学, 受力分析, 刚体力学]
  what: 分析和计算物体受力与运动的力学基础 —— 静力学、运动学、动力学三部分。
  why: |
    硬件与结构岗的**基本功**。JD 里写"机械设计"的岗位，
    面试第一关就是给你一个机构让你画受力图。
    算法岗如果要做力控，同样绕不开。
  how: |
    - **静力学**：受力分析、平衡方程、摩擦力 ——
      判断一个机构在静止时会不会塌；
    - **运动学**：点的运动与刚体平面运动 ——
      速度瞬心、加速度分析；
    - **动力学**：动量定理、动量矩定理、达朗贝尔原理 ——
      机器人的动力学方程从这里长出来。

    常见坑：跳过热力学直接学机器人学 ——
    后面遇到"为什么这里要用谐波减速器而不是行星减速器"这类问题就答不上。
  prerequisite: []
  learn_path:
    - 静力学：受力分析图画到条件反射（这是所有力学题的第一步）
    - 运动学：速度瞬心法 + 加速度分析
    - 动力学三大定理，各做几道典型题
    - 用这些知识分析一个真实的机器人关节
  jd_phrases: [理论力学, 力学基础, 受力分析, 力学分析]
  tags: [机械, 地基]

- id: sensor-principles
  name: 传感器原理
  zh: 传感器原理
  full_name: Sensor Principles
  domain: foundations
  level: 进阶
  aliases: [传感器原理, 传感器选型, 编码器, 力矩传感器, 六维力, 深度相机, 激光雷达, 标定原理]
  what: 理解各类传感器"测什么、怎么测、误差从哪来" —— 决定整个感知链路的上限。
  why: |
    机器人领域有一句话：**垃圾进，垃圾出**。
    算法再强也救不了标定不准、噪声大的传感器数据。
    JD 里出现"传感器选型"或"标定"，说明岗位要为一整条链路的精度负责。
  how: |
    - **内部传感器**：编码器（测关节角）、IMU（测姿态）、
      电流传感器（间接测力矩）；
    - **外部传感器**：深度相机（结构光 / 双目 / ToF 各自优劣）、
      激光雷达、六维力/力矩传感器（力控的核心）；
    - **共性知识**：分辨率、精度、重复性、量程与漂移 ——
      这五个指标怎么读，决定了选型；
    - **标定**：内参、外参、时延标定 ——
      多传感器融合前必须先做的功课。

    常见坑：只看分辨率不看漂移 ——
    一个分辨率很高但漂移严重的传感器，在长时间任务里完全不可用。
  prerequisite: [signal-processing]
  learn_path:
    - 搞清分辨率 / 精度 / 重复性的区别（面试高频）
    - 逐个了解编码器、IMU、深度相机、六维力传感器的原理
    - 做一次相机内参标定（棋盘格），理解畸变参数
    - 做一次手眼标定，体会外参误差如何放大到末端
  jd_phrases: [传感器, 传感器选型, 标定, 感知硬件]
  tags: [硬件, 地基]

- id: signal-processing
  name: 信号处理
  zh: 信号与系统
  full_name: Signal Processing
  domain: foundations
  level: 进阶
  aliases: [信号处理, 数字信号处理, 信号与系统, 傅里叶变换, FFT, 滤波, 卡尔曼滤波, 采样定理]
  what: 从含噪的时序数据里提取有用信息的数学工具 —— 滤波器、频域变换、状态估计。
  why: |
    真实世界的传感器数据全是噪声。
    **没有信号处理，控制算法就是在噪声上做微分，结果被放大到不可用。**
    这是机器人岗和 AI Infra 岗共同的隐性要求。
  how: |
    - **必备**：傅里叶变换与频域视角（理解"这个信号的主要频率在哪"）、
      采样定理（为什么采样不够会混叠）；
    - **滤波器**：低通/高通/带通、FIR 与 IIR 的取舍、
      移动平均 vs 指数平滑；
    - **状态估计**：卡尔曼滤波（KF → EKF → UKF）、
      互补滤波 —— 这是多传感器融合的标准工具；
    - **工程实践**：知道微分要配低通滤波、
      信号延迟与滤波强度的权衡。

    常见坑：直接对含噪信号求微分 ——
    噪声被放大几十倍，控制输出直接抖成筛子。
  prerequisite: [probability, linear-algebra]
  learn_path:
    - 学傅里叶变换的物理意义，用 FFT 分析一段真实传感器数据
    - 实现一个低通滤波器，观察延迟与平滑度的权衡
    - 从 1D 卡尔曼滤波开始，理解"预测 + 更新"两步
    - 扩展到 EKF，做一次 IMU + 编码器的融合定位
  jd_phrases: [信号处理, 滤波, 卡尔曼滤波, 状态估计, 频域]
  tags: [数学, 地基]

- id: electronics
  name: 电子电路
  zh: 电子电路基础
  full_name: Electronics & Circuits
  domain: foundations
  level: 进阶
  aliases: [电子电路, 电路设计, 模拟电路, 数字电路, 电源设计, PCB, 电机驱动, 电源管理]
  what: 从芯片、电源到驱动电路的硬件基础 —— 让电真正按意图流动。
  why: |
    机器人硬件岗的必需项，也是**算法岗与硬件岗沟通的共同语言**。
    知道电机驱动器的电流环是怎么实现的，
    才能理解"为什么这个力矩指令执行不了"。
  how: |
    - **基础**：欧姆定律、基尔霍夫定律、RC/RL 电路、
      运放的基本接法（跟随、放大、比较）；
    - **数字电路**：逻辑门、时序逻辑、ADC/DAC 的采样精度；
    - **功率电子**：电机驱动（H 桥、FOC 矢量控制）、
      电源管理（BMS、DC-DC）、以及 EMI 与散热。

    常见坑：忽略**电源噪声** —— 电机一启动，控制系统就复位，
    十有八九是电源没隔离好。
  prerequisite: [sensor-principles]
  learn_path:
    - 电路基础：会分析简单 RC / RL 电路
    - 学运放，做一次信号调理
    - 理解 FOC 电机控制的原理（这是现代机器人关节的核心）
    - 画一块简单 PCB 并打样回来实测
  jd_phrases: [电子电路, 硬件设计, 电路, 电机驱动]
  tags: [硬件, 地基]

- id: financial-analysis
  name: 财务分析
  zh: 财务分析 / 三张表
  full_name: Financial Analysis
  domain: foundations
  level: 进阶
  aliases: [财务分析, 财务报表, 三张表, 资产负债表, 利润表, 现金流量表, 财务建模, DCF, 财务尽调]
  what: 读懂一家公司的经营与财务健康状况 —— 投资判断的起点。
  why: |
    投资岗的核心基本功。一手看财务数据，一手看行业趋势，
    缺任何一边都做不出可靠判断。
  how: |
    - **三张表**：资产负债表（有什么、欠什么）、
      利润表（赚不赚钱）、现金流量表（真金白银进来多少）——
      关键是理解**三者的勾稽关系**；
    - **分析**：杜邦分析拆解 ROE、
      比率分析（毛利率、周转率、负债率）横向纵向对比；
    - **建模**：三表联动模型、DCF 估值、可比公司分析；
    - **一级市场特色**：早期公司财务不规范，
      要会看**收入的真实性和可持续性**，而不是套模板。

    常见坑：只看利润表不看现金流 ——
    账面盈利但经营现金流为负的公司，往往是危险的。
  prerequisite: []
  learn_path:
    - 读懂三张表，能手工把一家上市公司的三表勾稽出来
    - 学杜邦分析与主要财务比率
    - 用 Excel 搭一个三表联动模型
    - 做一次 DCF 估值，并做敏感性分析
  jd_phrases: [财务分析, 财务报表, 财务建模, 财务尽调]
  tags: [金融, 地基]
