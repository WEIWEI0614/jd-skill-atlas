skills:

- id: project-management
  name: 项目管理
  zh: 项目管理
  full_name: Project Management
  domain: soft
  level: 入门
  aliases: [项目管理, PM, Project Management, 进度管理, 里程碑, 项目推进, 立项]
  what: 让一件事在规定时间、预算、质量要求下交付 —— 核心是管「范围、时间、成本」的三角。
  why: |
    几乎每个非技术岗位的 JD 都会写。写得越具体（「独立推进跨部门项目」），
    说明这个岗位越需要你自己扛事，而不是执行指令。
  how: |
    三个最容易失控的地方：
    - **范围蔓延（Scope Creep）**：需求不断加，工期不变。
      应对是设立变更流程，每次加需求都要对应调整时间或砍别的；
    - **依赖管理**：你的任务卡在别人手上。
      应对是把依赖显性化，提前对齐，而不是等到 deadline 才发现；
    - **风险预警**：坏消息要早说。项目管理的价值不在于「不出问题」，
      而在于「问题出现时你是第一个知道的」。

    工具层面（Jira、飞书项目、Notion）只是载体，
    真正的能力是「把模糊的事拆成可执行、可验收的任务」。

    常见坑：把项目管理等同于「催进度」。
    高质量的 PM 做的是消除不确定性，而不是施加压力。
  prerequisite: []
  learn_path:
    - 掌握 WBS（工作分解）：把一个目标拆到「一天内能完成」的粒度
    - 学关键路径法，识别哪些任务真的影响交付时间
    - 练习写项目周报：进展、风险、需要的支持（而不是流水账）
    - 复盘一次自己参与过的失败项目，找出真正的根因
  jd_phrases: [项目管理, 项目推进, 跨部门协调, 进度把控, 独立负责]
  tags: [软技能, 必备]

- id: requirement-analysis
  name: 需求分析
  zh: 需求分析
  full_name: Requirement Analysis
  domain: product
  level: 入门
  aliases: [需求分析, 需求调研, 需求管理, 需求定义, 需求评审, PRD]
  what: 把「用户说想要什么」翻译成「团队能做什么」—— 中间隔着大量澄清与取舍。
  why: |
    产品岗的日常核心。也是所有「对接业务」岗位的基本功。
  how: |
    关键认知：**用户说的需求往往不是真需求**。
    经典的例子是「用户要更快的马」，真需求是「更快到达目的地」。

    实操方法：
    - 追问场景：不要问「你想要什么功能」，要问「你上次遇到这个问题是什么时候，
      当时怎么解决的，卡在哪」；
    - 区分「想解决的问题」和「提出的方案」；
    - 定义验收标准：什么叫「做完了」？必须可衡量。

    输出物是 PRD（产品需求文档），核心是三块：
    背景（为什么要做）、方案（做成什么样）、验收（怎么算做完）。

    常见坑：把需求写成功能清单。
    没有「为什么」的需求文档，开发看不懂，最后做出来的东西自然不对。
  prerequisite: []
  learn_path:
    - 学「五问法」：连续问五次为什么，挖到真需求
    - 读一份真实 PRD，体会结构
    - 练习：选一个你常用的 App，写一份改进需求的 PRD
  jd_phrases: [需求分析, 需求调研, 需求管理, PRD, 需求评审]
  tags: [产品, 必备]

- id: business-analysis
  name: 商业分析
  zh: 商业分析
  full_name: Business Analysis
  domain: product
  level: 进阶
  aliases: [商业分析, 业务分析, BA, Business Analysis, 战略分析, 经营分析, 业务洞察]
  what: 用数据和逻辑回答「这门生意怎么赚钱、能不能持续赚」。
  why: |
    连接业务与决策的岗位。也是投资、战略、产品岗的共同底层能力。
    对转型者友好 —— 不需要深厚技术背景，但需要结构化思维。
  how: |
    标准分析框架：
    - **拆解指标**：把「收入」拆成「用户数 × 转化率 × 客单价」，
      再逐层找瓶颈在哪一层；
    - **对比基准**：和上期比、和竞品比、和行业比，没有对比的数字没有意义；
    - **归因**：找到变化的真实原因，而不是相关关系；
    - **给出建议**：分析必须落到「所以我们应该做什么」。

    三个层次（越往上越值钱）：
    1) 描述性分析：发生了什么（报表）；
    2) 诊断性分析：为什么发生（归因）；
    3) 预测性/处方性分析：会怎样、该怎么办（决策支持）。

    常见坑：堆砌图表但没有结论。
    好的商业分析一定是「一句话结论 + 三条支撑证据 + 一个行动建议」。
  prerequisite: [data-analysis]
  learn_path:
    - 学指标拆解：选一个熟悉的业务，把核心指标拆成乘法结构
    - 练习写分析报告：结论先行（金字塔原理）
    - 学基础财务：毛利率、单位经济模型（UE）、盈亏平衡
    - 研究一份上市公司的业绩分析报告，看专业分析师怎么拆
  jd_phrases: [商业分析, 业务分析, 战略分析, 经营分析, 数据分析, 行业研究]
  tags: [核心, 转型友好]

- id: data-analysis
  name: 数据分析
  zh: 数据分析
  full_name: Data Analysis
  domain: data
  level: 入门
  aliases: [数据分析, 数据处理, SQL, 数据洞察, 数据看板, 埋点, 指标体系]
  what: 从数据里找出答案 —— 取数、清洗、分析、呈现。
  why: |
    几乎所有岗位都要求。技术门槛不高（SQL + Excel + 一点统计），
    但它是很多高阶能力的入场券。
  how: |
    工具链从低到高：
    - Excel/表格：够用，透视表能解决 80% 日常问题；
    - SQL：必备。重点是 join、group by、窗口函数；
    - Python（pandas）：处理大批量、做复杂分析时用；
    - BI 工具（Tableau、Metabase）：做看板和汇报。

    统计基础要知道：
    - 相关 ≠ 因果（这是最常见的错误）；
    - 辛普森悖论：分组看和整体看结论可能相反；
    - 样本偏差：数据本身怎么来的，决定了结论能不能用。

    常见坑：拿到数据直接算均值。
    先看分布、找异常值、确认口径 —— 口径错了后面全错。
  prerequisite: []
  learn_path:
    - 先把 SQL 练熟（重点是窗口函数和 join）
    - 学 pandas 做数据清洗和聚合
    - 补基础统计：分布、假设检验、相关性
    - 练习：找一个公开数据集，完整做一次分析并写出结论
  jd_phrases: [数据分析, SQL, 数据驱动, 数据洞察, 指标体系]
  tags: [基础, 必备]

- id: competitive-analysis
  name: 竞品分析
  zh: 竞品分析
  full_name: Competitive Analysis
  domain: product
  level: 入门
  aliases: [竞品分析, 竞争分析, 市场调研, 对标分析, 行业研究, 竞争格局]
  what: 搞清楚「别人在做什么、做得怎么样、我们差在哪」。
  why: |
    产品、战略、投资岗的通用技能。
    也是新人最容易做出成绩的地方 —— 不需要资源，只需要方法和耐心。
  how: |
    避免做成「功能对比表」。真正有价值的竞品分析回答三个问题：
    - **他们的战略选择是什么**：做什么、不做什么、为什么；
    - **他们的能力从哪来**：技术、渠道、还是资本；
    - **我们的机会窗口在哪**：哪里是他们做不了或不屑于做的。

    信息渠道：官网/产品实测、招聘 JD（能看出组织重心）、
    融资新闻（能看出资本押注方向）、专利、财报、用户评价。

    一个实用技巧：**看竞品在招什么岗位，就知道他们要往哪打**。
    突然大量招某个方向的工程师，说明产品要转向了。

    常见坑：只对比功能，不分析背后的战略。
    功能是结果，战略才是原因。
  prerequisite: []
  learn_path:
    - 选一个你熟悉的行业，做一次完整的竞品地图
    - 练习从招聘信息倒推公司战略
    - 学波特五力、SWOT 等框架（但别硬套，理解逻辑即可）
  jd_phrases: [竞品分析, 市场调研, 行业研究, 竞争分析, 对标]
  tags: [产品, 必备]

- id: government-relations
  name: 政府关系
  zh: 政府关系
  full_name: Government Relations
  domain: soft
  level: 进阶
  aliases: [政府关系, GR, 政企对接, 政府事务, 政策研究, 项目申报, 公共事务]
  what: 对接政府部门，帮公司拿到政策支持、资质、补贴和项目。
  why: |
    硬科技行业的刚需岗位 —— 因为大量资源（资金、土地、订单、资质）
    掌握在政府手里。这个岗位看重沟通能力和政策理解，对技术背景要求低。
  how: |
    四块日常工作：
    - **政策跟踪**：国家/地方出了什么新政策，公司能不能用上。
      硬科技方向要盯：专精特新、首台套、揭榜挂帅、各类专项；
    - **项目申报**：写申报材料，争取政府补贴和专项支持。
      关键是「把公司的技术故事翻译成政府听得懂的语言」；
    - **资质申请**：高新技术企业、专精特新、各类许可；
    - **关系维护**：日常走访、接待、会议。

    核心能力是**写材料**和**读懂政策文件**。
    政策文件里的「支持」「鼓励」「原则上」都有具体含义，需要经验才能把握。

    常见坑：以为这岗位只靠「关系」。
    实际上材料写不好、项目申报不上，关系再硬也没用。
  prerequisite: []
  learn_path:
    - 学会读政策文件：找国家/部委/地方三级文件，理解层级关系
    - 研究一个具体的申报项目（如专精特新）的完整流程和材料要求
    - 练习写一份项目申报书的框架
  jd_phrases: [政府关系, GR, 政府事务, 项目申报, 政策研究, 政企合作]
  tags: [路径, 硬科技]

- id: business-model
  name: 商业模式
  zh: 商业模式
  full_name: Business Model
  domain: product
  level: 进阶
  aliases: [商业模式, 盈利模式, 变现路径, 单位经济模型, UE, 商业化]
  what: 一门生意怎么赚钱、成本花在哪、能不能规模化。
  why: |
    投资、战略、商业化岗位的核心判断力。
    硬科技行业尤其重要 —— 很多技术很强的公司死在「不知道怎么赚钱」上。
  how: |
    拆解框架：
    **收入端**：卖给谁（客户画像）、卖什么（产品形态）、
    怎么收钱（一次性/订阅/按量/分成）、定价逻辑。
    **成本端**：固定成本（研发、设备）vs 变动成本（物料、交付）。
    **单位经济模型（UE）**：单个客户/单台设备的收入和成本，
    是不是正的？规模化后能不能改善？

    硬科技的特殊难度：
    - 研发投入前置，回报周期长；
    - 早期客户往往是政府/大企业，订单不连续；
    - 毛利率可能不低，但交付成本（人力、部署）很高。

    常见坑：只看收入增长，不看单位经济。
    亏钱卖货能把收入做得很漂亮，但越卖越亏。
  prerequisite: [business-analysis]
  learn_path:
    - 学会拆解任何一门生意的收入和成本结构
    - 算一次 UE：假设做一台机器人的物料成本、人工成本、售价
    - 研究 2-3 家硬科技公司的招股书，看它们的商业模式描述
  jd_phrases: [商业模式, 盈利模式, 商业化, 单位经济, 变现]
  tags: [核心, 转型友好]

- id: cross-functional
  name: 跨部门协作
  zh: 跨部门协作
  full_name: Cross-functional Collaboration
  domain: soft
  level: 入门
  # 注意：别名不要放裸「协同」——JD 里这个词太泛（"Channel 协同"、"协同算法团队"），
  # 会造成大量误判。要么用完整短语，要么不放。
  aliases: [跨部门协作, 跨部门沟通, 跨部门合作, 跨部门协调, 横向推动, 协同推进, 资源协调]
  what: 在没有直接汇报关系的情况下，让别人愿意配合你完成事情。
  why: |
    JD 里出现「跨部门」「协同」「推动」这类词，
    说明这个岗位要你自己去找资源，而不是等着别人给。
    这是区分「执行者」和「推动者」的关键。
  how: |
    核心难点：**你没有权力，只有影响力**。

    四个实用原则：
    - **先给对方理由**：他要的是他的 KPI，不是你的目标 ——
      把「我需要你做什么」翻译成「这对你的目标有什么帮助」；
    - **降低对方成本**：能自己做的准备全做完，
      只让对方做「非他不可」的事；
    - **找对层级**：技术问题找技术，资源问题找主管，
      不要试图用一个人解决所有事；
    - **留痕**：口头共识变成文字结论，避免后续扯皮。

    常见坑：遇到不配合就向上汇报。
    这是最快消耗信任的方式，除非真的卡死，否则先自己想办法。
  prerequisite: []
  learn_path:
    - 复盘一次你推动失败的事，分析卡在哪一方
    - 练习「换位表达」：把你的需求改写成对方的收益
    - 学基础的利益相关方分析（stakeholder mapping）
  jd_phrases: [跨部门协作, 协同, 横向推动, 资源协调, 沟通协调]
  tags: [软技能, 必备]

- id: industry-research
  name: 行业研究
  zh: 行业研究
  full_name: Industry Research
  domain: investment
  level: 进阶
  aliases: [行业研究, 行研, 产业研究, 赛道研究, 产业链分析, 投资研究, 投研]
  what: 把一个行业的格局、驱动力、玩家、趋势讲清楚。
  why: |
    投资岗和战略岗的核心产出能力。
    「能独立输出行业研究报告」是投资经理级别的基本要求。
  how: |
    一份合格的行业研究回答四层问题：
    1) **市场有多大**：规模、增速、驱动因素（政策/技术/需求）；
    2) **格局是什么样**：集中度、头部玩家、竞争维度（价格/技术/渠道）；
    3) **钱怎么流动**：产业链上中下游，谁有定价权，利润留在哪个环节；
    4) **往哪走**：技术路线会不会变、政策会不会变、谁是潜在赢家。

    信息源分层：
    - 一手：专家访谈、客户访谈、实地调研 —— 最值钱；
    - 二手：券商研报、招股书、行业白皮书、专利数据；
    - 噪声：媒体转载、自媒体 —— 要交叉验证。

    一个实用判断：**产业链上「卡脖子」的环节，通常是价值最高、也是投资机会最集中的地方**。

    常见坑：把研报摘要拼起来当行研。
    没有一手信息的行研，就是在复述别人的观点。
  prerequisite: [competitive-analysis, data-analysis]
  learn_path:
    - 读 3-5 份券商深度报告，学习它的结构和论证方式
    - 选一个细分赛道，自己写一份 10 页的行研
    - 练习画产业链图谱：从上游原材料到下游应用
    - 做一次专家访谈（哪怕找行业从业者聊一小时），体会一手信息的价值
  jd_phrases: [行业研究, 行研, 投研, 产业研究, 赛道研究, 产业链]
  tags: [核心, 投资必备]
