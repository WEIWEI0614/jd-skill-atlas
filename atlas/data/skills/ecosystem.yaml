# ============================================================================
#  技能词典 · 生态与流程（从真实 JD 缺口里捞出来的）
#  ---------------------------------------------------------------------------
#  这一批全部来自两个赛道的「词典缺口」扫描 ——
#  即在真实 JD 里高频出现、但词典没收、因此分析结果里看不见的词。
#
#  它们大多不是「知识点」而是「生态位」：
#  某个行业默认你会用的工具、某套流程默认你懂的术语。
#  恰恰因为默认，没人会教你 —— 而面试官默认你知道。
# ============================================================================

label: 生态与流程 · 行业默认术语

skills:

- id: dds
  name: DDS
  zh: 数据分发服务
  full_name: Data Distribution Service
  domain: robotics
  level: 高级
  aliases: [DDS, FastDDS, CycloneDDS, RTPS, 数据分发服务, 发布订阅, 中间件]
  what: 一套**去中心化**的实时发布/订阅通信中间件 —— **ROS 2 的底层就是它**。
  why: |
    这是「用过 ROS 1」和「做过 ROS 2 生产部署」之间的分界线。
    面试问 DDS，其实是在问：你知不知道 ROS 2 为什么换掉了 ROS 1 的通信层？
  how: |
    - **ROS 1 的问题**：依赖一个中心节点（roscore），它挂了整机就瘫痪；
      通信是 TCP 为主，实时性没保证。
    - **DDS 解决的**：去中心化（无单点故障）、
      内置 QoS 策略（可靠性、时效性、历史深度可逐话题配置）、
      支持 UDP 多播与实时传输。
    - **必须懂的 QoS**：Reliability（可靠/尽力）、
      Durability（是否给后加入的订阅者补发历史）、
      Deadline（超时检测）、Liveliness（节点存活探测）。
      **配错 QoS 是 ROS 2 最常见的"玄学问题"来源** ——
      表现为"话题看不到数据"，其实两边 QoS 不兼容。
    - **实现选型**：Fast DDS、Cyclone DDS、RTI Connext 各有侧重，
      默认实现可能不适配高频控制场景。

    常见坑：默认 QoS 在低频话题上没问题，
    一旦上高频（1kHz 关节数据）就开始丢包或延迟抖动，
    需要专门调 Reliability 与 History。
  prerequisite: [ros, fieldbus]
  learn_path:
    - 搞清 ROS 1 和 ROS 2 通信层的本质差异
    - 在 ROS 2 里配一次 QoS，制造一次"看不到数据"的故障再修好
    - 用 `ros2 topic hz` 和 `--qos-reliability` 观察实际频率
    - 对比一次高频话题在不同 DDS 实现下的抖动
  jd_phrases: [DDS, ROS2, 通信中间件, 发布订阅, QoS]
  tags: [通信, 生态]

- id: umi
  name: UMI
  zh: 通用操作接口 / 穿戴式数据采集
  full_name: Universal Manipulation Interface
  domain: robotics
  level: 高级
  aliases: [UMI, UniversalManipulationInterface, 穿戴式采集, 手持夹爪, 数据采集设备, HiFi-UMI, 第一视角采集]
  what: 让人戴上手持夹爪 + 相机，在真实环境里边做事边采数据 —— 把「采数据的成本」从真机遥操作降到接近零。
  why: |
    这是当前具身数据采集**最重要的方向之一**，已经进入产业共识的
    「数据金字塔」第三层（底层互联网视频 → 中层第一视角 → **第三层 UMI 穿戴** → 顶层真机遥操作）。
    而且判断很明确：**随着模型泛化提升，高成本遥操作数据的需求会逐步减少，
    第一、三层的数据权重会持续提高**。
    懂不懂 UMI，基本等于知不知道当前数据采集的前沿在哪。
  how: |
    - **它解决的核心矛盾**：真机遥操作「一个人一天只能采 500-1000 条」，
      效率和成本根本撑不起规模化。UMI 的思路是**去掉机器人本体** ——
      只采人的动作，再用重定向转成机器人的动作。
    - **采集之后不是结束，还有一整套治理流程**：
      轨迹重建与清洗 → 仿真重定向 → AI 辅助标注 → 人工复核 → 分析导出。
      实测每道关卡的通过率约 98%，串联后基础有效率约 96%。
    - **最终每条有效示范应包含**：同步多视角视频、双手轨迹、
      夹爪状态、语言描述、子任务边界、质量记录。
    - **关键验证问题**：采到的数据能不能让机器人
      **在不补充真机数据的前提下**完成任务？
      这才是判断采集方案价值的标准。
    - **难点在于跨域**：采集环境与部署环境的光照、背景、
      相机视角往往不同（采集常在不同地点），
      所以策略还必须跨越额外的视觉分布差异。

    常见坑：以为设备精度决定数据质量。**高精度设备只保证原始信号质量**，
    真正的瓶颈在后面的治理与重定向环节。
  prerequisite: [teleoperation, retargeting, data-flywheel]
  learn_path:
    - understand 数据金字塔四层各适合什么任务
    - 了解 UMI 的硬件构成（手持夹爪 + 多视角相机 + 追踪）
    - 走一遍完整数据治理流程（清洗→重定向→标注→复核）
    - 设计一个"只用穿戴数据、不加真机数据"的验证实验
  jd_phrases: [UMI, 数据采集, 穿戴式, 示教数据, 第一视角]
  tags: [数据, 前沿, 稀缺]

- id: hardware-bus
  name: 硬件接口
  zh: 硬件接口与总线
  full_name: Hardware Interfaces (SPI / I2C / UART / PCIe)
  domain: robotics
  level: 进阶
  aliases: [SPI, I2C, UART, 串口, 串行总线, PCIe, USB, 接口协议, 通信接口, 硬件接口]
  what: 芯片与芯片、板子与板子之间怎么说话 —— 机器人内部所有数据流动的物理通道。
  why: |
    这是硬件岗的日常，也是**算法岗与硬件岗沟通的共同语言**。
    当你发现「传感器数据怎么就是读不到」时，问题往往在这一层。
    JD 里出现 SPI/I2C/PCIe，说明岗位要碰真实的板子。
  how: |
    - **一张选择表（面试常考）**：
      | 接口 | 速率 | 线数 | 典型用途 |
      |---|---|---|---|
      | **UART** | 低 | 2 | 调试串口、简单模块 |
      | **I2C** | 中低 | 2 | 低速传感器（温湿度、磁力计） |
      | **SPI** | 高 | 4 | 高速传感器（IMU、编码器）、Flash |
      | **PCIe** | 极高 | 多 | 相机、加速卡、GPU 互联 |
    - **各自的脾气**：
      - I2C 是总线结构（多设备共用），靠地址区分，**但地址冲突很常见**；
      - SPI 是点对点，快但每多一个设备就多一组片选线；
      - PCIe 是差分高速链路，**AI 集群里卡间通信的关键通道**。
    - **工程要点**：时钟极性与相位（SPI 的 CPOL/CPHA，
      配错就读出乱码）、上拉电阻（I2C 必需）、
      信号完整性、以及**不同接口的实时性差异**。

    常见坑：调试时先怀疑代码 ——
    实际上大部分「读不到数据」是接线、上拉电阻、时钟配置的问题。
  prerequisite: [embedded, electronics]
  learn_path:
    - 记住四种接口的速率与线数差别（能画表说明）
    - 用 SPI 读一个 IMU，用逻辑分析仪确认时序正确
    - 故意配错 CPOL/CPHA，看输出变成什么样
    - 了解 PCIe 的通道数与带宽关系（对 AI 集群很重要）
  jd_phrases: [SPI, I2C, UART, PCIe, 接口, 硬件通信]
  tags: [硬件, 基础]

- id: auto-quality-tools
  name: 汽车质量工具
  zh: 汽车行业五大质量工具
  full_name: IATF 16949 Core Tools (APQP / PPAP / SPC / MSA / FMEA)
  domain: product
  level: 进阶
  aliases: [APQP, PPAP, SPC, MSA, 五大工具, 核心工具, 质量控制计划, 过程能力, 测量系统分析]
  what: 汽车供应链强制要求的五套质量方法 —— 机器人公司要进车企供应链就必须过这一关。
  why: |
    这是一个很有信息量的现实：产业界的判断是
    **「绝大多数机器人零部件未通过汽车行业 IATF 16949 可靠性标准」**。
    这意味着谁能把这套东西做扎实，谁就能拿到车厂的量产订单。
    对产业岗（质量 / 项目 / 供应链 / 量产）来说，这是硬门槛。
  how: |
    - **五套工具各解决什么（务必分清）**：
      | 工具 | 管什么 |
      |---|---|
      | **APQP** | 产品先期质量策划 —— 项目从立项到量产的质量流程骨架 |
      | **PPAP** | 生产件批准 —— 量产前证明「我能稳定做出合格件」 |
      | **SPC** | 统计过程控制 —— 用控制图监控产线是否稳定 |
      | **MSA** | 测量系统分析 —— 先证明**量具本身可靠**（GR&R） |
      | **FMEA** | 失效模式分析 —— 提前找风险（见 fmea 词条） |
    - **逻辑顺序很重要**：MSA 在前（量都不准说什么控制），
      然后 SPC（测过程能力 Cpk/Ppk），
      APQP 贯穿全程，PPAP 是量产闸门。
    - **实用指标**：Cpk ≥ 1.33 是汽车行业常见要求；
      GR&R < 10% 才算测量系统可接受。

    常见坑：把 MSA 和 SPC 搞反 ——
    没先证明量具可靠，后面所有数据都不可信。
  prerequisite: [fmea, quality-system]
  learn_path:
    - 记清五套工具的分工与先后顺序
    - 学 Cpk / Ppk 的计算与判读标准
    - 做一次 GR&R 实验（同一零件多次测量，看重复性）
    - 画一张控制图，判断什么情况算"过程失控"
  jd_phrases: [APQP, PPAP, SPC, MSA, 过程能力, 质量控制]
  tags: [质量, 量产, 硬门槛]

- id: npi
  name: NPI
  zh: 新产品导入
  full_name: New Product Introduction
  domain: product
  level: 高级
  aliases: [NPI, 新产品导入, 量产导入, 试产, EVT, DVT, PVT, 爬坡, 良率提升, 工艺验证]
  what: 把「实验室里能跑的原型」变成「产线上能稳定量产的货」的那段过程。
  why: |
    这是机器人产业当前最缺的能力之一。
    产业共识说得很直接：**「算法模型属于软件问题，硬件是长期工程难题，
    大脑能力突破后，整机硬件会成为全新卡点。」**
    NPI 就是把硬件卡点逐个拆除的那套工程流程。
  how: |
    - **典型阶段（记住这缩写）**：
      EVT（工程验证，验证设计能不能work）→
      DVT（设计验证，验证设计是不是稳定）→
      PVT（生产验证，验证产线能不能做出来）→ MP（量产）。
    - **每个阶段的交付物差别很大**：EVT 只做几十台手板，
      DVT 要有测试报告和治具，PVT 要跑通产线节拍。
    - **核心矛盾**：设计变更越晚，成本越高 ——
      EVT 阶段改一个结构可能几百块，量产后改就是产线停线。
      所以 NPI 的价值在于**把问题尽量提前暴露**。
    - **必须同时推进的三件事**：良率爬坡、成本下降、
      供应链产能。三者任何一个卡住都无法量产。

    常见坑：用「实验室良率」汇报 NPI 进展 ——
    实验室环境干净、操作者是工程师、可以挑零件；
    产线上是普通工人、连续作业、来料波动。**两者不是一个数**。
  prerequisite: [project-management, fmea, mech-design]
  learn_path:
    - 记清 EVT/DVT/PVT/MP 各阶段的目标与交付物
    - 了解一次真实的产品导入流程（可以找一个硬件的拆解报告）
    - 理解"变更成本随阶段指数上升"这条曲线
    - 分析良率爬坡的常见障碍（来料、工艺、测试）
  jd_phrases: [NPI, 新产品导入, 量产, 试产, 良率, EVT, PVT]
  tags: [量产, 流程]

- id: emc
  name: 电磁兼容
  zh: 电磁兼容
  full_name: Electromagnetic Compatibility
  domain: robotics
  level: 高级
  aliases: [EMC, EMI, 电磁兼容, 电磁干扰, 屏蔽, 接地, 滤波, 认证测试, 辐射发射]
  what: 保证设备「自己不乱干扰别人，也不被别人干扰坏」—— 通不过 EMC 测试就上不了市。
  why: |
    这是一个典型的「**没做过硬件就完全想不到**」的知识点。
    机器人上电机、驱动器、大电流线缆和弱信号传感器混在一起，
    电磁环境极其恶劣。而产业界的现实是：
    **零部件要过 IATF 16949 / 各类认证，EMC 是必测项**。
  how: |
    - **两个方向**：
      - **EMI（发射）**：你的设备向外辐射多少干扰 —— 别影响别人；
      - **EMS（抗扰）**：别人干扰你时你还正常吗 —— 别被影响。
    - **三大手段**：屏蔽（挡）、接地（导走）、滤波（滤掉）。
      三者的组合与顺序很讲究 —— 单点接地 vs 多点接地
      在高频和低频下的选择是相反的。
    - **机器人特有的坑**：
      1. 电机启动瞬间的大电流会通过地线耦合到传感器；
      2. 电机的 PWM 开关噪声频段很宽，容易打中 IMU 和编码器；
      3. 长线缆等于天线，会辐照也会接收。
    - **工程对策**：强弱电分离走线、光耦/隔离器件、
      磁环、双绞线、屏蔽层单端接地。

    常见坑：**电机一启动，控制系统就复位** ——
    十有八九是电源没做隔离，大电流把 MCU 的供电拉崩了。
  prerequisite: [electronics, hardware-bus]
  learn_path:
    - 分清 EMI 和 EMS 两个方向
    - 理解屏蔽/接地/滤波各自解决什么问题
    - 找一个真实案例（电机启动导致传感器异常），分析耦合路径
    - 画一张强弱电分离的走线方案
  jd_phrases: [EMC, EMI, 电磁兼容, 屏蔽, 接地, 认证]
  tags: [硬件, 认证]

- id: checkpoint-resilience
  name: 训练容错
  zh: Checkpoint 与训练容错
  full_name: Checkpointing & Training Fault Tolerance
  domain: ai
  level: 高级
  aliases: [Checkpoint, 检查点, 断点续训, 容错, 故障恢复, 弹性训练, 慢节点, 存盘, 训练中断]
  what: 让一个跑几十天、用几千张卡的训练任务，在硬件必然出故障的前提下还能跑完。
  why: |
    这是一条**只有真跑过大集群才知道的工程现实**：
    卡越多，平均无故障时间越短。几千卡的集群里，
    **每天有节点挂掉是常态，不是异常**。
    面试问这个，问的是你有没有真的把训练跑到过终点。
  how: |
    - **必须量化的账**：卡数 × 单卡故障率 → 集群 MTBF。
      如果训练要 30 天而集群 MTBF 是 2 天，
      那么**不做容错根本跑不完** —— 这个计算是面试加分项。
    - **Checkpoint 的关键设计**：
      1. **频率**：太密拖慢训练（存盘要同步等待），太疏丢进度太多。
         常见做法是异步存盘 + 分层存储；
      2. **内容**：模型参数、优化器状态（**必须包含，否则续训后
         Adam 的二阶矩丢失会导致 loss 跳变**）、
         学习率调度器状态、数据加载器位置、随机数状态；
      3. **存储**：几百 GB 到 TB 级，必须走并行文件系统，
         不能靠单机磁盘。
    - **慢节点（straggler）**：不一定挂，但比别人慢 ——
      同步训练里会拖住所有人。需要检测与踢出机制。
    - **弹性训练**：允许节点动态加入/退出，配合重启自动恢复。

    常见坑：只存模型参数不存优化器状态 ——
    续训后 loss 会突然变差，因为优化器的动量信息没了。
  prerequisite: [parallelism, linux]
  learn_path:
    - 算一次你目标集群的 MTBF，判断需不需要容错
    - 设计一个 checkpoint 策略（频率、内容、存储）
    - 理解为什么优化器状态必须一起存
    - 做一次手动杀进程再恢复的实验，验证续训一致性
  jd_phrases: [Checkpoint, 容错, 断点续训, 故障恢复, 弹性训练]
  tags: [训练, 工程]

- id: hf-ecosystem
  name: Hugging Face 生态
  zh: Hugging Face 生态
  full_name: Hugging Face Ecosystem
  domain: ai
  level: 入门
  aliases: [HuggingFace, Hugging Face, transformers库, datasets库, accelerate, peft, Diffusers, 模型库, 权重下载, Hub]
  what: AI 领域的「GitHub + npm」—— 模型权重、数据集、训练库都在这儿，是整个开源生态的基础设施。
  why: |
    JD 里点名它，意味着岗位要用**开源模型而不是从零训**。
    这在实际工作中是常态：99% 的公司不做预训练，
    做的是微调、蒸馏、部署。**不会用这套生态等于进不了门**。
  how: |
    - **几个核心库各自的职责**：
      | 库 | 管什么 |
      |---|---|
      | `transformers` | 加载/推理/微调各类模型，统一接口 |
      | `datasets` | 数据集加载与流式处理（大数据集不会撑爆内存） |
      | `peft` | 参数高效微调（LoRA / QLoRA） |
      | `accelerate` | 一份代码跑单卡/多卡/混合精度 |
      | `diffusers` | 扩散模型（图像/视频生成） |
    - **实际工作流**：从 Hub 拉权重 → 用 peft 做 LoRA →
      用 accelerate 上多卡 → 量化后部署。
    - **工程注意**：
      1. **国内下载**：Hub 直连不稳，要用镜像源（HF_ENDPOINT）
         或提前缓存到本地，否则 CI 里天天挂；
      2. **版本锁定**：模型权重与代码版本要锁，
         否则某天上游改了 tokenizer 你的复现就失败了；
      3. **许可证**：Hub 上模型的商用许可各不相同，
         要看清再用于产品。

    常见坑：直接把 Hub 上的模型当生产依赖 ——
    没做本地缓存和版本锁定，某天上游删库或改版，
    你的服务就直接起不来。
  prerequisite: [pytorch, llm]
  learn_path:
    - 跑通「下载模型 → 推理 → LoRA 微调 → 保存」完整链路
    - 用 datasets 的流式模式处理一个超大文件
    - 配好国内镜像与本地缓存（这是团队协作的必备）
    - 建一个自己的模型缓存目录结构并锁定版本
  jd_phrases: [HuggingFace, transformers, 模型库, 开源模型, 微调]
  tags: [生态, 入门]

- id: hmi
  name: HMI
  zh: 人机交互界面
  full_name: Human-Machine Interface
  domain: robotics
  level: 进阶
  aliases: [HMI, 人机界面, 上位机, 示教器, 操作界面, 监控界面, 交互设计, 遥操作界面]
  what: 人怎么指挥和监控机器人 —— 从工业示教器到 VR 遥操作界面都算。
  why: |
    这是**产品岗和工程岗的交汇点**，也是机器人落地时最容易被低估的环节：
    客户买回去谁会用？现场工人培训多久能上手？
    产业界的判断很清醒：「**每一次落地都需要大量调优工作**」，
    而 HMI 就是降低这个成本的关键。
  how: |
    - **三类典型场景**：
      1. **工业示教器**：示教 → 编程 → 运行，强调可靠与容错；
      2. **遥操作界面**：VR/手柄实时控制，强调低延迟与临场感
         （采集数据时也用它）；
      3. **运维监控面板**：状态、日志、告警，强调信息密度与可诊断性。
    - **机器人 HMI 的特殊要求**：
      - **延迟必须可见且稳定** —— 界面卡 200ms 操作者就会误判；
      - **安全交互**：急停必须物理按钮，不能只做在界面上；
      - **状态可视化**：操作者要知道机器人"在想什么"
        （当前任务、下一步、是否困惑），否则不敢放手让它干。
    - **设计原则**：宁可显示少量准确信息，
      不要把几十个参数堆在屏幕上 —— 现场没人看得过来。

    常见坑：按写 Web 后台的思路做机器人界面 ——
    忽略实时性和"操作者需要心理安全感"这两点。
  prerequisite: [requirement-analysis, typescript]
  learn_path:
    - 体验一次工业示教器（或看操作视频），记录它为什么这么设计
    - 为 VR 遥操作设计一个界面，标出每块信息的刷新频率要求
    - 想清楚「如何让操作者信任机器人」，用一个界面元素实现它
    - 做一次可用性测试：让不懂的人试用，记录卡在哪
  jd_phrases: [HMI, 人机界面, 上位机, 交互设计, 操作界面]
  tags: [产品, 落地]
