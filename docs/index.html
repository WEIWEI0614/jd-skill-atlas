<style>
:root{--bg:#0b0f14;--panel:#141a21;--panel2:#1b222b;--line:#2a333e;--fg:#e6edf3;--dim:#8b949e;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(11,15,20,.94);backdrop-filter:blur(10px);

h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}
h1 small{color:var(--dim);font-weight:400;font-size:11.5px;margin-left:6px}
.spacer{flex:1}
input[type=search]{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
color:var(--fg);padding:7px 12px;font:inherit;font-size:13px;width:230px}
input[type=search]:focus{outline:none;border-color:var(--accent)}
button{font:inherit;font-size:12.5px;border-radius:7px;border:1px solid var(--line);
background:var(--panel2);color:var(--fg);padding:6px 12px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:#1f6feb22;border-color:var(--accent);color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:20px 22px 80px}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.stat .n{font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.stat .l{font-size:11.5px;color:var(--dim);margin-top:2px}
.progress{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;
margin-bottom:20px}
.progress .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,#3fb950,#58a6ff);
transition:width .3s}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tabs button{padding:6px 14px}
.tier-note{font-size:12px;color:var(--dim);margin-bottom:14px;padding-left:2px}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:9px;
margin-bottom:9px;overflow:hidden;transition:.15s}
.skill:hover{border-color:#3d4a58}
.skill.must{border-left:3px solid var(--must)}
.skill.nice{border-left:3px solid var(--nice)}
.skill.rare{border-left:3px solid var(--rare)}
.skill.have{opacity:.62}
.head{display:flex;align-items:baseline;gap:12px;padding:13px 16px;cursor:pointer;flex-wrap:wrap}
.head .nm{font-size:14.5px;font-weight:550}
.head .zh{color:var(--dim);font-size:12.5px;font-weight:400}
.head .pct{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap}
.head .lv{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.cbar{height:4px;background:var(--panel2);margin:0 16px 10px;border-radius:2px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--accent)}
.body{padding:0 16px 16px;display:none;border-top:1px solid var(--line);margin-top:2px}
.skill.open .body{display:block}
.body h4{font-size:12.5px;color:var(--accent);margin:14px 0 6px;font-weight:600;letter-spacing:.3px}
.body p{margin:0 0 8px;white-space:pre-wrap}
.body ol,.body ul{margin:0 0 8px;padding-left:20px}
.body li{margin-bottom:5px}
.body blockquote{margin:6px 0;padding:7px 12px;border-left:2px solid var(--line);
background:var(--panel2);border-radius:0 6px 6px 0;color:var(--dim);font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;
background:var(--panel2);border:1px solid var(--line);color:var(--dim);margin:0 5px 5px 0}
.tag.pre{border-color:#9e6a03;color:var(--nice)}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--dim);text-align:center;padding:50px 20px;font-style:italic}
.gapbox{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--purple);
border-radius:9px;padding:15px 17px;margin-bottom:18px}
.gapbox h3{margin:0 0 8px;font-size:14px}
.gapbox .miss{color:var(--must);font-size:12.5px}
.loading{color:var(--dim);text-align:center;padding:30px}
.dom{font-size:11px;color:var(--dim);background:var(--panel2);border-radius:4px;padding:1px 6px}
</style>
</head>

"why": "它有个别的加速手段没有的性质：**数学上保证输出分布不变**。\n蒸馏和剪枝都会改变模型行为，投机解码不会 ——\n这是它优于其他加速方案的关键，也是面试最常追问的点。\n典型收益 2-4 倍解码提速。", "how": "- **为什么能加速（关键洞察）**：\n  它**并不缩短大模型单次前向的时间**。\n  它做的是把「多个显存受限的单步」**合并成一次前向**——\n  解码是带宽受限的，读一次权重只服务一个 token 太浪费；\n  一次验证 5 个候选，等于同样的权重读取服务了更多 token。\n- **为什么分布不变**：验证时对每个候选 token 做接受/拒绝采样，\n  拒绝时从**残差分布**里重新采。这个设计保证最终分布与目标模型完全一致。\n- **收益取决于什么**：草稿模型质量（越准接受率越高）、\n  草稿成本、批次大小、目标硬件。\n  **在输出可预测的任务上效果好，开放生成任务收益会下降。**\n- **改进方向**：Medusa（多解码头一次出多个候选）、\n  EAGLE（在特征层做草稿）、Tree Attention（并行验证树形候选）。\n\n常见坑：以为它能降低延迟上限。它降低的是**单位 token 的平均成本**，\n不改变单次前向的耗时。高并发下收益也会被批次摊薄。", "prerequisite": ["continuous-batching", "kv-cache"], "learn_path": ["讲清楚「为什么不改变输出分布」（这是面试必答）", "理解「合并多个带宽受限步骤」这个加速本质", "实测一次：不同草稿模型下的接受率与净收益", "对比 Medusa / EAGLE 与朴素草稿模型的差别"], "tags": ["推理", "面试高频"], "aliases": ["投机解码", "SpeculativeDecoding", "草稿模型", "draft模型", "并行验证", "Medusa", "EAGLE", "推测解码"], "count": 3, "coverage": 0.0085, "jobs": ["大模型效率研究员-模型结构方向 @ MiniMax", "推理优化工程师，高性能C++ @ 商汤科技", "大模型技术招聘负责人 @ MiniMax"], "samples": ["…KV cache 管理、Prefill/Decode 分离及投机解码的适配关系，形成可落地的系统方案。 - 完成原型与实验验证：…", "…个或多个核心方向的方案设计、关键模块开发和生产落地： 1. 投机解码与算法–系统协同优化：设计与实现 MTP、EAGLE 等投机…", "…, Process Reward Model, RLHF, Speculative Decoding 等词汇时能保持兴奋与敏感。 乐于关注 arXiv 每日最新…"]}, {"id": "continuous-batching", "name": "连续批处理", "zh": "连续批处理", "full_name": "Continuous Batching", "domain": "ai", "domain_label": "人工智能", "level": "高级", "what": "每个解码步都重新组批 —— 完成的请求立刻退出、排队的请求立刻补进来，而不是等一整批全部跑完。", "why": "**这一步的收益常被低估**。传统静态批次会让先完成的请求空等：\n一个 10 token 的请求如果和 500 token 的请求同批，\n它算完后 GPU 就在为它空转。\n连续批处理把「批」从请求粒度变成 **iteration 粒度**，吞吐提升非常可观。", "how": "- **调度器在每个 step 做什么**（这是核心逻辑）：\n  1. 检查哪些请求已完成 → 释放它们的显存（尤其是 KV Cache）；\n  2. 从队列里取新请求补进来 → 最大化 GPU 利用率；\n  3. 动态调整 batch size，避免 OOM。\n- **为什么必须配合分页**：请求动态进出意味着 KV 长度参差不齐，\n  不做分页管理就只能预留最大长度，等于白干。\n  **连续批处理 + PagedAttention 是一对，不能拆开谈。**\n- **Ragged batch 问题**：不同长度混在一起会形成参差不齐的批。\n  Attention 需要记录每个请求的边界，\n  其他算子可以先拼接再统一处理。\n- **和延迟的取舍**：批次越大吞吐越高（一次权重读取服务更多序列），\n  但延迟会变差。**交互式对话、离线批处理、RL rollou 常低于 IPO，且需要找到买家；\n- **老股转让**：在后续轮次中直接卖给新投资人。灵活但受限于流动性；\n- **回购/清算**：兜底手段，通常意味着投资失败。\n\n当前市场现实：**IPO 通道收窄，S 基金和并购成为主要退出方式**。\n这是 2026 年一级市场的关键词。\n\n常见坑：投的时候不看退出路径 ——\n「这笔投资将来谁会买」应该在投前就想清楚。", "prerequisite": ["fund-lifecycle"], "learn_path": ["理解四种退出路径的适用条件和周期", "研究 S 基金（二手份额）的交易逻辑", "关注 A 股/港股 IPO 政策变化对退出预期的影响"], "tags": ["核心", "进阶"], "aliases": ["退出", "Exit", "IPO", "并购退出", "股权转让", "回购", "清算", "S基金"], "count": 2, "coverage": 0.0056, "jobs": ["战略投资经理 @ 商汤科技", "大模型生态渠道经理 @ MiniMax"], "samples": ["…科、金融、经济、管理等相关专业优先。 2. 有完整项目投资或退出经验者优先。", "…： 设计具备竞争力的激励机制、返点政策、授信管理及伙伴准入/退出标准，确保渠道生态的健康与利差空间。 2. 伙伴拓展与云厂资…"]}, {"id": "long-context", "name": "长上下文", "zh": "长上下文技术", "full_name": "Long-Context Techniques", "domain": "ai", "domain_label": "人工智能", "level": "专家", "what": "让模型能处理远超训练长度的输入 —— 难点不在「塞得下」，而在「塞进去之后还记得住」。", "why": "这是当前模型能力竞争最激烈的方向之一，也是**最容易被营销误导**的方向。\n面试问长上下文，考的是你知不知道「支持 1M 上下文」这句话背后\n哪些是真实能力、哪些是工程口径。", "how": "- **两条技术路线**：\n  1. **压缩 KV**：GQA/MQA（减头）、MLA（压到潜空间）、\n     跨层共享、滑窗注意力（截断历史）、\n     局部+全局交错（少数层保留全注意力）；\n  2. **改注意力结构**：稀疏注意力（BigBird / Longformer）、\n     低秩近似、扩张式注意力（LongNet）、\n     **线性注意力与状态空间模型**（把历史压成固定状态，\n     代价是精确检索能力下降）。\n- **位置编码外推**：模型训练时只见过 4k 长度，\n  直接喂 128k 会因为位置编码没外推过而崩掉。\n  需要 RoPE scaling / YaRN 这类方法把频率调好。\n- **评测必须三个维度一起看**（这是最能体现判断力的地方）：\n  **长上下文准确率 + 解码延迟 + 每 token 缓存字节数**。\n  只报最大长度是营销，不是能力。\n- **经典的失效模式**：中间遗忘（lost in the middle）——\n  把关键信息放在长文档中间，模型召回率明显低于首尾。\n\n常见坑：拿「大海捞针」（needle in a haystack）测试通过\n就宣称长上下文能力强。那测的是检索，不是推理 ——\n真实任务是需要在长文档里**综合多处信息做推理**。", "prerequisite": ["kv-cache", "transformer", "benchmark"], "learn_path": ["理解「塞得下」和「记得住」是两件事", "学 RoPE 外推的基本原理（为什么不能直接拉长）", "自己测一次中间遗忘：关键信息放不同位置，看召回率变化", "对比一个真实长文档任务在不同注意力方案下的表现"], "tags": ["模型", "前沿"], "aliases": ["长上下文", "上下文窗口", "位置编码外推", "RoPE外推", "YaRN", "注意力稀疏化", "滑窗注意力", "线性注意力", "状态空间模型", "上下文扩展"], "count": 2, "coverage": 0.0056, "jobs": ["大模型效率研究员-模型结构方向 @ MiniMax", "推理优化工程师，高性能C++ @ 商汤科技"], "samples": ["…结构与训练、推理系统的联合设计，并有规模化落地经验。 - 在长上下文、稀疏 Attention、MoE、低精度训练与推理、KV…", "…节点共享；结合 RDMA、异步 I/O 与计算传输重叠，解决长上下文、多轮对话及 Agent 场景中的容量、带宽和尾延迟问题。…"]}, {"id": "paged-attention", "name": "PagedAttention", "zh": "分页注意力 / KV 显存分页", "full_name": "PagedAttention", "domain": "ai", "domain_label": "人工智能", "level": "高级", "what": "借操作系统「虚拟内存分页」的思路管理 KV Cache —— 不再给每个请求预分配一整块连续显存，而是切成固定大小的 block 按需分配。", "why": "这是 **vLLM 的核心原理**，也是推理服务的基准线。\n它解决的是一个非常具体的浪费：传统做法按最大长度预分配，\n  **实际显存利用率可能只有 40%**；\n分页之后碎片率降到 5% 以下，吞吐直接翻几倍。\n面试问它，考的是「你会不会算账、知不知道优化省在哪」。", "how": "- **问题长什么样**：传统方案给每个请求预留 max_len 大小的连续 KV 区。\n  一个只用了 200 token 的请求，如果按 4096 预留 —— 95% 的显存白占。\n  而且请求长短不一，还会产生**外部碎片**（块太小用不上）。\n- **解法**：把 KV 切成固定大小的 block（通常 16 或 32 token），\n  用一张**页表**把逻辑位置映射到物理块，\n  块之间不必连续。因此显存可以按需增长、随用随取。\n- **顺带得到的两个能力**：\n  1. **前缀共享** —— 多个请求有相同系统提示词时，\n     直接指向同一批物理块，不用各算一份；\n  2. **并行采样** —— 一个 prompt 生成多个结果时共享前缀块。\n- **源码视角**：`block_manager` 负责块的分配/回收/映射，\n  支持 block 级的前缀缓存。\n\n常见坑：以为它只是「省显存」。它更大的价值在于\n**让连续批处理成为可能** —— 没有分页，动态进出批次会立刻 OOM。", "prerequisite": ["kv-cache", "cuda", "docker"], "learn_path": ["算一遍「预分配 vs 分页」的显存浪费对比（用真实请求长度分布）", "读 vLLM 的 block_manager 源码，理解页表映射", "实测开/关前缀缓存的吞吐差异", "观察 block size 取 8 / 16 / 32 对性能的影响"], "tags": ["推理", "核心", "面试高频"], "aliases": ["PagedAttention", "分页注意力", "显存分页", "block管理", "显存碎片", "vLLM核心"], "count": 1, "coverage": 0.0028, "jobs": ["大模型云端推理架构与部署工程师 @ 千寻智能"], "samples": ["…并行（TP/PP）、Continuous Batching、PagedAttention、K8s/Docker容器编排、API网关及系统可观测性建设…"]}, {"id": "term-sheet", "name": "TS", "zh": "投资条款清单", "full_name": "Term Sheet", "domain": "investment", "domain_label": "投资 / 金融", "level": "进阶", "what": "投资意向的「合同骨架」—— 估值多少、占多少股、有什么特殊权利，都写在这。", "why": "投资执行的核心交付物。看不懂 TS 就没法上谈判桌。\n涉及的核心条款是投资岗的必备常识，面试高频。", "how": "必须掌握的几条：\n- **估值与股权**：投前估值（Pre-money）vs 投后估值（Post-money）。\n  投后 = 投前 + 本轮投资额。占股比 = 投资额 / 投后估值。\n- **优先清算权（Liquidation Preference）**：\n  公司被卖掉时，投资人先拿回本金（1x）还是翻倍（2x）。\n  1x 非参与型对创始人友好，参与型（participating）对投资人有利。\n- **反稀释（Anti-dilution）**：后续融资估值降低时怎么补偿。\n  完全棘轮（full ratchet）对创始人极狠，加权平均（weighted average）较温和。\n- **领售权（Drag-along）**：多数 存有限，冷门前缀要被换出去。\n- **什么时候收益最大**：\n  - 长系统提示 + 大量并发（Agent、客服机器人）；\n  - few-shot 示例固定；\n  - 多轮对话（历史越长收益越大）；\n  - RAG 场景中同样的检索文档反复使用。\n- **什么时候没收益**：每个请求前缀都不同（比如个性化 prompt 放最前面）。\n  **顺序很重要** —— 把固定内容放前面、变量放后面，命中率天差地别。\n\n常见坑：把变量内容（用户 ID、时间戳）放在系统提示最前面 ——\n这会让每一个请求的前缀都不同，缓存命中率直接归零。", "prerequisite": ["paged-attention", "kv-cache", "inference-framework"], "learn_path": ["理解「前缀共享」为什么能省掉整段 prefill 计算", "实测一次：开/关前缀缓存的 TTFT 差异", "刻意做一次反例实验（变量放最前），观察命中率塌陷", "读 SGLang 的 RadixAttention 设计文档"], "tags": ["推理", "服务层"], "aliases": ["前缀缓存", "RadixAttention", "前缀复用", "系统提示缓存", "缓存命中", "缓存淘汰", "滚动哈希"], "count": 1, "coverage": 0.0028, "jobs": ["推理优化工程师，高性能C++ @ 商汤科技"], "samples": ["…、主机内存及 SSD 上的多级 KV Cache 系统，优化前缀复用、缓存索引、淘汰、预取和跨节点共享；结合 RDMA、异步 I…"]}, {"id": "retargeting", "name": "动作重定向", "zh": "动作重定向", "full_name": "Motion Retargeting", "domain": "robotics", "domain_label": "机器人 / 具身智能", "level": "高级", "what": "把「人的动作」翻译成「机器人关节能执行的动作」—— 因为人机之间自由度数量、肢体比例、关节限位全都不一样。", "why": "这是**具身数据采集链条上最关键的转换环节**。\n当前主流采集方式（VR 遥操作、动捕、UMI 穿戴）采到的都是**人体动作**，\n必须经过重定向才能变成训练数据。\n产业上已有成熟工具（如 General Motion Retargeting），但调参仍然很吃经验。", "how": "- **核心矛盾**：人有 200+ 自由度，七自由度人形机器人只有 20-40 个。\n  直接映射会产生「人手够得到、机器人够不到」的问题。\n- **常见做法**：\n  1. 提取人体关键点（动捕 / VR 追踪 / 视觉姿态估计）；\n  2. 解一个优化问题：让机器人末端尽量贴合人体末端，\n     同时满足关节限位、不自碰撞、质心在支撑区内；\n  3. 保证时序连续性（动作不能抖）。\n- **两条路线**：几何重定向（基于 IK，稳定但生硬）\n  vs 学习方法（用神经网络学映射，自然但泛化性存疑）。\n- **配套的还有「重放（replay）」**：重定向后的动作需要\n  在仿真里回放检查是否超出工作空间、双臂是否碰撞、\n  夹爪状态是否合理 —— 实测通过率约 98%。\n- **数据分层采集体系（产业共识）**：\n  底层互联网视频 → 中层第一视角操作 → **第三层 UMI 穿戴采集** →\n  顶层真机遥操作。四层互补，**数据质量永远优于数据体量**。\n\n常见坑：只关注末端位置对齐，忽略**动力学可行性** ——\n重定向出来的动作看起来对，但机器人执行时力矩超限。", "prerequisite": ["kinematics", "optimization"], "learn_path": ["理解人机自由度数量差异为什么是根本矛盾", "用 IK 手工实现一个简化的重定向（只对末端位置）", "加上关节限位和质心约束，看动作怎么被「挤」变形", "了解 UMI / 动捕 / VR 三种采集方式各自的信号特点"], "tags": ["数据", "前沿"], "aliases": ["重定向", "Retargeting", "GMR", "人体动作映射", "动作迁移", "主从映射", "人体姿态到机器人"], "count": 1, "coverage": 0.0028, "jobs": ["数据挖掘算法工程师 @ 北京人形机器人创新中心"], "samples": ["…、动作边 <script>
const $ = s => document.querySelector(s);
const api = async (p, body) => (await fetch(p, body ? {
  method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
} : {})).json();
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DATA = null, HAVE = new Set(JSON.parse(localStorage.getItem('atlas_have') || '[]'));
let TIER = 'all', GAPONLY = false, Q = '';

const TIER_LABEL = {must:['🔴 必备','≥25% 的岗位都要求 —— 这是入场券'],
                    nice:['🟡 加分','8%–25%，会让你在候选池里更靠前'],
                    rare:['🟢 差异化','<8%，少见但一旦命中就是优势']};

function tierOf(id){
  if(!DATA?.tiers) return 'rare';
  if(DATA.tiers.must.includes(id)) return 'must';
  if(DATA.tiers.nice.includes(id)) return 'nice';
  return 'rare';
}

function saveHave(){
  localStorage.setItem('atlas_have', JSON.stringify([...HAVE]));
  api('/api/have', {have: [...HAVE]});
}

function render(){
  if(!DATA || DATA.empty){
    $('#app').innerHTML = `<div class="empty">
      还没有分析结果。<br><br>
      在终端运行：<br>
      <code style="background:#1b222b;padding:6px 12px;border-radius:6px;display:inline-block;margin-top:8px">
      atlas analyze &lt;JD文件或目录&gt;</code><br><br>
      然后刷新本页。
    </div>`;
    return;
  }

  const skills = DATA.skills || [];
  const total = DATA.total_jds || 1;

  let list = skills.filter(s => {
    const t = tierOf(s.id);
    if(TIER !== 'all' && t !== TIER) return false;
    if(GAPONLY && HAVE.has(s.id)) return false;
    if(Q){
      const hay = [s.name,s.zh,s.full_name,...(s.aliases||[]),...(s.tags||[])].join(' ').toLowerCase();
      if(!hay.includes(Q)) return false;
    }
    return true;
  });

  const mustN = (DATA.tiers?.must||[]).length;
  const haveMust = (DATA.tiers?.must||[]).filter(id=>HAVE.has(id)).length;
  const pct = mustN ? Math.round(haveMust/mustN*100) : 0;

  let html = `<div class="overview">
    <div class="stat"><div class="n">${total}</div><div class="l">分析的 JD 条数</div></div>
    <div class="stat"><div class="n">${skills.length}</div><div class="l">命中的技能</div></div>
    <div class="stat"><div class="n">${mustN}</div><div class="l">必备能力</div></div>
    <div class="stat"><div class="n">${HAVE.size}</div><div class="l">你已掌握</div></div>
  </div>`;

  if(mustN){
    html += `<div class="progress">
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <span>必备能力掌握进度</span>
        <b style="color:var(--ok)">${haveMust}/${mustN} · ${pct}%</b>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>`;
  }

  html += `<div class="tabs">
    <button data-tier="all" class="${TIER==='all'?'on':''}">全部 ${skills.length}</button>
    ${['must','nice','rare'].map(t=>{
      const n = (DATA.tiers?.[t]||[]).length;
      return `<button data-tier="${t}" class="${TIER===t?'on':''}">${TIER_LABEL[t][0]} ${n}</button>`;
    }).join('')}
  </div>`;

  if(TIER !== 'all') html += `<div class="tier-note">${TIER_LABEL[TIER][1]}</div>`;

  if(!list.length){
    html += `<div class="empty">没有匹配的技能。</div>`;
  } else {
    html += list.map(s => {
      const t = tierOf(s.id), p = Math.round((s.coverage||0)*100);
      const has = HAVE.has(s.id);
      const open = false;
      return `<div class="skill ${t}${has?' have':''}" data-id="${esc(s.id)}">
        <div class="head">
          <span class="nm">${esc(s.name)}</span>
          ${s.zh && s.zh!==s.name ? `<span class="zh">${esc(s.zh)}</span>`:''}
          <span class="lv">${esc(s.level||'')}</span>
          <span class="dom">${esc(s.domain_label||s.domain||'')}</span>
          <span class="pct" style="color:${t==='must'?'var(--must)':t==='nice'?'var(--nice)':'var(--rare)'}">${p}%</span>
        </div>
        <div class="cbar"><i style="width:${p}%;background:${t==='must'?'var(--must)':t==='nice'?'var(--nice)':'var(--rare)'}"></i></div>
        <div class="body">
          ${s.what?`<h4>一句话</h4><p>${esc(s.what)}</p>`:''}
          ${s.why?`<h4>为什么这个岗位要它</h4><p>${esc(s.why)}</p>`:''}
          ${s.how?`<h4>展开说说</h4><p>${esc(s.how)}</p>`:''}
          ${(s.prerequisite||[]).length?`<h4>前置技能</h4><div>${s.prerequisite.map(x=>`<span class="tag pre">${esc(x)}</span>`).join('')}</div>`:''}
          ${(s.learn_path||[]).length?`<h4>怎么学</h4><ol>${s.learn_path.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
          ${(s.samples||[]).length?`<h4>JD 里是这么说的</h4>${s.samples.map(x=>`<blockquote>${esc(x)}</blockquote>`).join('')}`:''}
          ${(s.jobs||[]).length?`<h4>出现在这些岗位</h4><div>${s.jobs.slice(0,8).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}
          <div class="actions">
            <button data-toggle="${esc(s.id)}">${has?'✓ 已掌握（点击取消）':'标记为已掌握'}</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  $('#app').innerHTML = html;

  document.querySelectorAll('.head').forEach(h => h.onclick = e => {
    if(e.target.closest('button')) return;
    h.parentElement.classList.toggle('open');
  });
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.toggle;
    HAVE.has(id) ? HAVE.delete(id) : HAVE.add(id);
    saveHave(); render();
  });
  document.querySelectorAll('[data-tier]').forEach(b => b.onclick = () => {
    TIER = b.dataset.tier; render();
  });
}

$('#q').oninput = e => { Q = e.target.value.trim().toLowerCase(); render(); };
$('#btnGap').onclick = () => {
  GAPONLY = !GAPONLY;
  $('#btnGap').classList.toggle('on', GAPONLY);
  $('#btnGap').textContent = GAPONLY ? '显示全部' : '只看缺口';
  render();
};

(async () => {
  DATA = await api('/api/atlas');
  if(DATA && !DATA.empty && (DATA.have||[]).length) DATA.have.forEach(x=>HAVE.add(x));
  render();
})();
</script>
</body>
</html>
