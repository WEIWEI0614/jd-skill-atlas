# 自定义技能词典示例
# ---------------------------------------------------------------------------
# 用法：复制到 ~/.jd-skill-atlas/skills/ 下，就会参与抽取。
# 文件名与内置文件同名（如 ai.yaml）时会**覆盖**内置版本；
# 用别的文件名（如 my-skills.yaml）则是**追加**。
#
# 每个词条必须三层齐全（what / why / how），否则测试会报错 ——
# 只写一个定义，对这个工具来说是没有价值的。
# ---------------------------------------------------------------------------

label: 我的自定义技能

skills:

- id: my-domain-skill
  name: 示例技能
  zh: 示例技能中文名
  full_name: Example Skill
  domain: soft              # ai / robotics / investment / tools / common / soft / data / product
  level: 进阶               # 入门 / 进阶 / 高级 / 专家
  # aliases 会参与匹配。注意：**不要放「协同」「沟通」这类太泛的词** ——
  # 它们到处出现，会造成大面积误判（项目里有测试会拦住这种写法）。
  aliases: [示例技能, Example Skill, 示例技能的英文写法]
  what: 一句话说清这是什么。
  why: |
    为什么这个岗位会要求它 —— 帮使用者判断自己要不要补。
  how: |
    展开解释：原理是什么、怎么落地、有哪些常见的坑。
    这一层是真正让人学到东西的地方，值得多写几句。
  prerequisite: [python]    # 前置技能的 id（会自动排进学习路径）
  learn_path:
    - 第一步：先把概念搞明白
    - 第二步：动手跑通一个最小例子
    - 第三步：在真实场景里用一次
  jd_phrases: [JD 里常见的说法一, 说法二]
  tags: [示例]
